<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwind Bank Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F6F7F9; --line:#E4E7EC; --line-2:#D5DAE1;
  --text:#0F172A; --text-2:#475467; --text-3:#8A94A6;
  --brand:#0B5FFF; --brand-2:#E8F0FF; --brand-ink:#0A3FA8;
  --ink:#0B1B3A;            /* hero / card navy */
  --ok:#0E9F6E; --ok-bg:#E7F7F0; --warn:#B7791F; --warn-bg:#FFF6E5; --bad:#D92D20; --bad-bg:#FEEFEE;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
  --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0F17; --surface:#121826; --surface-2:#182033; --line:#232C3F; --line-2:#2E3950;
    --text:#E8ECF3; --text-2:#A9B3C5; --text-3:#6F7A90;
    --brand:#4C8DFF; --brand-2:#16264A; --brand-ink:#9DBEFF; --ink:#0E2350;
    --ok:#3CCB97; --ok-bg:#10291F; --warn:#E3A846; --warn-bg:#2B2210; --bad:#F2675C; --bad-bg:#2E1515;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0F17; --surface:#121826; --surface-2:#182033; --line:#232C3F; --line-2:#2E3950;
  --text:#E8ECF3; --text-2:#A9B3C5; --text-3:#6F7A90;
  --brand:#4C8DFF; --brand-2:#16264A; --brand-ink:#9DBEFF; --ink:#0E2350;
  --ok:#3CCB97; --ok-bg:#10291F; --warn:#E3A846; --warn-bg:#2B2210; --bad:#F2675C; --bad-bg:#2E1515;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:260px 1fr 300px;height:100vh}
.side{border-right:1px solid var(--line);background:var(--surface);overflow:auto;padding:18px 14px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 6px 18px;font-weight:700;font-size:15px}
.logo-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),#5B8CFF);display:grid;place-items:center;color:#fff}
.side h6{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin:16px 8px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 8px;border-radius:8px;color:var(--text-2);font-size:13px}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--brand-2);color:var(--brand-ink);font-weight:600}
.nav-item .n{font-size:11px;color:var(--text-3);width:18px}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.shell>*{min-height:0}
.topbar{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.topbar .crumb{font-size:13px;color:var(--text-2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .crumb b{color:var(--text)}
.btn-ghost{height:32px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);font-size:12.5px;display:inline-flex;align-items:center;gap:6px;color:var(--text-2)}
.btn-ghost:hover{color:var(--text);border-color:var(--text-3)}
.canvas{flex:1;min-height:0;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:32px 20px}
.notes{border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:22px 20px}
.notes h3{font-size:16px;margin-bottom:6px}
.notes .tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--brand-2);color:var(--brand-ink);margin-bottom:12px}
.notes p{color:var(--text-2);font-size:13px;margin-bottom:14px}
.notes ul{list-style:none;display:grid;gap:10px;margin-bottom:18px}
.notes li{font-size:13px;color:var(--text-2);padding-left:20px;position:relative}
.notes li::before{content:"";position:absolute;left:4px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--brand)}
.notes .flow{border-top:1px solid var(--line);padding-top:14px}
.notes .flow h6{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px}
.chip-link{display:inline-flex;margin:0 6px 6px 0;font-size:12px;padding:5px 10px;border:1px solid var(--line-2);border-radius:20px;color:var(--text-2)}
.chip-link:hover{border-color:var(--brand);color:var(--brand)}

/* ---------- Phone ---------- */
.phone{width:390px;height:812px;border-radius:52px;background:#0A0F1C;padding:12px;box-shadow:0 0 0 1px var(--line-2),0 30px 60px rgba(16,24,40,.18);flex-shrink:0}
.screen{position:relative;width:100%;height:100%;border-radius:40px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:13px;font-weight:600;flex-shrink:0}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:20px;background:#0A0F1C;z-index:5}
.body{flex:1;overflow:auto;padding:4px 18px 24px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.tabbar{display:flex;justify-content:space-around;padding:8px 6px 22px;background:var(--surface);border-top:1px solid var(--line);flex-shrink:0}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--text-3);width:64px}
.tab.on{color:var(--brand);font-weight:600}
.appbar{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.appbar h2{font-size:18px;font-weight:700;flex:1}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--text);position:relative}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}

/* ---------- Components ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.hero{background:radial-gradient(120% 120% at 100% 0%,#2A5BD7 0%,var(--ink) 60%);color:#fff;border-radius:20px;padding:20px;position:relative;overflow:hidden}
.hero small{opacity:.75;font-size:12px}
.hero .amt{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:4px 0 14px}
.hero .row{display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.14)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;color:var(--text-2)}
.qa span.i{width:52px;height:52px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--brand)}
.qa:hover span.i{border-color:var(--brand)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 10px}
.sec h4{font-size:14px;font-weight:600}
.sec a,.link{font-size:12.5px;color:var(--brand);font-weight:500;cursor:pointer}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.li+.li{border-top:1px solid var(--line)}
button.li:hover{background:var(--surface-2)}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:600;font-size:13px;flex-shrink:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t span{font-size:12px;color:var(--text-3)}
.li .r{text-align:right;font-weight:600;font-size:13.5px}
.li .r span{display:block;font-weight:400;font-size:11.5px;color:var(--text-3)}
.pos{color:var(--ok)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)} .b-bad{background:var(--bad-bg);color:var(--bad)} .b-info{background:var(--brand-2);color:var(--brand-ink)}
.btn{height:50px;border-radius:14px;font-weight:600;font-size:15px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-secondary{background:var(--surface);border:1px solid var(--line-2)}
.btn-danger{background:var(--bad-bg);color:var(--bad)}
.field{display:block;margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:500;color:var(--text-2);margin-bottom:6px}
.input{width:100%;height:50px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);padding:0 14px;font-size:15px;outline:none}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-2)}
.hint{font-size:12px;color:var(--text-3);margin-top:6px}
.hint.err{color:var(--bad)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.toggle{width:44px;height:26px;border-radius:20px;background:var(--line-2);position:relative;transition:background .2s;flex-shrink:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .2s}
.toggle.on{background:var(--brand)} .toggle.on::after{left:21px}
.bar{height:8px;background:var(--surface-2);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px}
.muted{color:var(--text-3)} .small{font-size:12px}
.center{text-align:center}
.stack{display:grid;gap:12px}
.banner{display:flex;gap:10px;padding:12px 14px;border-radius:12px;font-size:12.5px;align-items:flex-start}
.toast{position:absolute;left:18px;right:18px;bottom:96px;background:var(--text);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:13px;display:flex;gap:8px;align-items:center;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:none}
.sheet-bg{position:absolute;inset:0;background:rgba(10,15,28,.45);z-index:10;display:flex;align-items:flex-end}
.sheet{background:var(--surface);width:100%;border-radius:24px 24px 0 0;padding:10px 18px 30px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line-2);margin:0 auto 14px}

/* Bank card */
.bcard{aspect-ratio:1.586;border-radius:18px;padding:18px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;transition:filter .3s}
.bcard.frozen{filter:grayscale(.9) brightness(.9)}
.bcard .chip{width:36px;height:27px;border-radius:6px;background:linear-gradient(135deg,#F3D58A,#C9A24A)}
.bcard .pan{font-size:17px;letter-spacing:.14em}
.frost{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;background:rgba(10,15,28,.7);font-weight:600;font-size:13px}

/* OTP + keypad */
.otp{display:flex;gap:8px;justify-content:center;margin:18px 0}
.otp input{width:46px;height:56px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);text-align:center;font-size:22px;font-weight:600;outline:none}
.otp input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-2)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.keypad button{height:52px;border-radius:12px;font-size:22px;font-weight:500}
.keypad button:hover{background:var(--surface-2)}
.amount-big{font-size:44px;font-weight:700;letter-spacing:-.02em;text-align:center;margin-top:16px}

/* Slide to confirm */
.slider{position:relative;height:58px;border-radius:16px;background:var(--brand-2);overflow:hidden;user-select:none;touch-action:none}
.slider .lbl{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;color:var(--brand-ink);font-size:14px}
.slider .fill{position:absolute;left:0;top:0;bottom:0;background:var(--brand);opacity:.18}
.slider .knob{position:absolute;top:5px;left:5px;width:48px;height:48px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;cursor:grab;box-shadow:0 2px 6px rgba(11,95,255,.4)}

/* Success */
.check{width:84px;height:84px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:40px auto 18px;animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}

/* ---------- Desktop console ---------- */
.desk{width:1080px;max-width:100%;min-height:680px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:200px 1fr}
.desk-side{background:var(--ink);color:#C8D3EA;padding:16px 12px;font-size:13px}
.desk-side .it{padding:8px 10px;border-radius:8px;display:flex;gap:8px;align-items:center}
.desk-side .it.on{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
.desk-main{padding:22px 24px;background:var(--bg);min-width:0;container-type:inline-size}
.desk-grid{display:grid;grid-template-columns:1fr 290px;gap:14px;align-items:start}
@container (max-width:860px){.desk-grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
td.nw{white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi small{color:var(--text-3);font-size:12px}
.kpi b{display:block;font-size:22px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line)}
tr.sel td{background:var(--brand-2)}
tbody tr{cursor:pointer} tbody tr:hover td{background:var(--surface-2)}
.risk{display:inline-block;width:46px;height:6px;border-radius:6px;background:var(--surface-2);vertical-align:middle;margin-right:6px;overflow:hidden}
.risk i{display:block;height:100%}

/* ---------- Overview ---------- */
.overview{width:100%;max-width:1100px}
.overview h1{font-size:24px;letter-spacing:-.01em}
.overview>p{color:var(--text-2);margin:6px 0 22px}
.ov-group{margin-bottom:26px}
.ov-group h6{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin-bottom:10px}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ov-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:.15s}
.ov-card:hover{border-color:var(--brand);box-shadow:var(--shadow);transform:translateY(-1px)}
.ov-card b{font-size:14px}
.ov-card span{font-size:12.5px;color:var(--text-2)}
.ov-card .k{font-size:11px;color:var(--text-3)}

/* ---------- Responsive ---------- */
.mobile-only{display:none!important}
@media (min-width:821px){html,body{overflow:hidden}}
@media (max-width:1180px){.shell{grid-template-columns:230px 1fr}.notes{display:none}}
@media (max-width:820px){
  .shell{grid-template-columns:1fr;height:auto;min-height:100vh}
  .side{display:none}
  .canvas{padding:16px}
  .phone{width:100%;max-width:390px;height:780px;padding:0;background:none;box-shadow:none;border-radius:0}
  .screen{border-radius:24px;border:1px solid var(--line)}
  .notch{display:none}
  .desk{grid-template-columns:1fr}.desk-side{display:none}.kpis{grid-template-columns:repeat(2,1fr)}
  .desk-main{overflow-x:auto}
  .mobile-only{display:inline-flex!important}
  .topbar .crumb{display:none}
  #themeBtn{margin-left:auto}
}
.mnav{position:fixed;inset:0;background:var(--surface);z-index:50;overflow:auto;padding:16px}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="stage">
    <div class="topbar">
      <button class="btn-ghost" id="backBtn" aria-label="Back">← Back</button>
      <button class="btn-ghost" id="allBtn">All screens</button>
      <button class="btn-ghost mobile-only" id="menuBtn">Menu</button>
      <div class="crumb" id="crumb"></div>
      <button class="btn-ghost" id="themeBtn" aria-label="Toggle theme">◐ Theme</button>
    </div>
    <div class="canvas" id="canvas"></div>
  </main>
  <aside class="notes" id="notes"></aside>
</div>

<script>
/* ================= Icons ================= */
const P = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  send:'<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/>',
  card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-6"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  bill:'<path d="M4 2v20l3-2 3 2 3-2 3 2 3-2V2l-3 2-3-2-3 2-3-2z"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  swap:'<path d="M7 4 3 8l4 4"/><path d="M3 8h14"/><path d="m17 20 4-4-4-4"/><path d="M21 16H7"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff:'<path d="M9.9 4.2A10 10 0 0 1 12 4c6.5 0 10 8 10 8a17 17 0 0 1-2.2 3.2M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="m2 2 20 20"/>',
  chev:'<path d="m9 18 6-6-6-6"/>',
  back:'<path d="m15 18-6-6 6-6"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
  snow:'<path d="M12 2v20M4.9 4.9l14.2 14.2M2 12h20M4.9 19.1 19.1 4.9"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',

/* ================= Router ================= */
const order = Object.keys(screens);
let current = 'overview', history = [];
const $ = s=>document.querySelector(s);
function go(id,push=true){ if(id===current)return; if(push) history.push(current); current=id; S.sheet=null; render(); location.hash=id; }

function render(){
  // sidebar
  const groups = {};
  order.forEach((k,i)=>{(groups[screens[k].group] ||= []).push([k,i+1])});
  $('#side').innerHTML = `<div class="logo"><span class="logo-mark">${I('shield',16,2.2)}</span>Northwind Bank<span class="badge b-info" style="margin-left:auto">Prototype</span></div>
    <button class="nav-item ${current==='overview'?'active':''}" data-go="overview">${I('grid',16)} All screens</button>
    ${Object.entries(groups).map(([g,items])=>`<h6>${g}</h6>${items.map(([k,n])=>`<button class="nav-item ${current===k?'active':''}" data-go="${k}"><span class="n">${String(n).padStart(2,'0')}</span>${screens[k].title}</button>`).join('')}`).join('')}`;
  $('#backBtn').style.visibility = history.length? 'visible':'hidden';

  if(current==='overview'){
    $('#crumb').innerHTML = '<b>All screens</b> · '+order.length+' screens';
    $('#canvas').innerHTML = `<div class="overview"><h1>Northwind Bank — UX prototype</h1><p>Click any screen to open it. Everything inside the screens is clickable: sign in, send money, freeze a card, triage fraud alerts.</p>
      ${Object.entries(groups).map(([g,items])=>`<div class="ov-group"><h6>${g}</h6><div class="ov-grid">${items.map(([k,n])=>`<button class="ov-card" data-go="${k}"><span class="k">${String(n).padStart(2,'0')} · ${screens[k].device==='desktop'?'Desktop':'Mobile'}</span><b>${screens[k].title}</b><span>${screens[k].note.split('. ')[0].replace(/\.$/,'')}.</span></button>`).join('')}</div></div>`).join('')}</div>`;
    $('#notes').innerHTML = `<span class="tag">Guide</span><h3>How to use</h3><p>Use the sidebar or the cards to jump to a screen. Back returns through your path. Theme toggles light/dark.</p>
      <ul><li>Suggested flow: Welcome → Sign in → Verify (123456) → Home → Send</li><li>Card controls and fraud console keep their state as you navigate</li><li>Works at phone width; the frame becomes full-bleed</li></ul>`;
    return;
  }
  const sc = screens[current];
  const idx = order.indexOf(current)+1;
  $('#crumb').innerHTML = `${sc.group} › <b>${sc.title}</b> <span class="muted">· ${idx}/${order.length}</span>`;
  $('#canvas').innerHTML = sc.device==='desktop' ? sc.render() :
    `<div class="phone"><div class="screen"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div>${sc.render()}${sheetHTML()}<div class="toast" id="toast">${I('check',16)}<span></span></div></div></div>`;
  $('#notes').innerHTML = `<span class="tag">${sc.group} · ${sc.device==='desktop'?'Desktop':'Mobile'}</span><h3>${sc.title}</h3><p>${sc.note}</p><ul>${sc.points.map(p=>`<li>${p}</li>`).join('')}</ul>
    <div class="flow"><h6>Connected screens</h6>${sc.links.map(l=>`<button class="chip-link" data-go="${l}">${screens[l].title} →</button>`).join('')}</div>`;
  mount();
}

function sheetHTML(){
  if(!S.sheet) return '';
  const body = {
    pin:`<h3 style="margin-bottom:6px">Your card PIN</h3><p class="muted small" style="margin-bottom:16px">Make sure no one is looking at your screen.</p><div class="num center" style="font-size:40px;font-weight:700;letter-spacing:.3em;margin-bottom:18px">4 8 1 9</div><button class="btn btn-primary" data-act="closeSheet">Hide PIN</button>`,
    replace:`<h3 style="margin-bottom:6px">Replace card ••7782</h3><p class="muted small" style="margin-bottom:14px">Why do you need a new card?</p><div class="stack" style="gap:8px">${['Lost','Stolen','Damaged'].map(r=>`<button class="btn btn-secondary" data-act="replaced">${r}</button>`).join('')}</div>`,
    move:`<h3 style="margin-bottom:14px">Move between accounts</h3><div class="field"><label>From</label><select class="input"><option>Everyday Checking · $8,240.55</option></select></div><div class="field"><label>To</label><select class="input"><option>High-Yield Savings · $24,310.00</option></select></div><div class="field"><label>Amount</label><input class="input" value="$500.00"></div><button class="btn btn-primary" data-act="moved">Move $500.00</button>`,
  }[S.sheet];
  return `<div class="sheet-bg" data-act="closeSheet"><div class="sheet" onclick="event.stopPropagation()"><div class="grab"></div>${body}</div></div>`;
}

function toast(msg){const t=$('#toast');if(!t)return;t.querySelector('span').textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800)}

/* ================= Interactions ================= */
const acts = {
  login:()=>go('otp'), togglePw:()=>{const p=$('#pw');p.type=p.type==='password'?'text':'password'},
  verify:()=>{const v=[...document.querySelectorAll('#otp input')].map(i=>i.value).join('');if(v==='123456'){S.otpBad=false;go('home')}else{S.otpBad=true;render()}},
  hide:()=>{S.hide=!S.hide;render()},
  copy:()=>toast('Copied to clipboard'),
  freeze:()=>{S.frozen=!S.frozen;render();toast(S.frozen?'Card frozen — no new charges will go through':'Card unfrozen')},
  online:()=>{S.online=!S.online;render()}, intl:()=>{S.intl=!S.intl;render();if(S.intl)toast('International use on for 30 days')},
  tog:e=>e.currentTarget.classList.toggle('on'),
  submitDispute:()=>{go('txnDetail');setTimeout(()=>toast('Report submitted · case #DS-4471'),50)},
  doneSend:()=>{S.amount='';S.payee=null;history=[];go('home',false)},
  payAll:()=>toast('3 bills scheduled for today'),
  sheetPin:()=>{S.sheet='pin';render()}, sheetReplace:()=>{S.sheet='replace';render()}, sheetMove:()=>{S.sheet='move';render()},
  closeSheet:()=>{S.sheet=null;render()},
  replaced:()=>{S.sheet=null;render();toast('New card on its way · 3–5 days')},
  moved:()=>{S.sheet=null;render();toast('$500.00 moved to Savings')},
  itWasMe:()=>{$('#secAlert').outerHTML=`<div class="banner" style="background:var(--ok-bg);color:var(--ok)">${I('check',16)} Thanks — we’ve marked this device as trusted.</div>`},
  secure:()=>{$('#secAlert').outerHTML=`<div class="banner" style="background:var(--bad-bg);color:var(--bad)">${I('lock',16)} Other sessions signed out. Please reset your password.</div>`},
  theme:()=>toggleTheme(),
  approve:()=>decide('Approved'), decline:()=>decide('Declined'), escalate:()=>decide('Escalated'),
};
function decide(st){S.alerts[S.alertSel].status=st;const nxt=S.alerts.findIndex((a,i)=>i>S.alertSel&&a.status==='Open');if(nxt>-1)S.alertSel=nxt;render()}

function mount(){
  // OTP boxes
  const boxes=[...document.querySelectorAll('#otp input')];
  boxes.forEach((b,i)=>{
    b.addEventListener('input',()=>{b.value=b.value.replace(/\D/g,'').slice(-1);if(b.value&&boxes[i+1])boxes[i+1].focus();if(boxes.every(x=>x.value))acts.verify()});
    b.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!b.value&&boxes[i-1])boxes[i-1].focus()});
    b.addEventListener('paste',e=>{const d=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);if(d.length){e.preventDefault();d.split('').forEach((c,j)=>boxes[j]&&(boxes[j].value=c));if(d.length===6)acts.verify()}});
  });
  if(boxes[0]) boxes[0].focus();
  const rs=$('#resend'); if(rs){let s=30;const t=setInterval(()=>{if(!document.body.contains(rs))return clearInterval(t);s--;rs.innerHTML=s>0?`Resend in 0:${String(s).padStart(2,'0')}`:'<a class="link">Resend code</a>';if(s<=0)clearInterval(t)},1000)}
  // Search & chips
  const filt=(q,cat)=>document.querySelectorAll('#txList .li').forEach(r=>{r.style.display=(!q||r.dataset.name.includes(q))&&(!cat||cat==='All'||r.dataset.cat===cat)?'':'none'});
  let cat='All';
  const ts=$('#txSearch'); if(ts) ts.addEventListener('input',()=>filt(ts.value.toLowerCase(),cat));
  document.querySelectorAll('[data-chip]').forEach(c=>c.addEventListener('click',()=>{cat=c.dataset.chip;document.querySelectorAll('[data-chip]').forEach(x=>{x.classList.toggle('b-info',x===c);x.style.background=x===c?'':'var(--surface)'});filt((ts?.value||'').toLowerCase(),cat)}));
  const ps=$('#paySearch'); if(ps) ps.addEventListener('input',()=>{const q=ps.value.toLowerCase();document.querySelectorAll('#payList .li').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')});
  // Limit slider
  const lim=$('#limit'); if(lim) lim.addEventListener('input',()=>{S.cardLimit=+lim.value;$('#limVal').textContent=fmt(S.cardLimit,0)});
  lim&&lim.addEventListener('change',()=>toast('Limit updated to '+fmt(S.cardLimit,0)));
  // Slide to confirm
  const sl=$('#slider'),kn=$('#knob'),fl=$('#sfill');
  if(sl){let drag=false,x0=0;const max=()=>sl.clientWidth-58;
    const set=x=>{kn.style.left=(5+x)+'px';fl.style.width=(x+53)+'px'};
    kn.addEventListener('pointerdown',e=>{drag=true;x0=e.clientX;kn.setPointerCapture(e.pointerId)});
    kn.addEventListener('pointermove',e=>{if(!drag)return;set(Math.max(0,Math.min(max(),e.clientX-x0)))});
    kn.addEventListener('pointerup',e=>{drag=false;const x=e.clientX-x0;if(x>=max()*.9){set(max());setTimeout(()=>go('success'),150)}else{kn.style.transition='left .2s';fl.style.transition='width .2s';set(0);setTimeout(()=>{kn.style.transition='';fl.style.transition=''},200)}});
    sl.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();set(max());setTimeout(()=>go('success'),150)}});
  }
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-payee],[data-txn],[data-key],[data-speed],[data-notif],[data-alert]');
  if(!t)return;
  const d=t.dataset;
  if(d.go){go(d.go);$('.mnav')?.remove();return}
  if(d.act){acts[d.act]?.({currentTarget:t});return}
  if(d.payee){S.payee=payees.find(p=>p.id==d.payee);S.amount='';go('amount');return}
  if(d.txn){S.txnId=+d.txn;go('txnDetail');return}
  if(d.speed){S.speed=d.speed;render();return}
  if(d.notif){S.notif[d.notif]=!S.notif[d.notif];t.classList.toggle('on');return}
  if(d.alert){S.alertSel=+d.alert;render();return}
  if(d.key){let a=S.amount;const k=d.key;
    if(k==='⌫')a=a.slice(0,-1);else if(k==='.'){if(!a.includes('.'))a=(a||'0')+'.'}else{if(a.includes('.')&&a.split('.')[1].length>=2)return;if(a.replace('.','').length>=7)return;a=(a==='0'?'':a)+k}
    S.amount=a;render();}
});
document.addEventListener('keydown',e=>{
  if(current!=='console'||e.target.matches('input,select'))return;
  if(e.key==='ArrowDown'){S.alertSel=Math.min(S.alerts.length-1,S.alertSel+1);render()}
  if(e.key==='ArrowUp'){S.alertSel=Math.max(0,S.alertSel-1);render()}
  if(e.key==='a')decide('Approved'); if(e.key==='d')decide('Declined');
});

$('#backBtn').onclick=()=>{if(history.length){current=history.pop();S.sheet=null;render();location.hash=current}};
$('#allBtn').onclick=()=>go('overview');
$('#menuBtn').onclick=()=>{const m=document.createElement('div');m.className='mnav';m.innerHTML=`<button class="btn-ghost" style="margin-bottom:10px" onclick="this.parentNode.remove()">Close</button>`+$('#side').innerHTML;document.body.appendChild(m)};
function toggleTheme(){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('nw-theme',r.dataset.theme)}catch(e){}}
$('#themeBtn').onclick=toggleTheme;
try{const t=localStorage.getItem('nw-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==current&&(screens[h]||h==='overview')){history.push(current);current=h;render()}});
const h0=location.hash.slice(1); if(screens[h0]) current=h0;
render();
</script>
</body>
</html>
