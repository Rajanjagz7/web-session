name: Astro slices backtest
on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * 1-5"      # 17:47 IST on weekdays, after the close
  push:
    branches: [rajan-web-session]
    paths:
      - rajanstocks/astro_slices.py
      - rajanstocks/astro_slices_backtest.py
      - .github/workflows/astro-slices-backtest.yml
permissions:
  contents: write
concurrency: { group: astro-slices-backtest, cancel-in-progress: true }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r rajanstocks/requirements.txt
      - run: cd rajanstocks && python astro_slices_backtest.py
      - name: Commit result
        run: |
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git add rajanstocks/static/astro_slices_backtest.json
          git diff --cached --quiet && exit 0
          git commit -m "Astro slices backtest $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin rajan-web-session && git push -q origin HEAD:rajan-web-session && break; sleep 5; done
