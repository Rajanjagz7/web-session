name: Refresh cash picks seed
on:
  workflow_dispatch:
  schedule:
    # 21:00 IST, Mon-Fri only - after market hours, never on weekends. GitHub drops or delays scheduled runs (29 Oct: the 21:00 one never started),
    # so there are three odd-minute starts; a later start only commits when the rows changed, so extra runs are harmless.
    - cron: "37 15 * * 1-5"      # 21:07 IST
    - cron: "11 16 * * 1-5"      # 21:41 IST
    - cron: "43 16 * * 1-5"      # 22:13 IST
permissions:
  contents: write
concurrency: { group: cash-seed, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: rajan-web-session }
      - name: Make the live site build today's whole-market walk (it only runs when the picks screen is refreshed)
        run: |
          S=https://rajanstocks.vercel.app
          for i in $(seq 1 6); do
            curl -sS -m 40 "$S/api/m/picks?refresh=true" -o /dev/null || true
            st=$(curl -sS -m 30 "$S/api/m/cash-seed" || echo '{}')
            echo "round $i: $(echo "$st" | head -c 400)"
            echo "run at $(TZ=Asia/Kolkata date '+%d %b %H:%M IST') - round $i: $(echo "$st" | head -c 300)" > "$GITHUB_STEP_SUMMARY"
            echo "$st" | python3 -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('walk') and (d.get('today') or {}).get('rows',0)>=300 else 1)" && { echo "walk finished"; exit 0; }
            sleep 75
          done
          echo "walk did not finish in time - exporting whatever the server holds (the size check below still protects the seed)"
      - name: Download today's cash rows from the live site
        run: |
          curl -fsS -m 90 --retry 3 https://rajanstocks.vercel.app/api/m/cash-seed/export -o /tmp/seed.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/seed.json"))
          ok = isinstance(d, dict) and len(d) >= 300 and all(isinstance(v, dict) and v.get("s") for v in list(d.values())[:50])
          print("rows:", len(d) if isinstance(d, dict) else "not a dict")
          sys.exit(0 if ok else 1)      # a short or broken answer never replaces the seed
          PY
          cp /tmp/seed.json rajanstocks/public/static/picks_cash_seed.json
      - name: Commit result
        run: |
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git add rajanstocks/public/static/picks_cash_seed.json
          git diff --cached --quiet && exit 0
          git commit -m "Cash picks seed $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin rajan-web-session && git push -q origin HEAD:rajan-web-session && break; sleep 5; done
