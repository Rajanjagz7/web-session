name: Strategy audit
on:
  workflow_dispatch:
  push:
    branches: [rajan-web-session]
    paths:
      - rajanstocks/strategy_audit.py
      - .github/workflows/strategy-audit.yml
permissions:
  contents: write
concurrency: { group: strategy-audit, cancel-in-progress: true }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r rajanstocks/requirements.txt
      - run: python rajanstocks/strategy_audit.py
      - name: Commit result
        run: |
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git add rajanstocks/static/strategy_audit.json
          git diff --cached --quiet && exit 0
          git commit -m "Strategy audit $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin rajan-web-session && git push -q origin HEAD:rajan-web-session && break; sleep 5; done
