name: Auto-trader heartbeat
# Vercel's plan only allows daily crons, so without an open browser tab (with notifications on) the auto-trader
# never ran its cycle: no new entries (Eagle Trades 09:20-10:30 included), no stop / target checks.
# This job calls the same endpoint the app tab calls: on the minute 09:15-09:30 (option buys from 09:15, selling from 09:20),
# then every 2 minutes until 15:35 IST. The server takes a lock (no overlapping cycles) and returns at once when the market is closed.
on:
  workflow_dispatch:
  schedule:
    # GitHub starts scheduled jobs late or drops them (worst at :00 / :15 / :30) - on 27 Oct the 08:45 run never started.
    # Several odd-minute starts: the first that fires runs the session, the others wait in the queue (one job at a time) and
    # the queued one takes over when the first reaches its time budget.
    - cron: "17 3 * * 1-5"       # 08:47 IST
    - cron: "29 3 * * 1-5"       # 08:59 IST
    - cron: "41 3 * * 1-5"       # 09:11 IST
    - cron: "53 3 * * 1-5"       # 09:23 IST
    - cron: "23 3 * * 1-5"       # 08:53 IST  (28 Oct: every run from 08:47 to 09:11 was dropped by GitHub - more start times = better odds)
    - cron: "35 3 * * 1-5"       # 09:05 IST
    - cron: "47 3 * * 1-5"       # 09:17 IST
    - cron: "59 3 * * 1-5"       # 09:29 IST
    - cron: "11 4 * * 1-5"       # 09:41 IST
    - cron: "7 5 * * 1-5"        # 10:37 IST
    - cron: "7 7 * * 1-5"        # 12:37 IST - picks up after the morning run (a job lasts at most ~5h50m) until the close
    - cron: "37 8 * * 1-5"       # 14:07 IST
concurrency: { group: auto-trader, cancel-in-progress: false }
jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      STAGE_TRADING: ${{ vars.STAGE_TRADING }}          # set the repository variable STAGE_TRADING=0 to stop calling the stage site
    steps:
      - name: Run the trading cycle through the session
        run: |
          SITE="https://rajanstocks.vercel.app"
          STAGE="https://rajanstocks1.vercel.app"; tick=0     # stage = indicator group B on its own book; production = group A (A/B test, 29 Oct)
          start=$(date +%s); closed=0
          while :; do
            now=$(TZ=Asia/Kolkata date +%H%M)
            [ "$now" -ge 1535 ] && { echo "session over ($now IST)"; break; }
            [ $(( $(date +%s) - start )) -ge 20700 ] && { echo "time budget used - the next scheduled run takes over"; break; }
            if [ "$now" -ge 835 ] && [ "$now" -lt 915 ]; then
              # pre-open: the server reads every stock's indicators now (8 s per call, so several calls) - 09:15 starts with all of them
              out=$(curl -s -m 60 -X POST "$SITE/api/cron/auto-cycle" -w ' [HTTP %{http_code}]' || echo 'request failed')
              echo "$(TZ=Asia/Kolkata date +%T) IST pre-open ${out:0:200}"
              [ "${STAGE_TRADING:-1}" = 1 ] && curl -s -m 60 -o /dev/null -X POST "$STAGE/api/cron/auto-cycle" || true
            fi
            if [ "$now" -ge 915 ]; then
              # at the open only: warm today's picks first (a cycle that had to build them itself could hit Vercel's 30 s limit).
              # Later the cycle reads the cached list - warming every tick added Upstox load
              if [ "$now" -lt 920 ]; then curl -s -m 40 -o /dev/null "$SITE/api/m/picks" || true; sleep 20; fi
              out=$(curl -s -m 60 -X POST "$SITE/api/cron/auto-cycle" -w ' [HTTP %{http_code}]' || echo 'request failed')
              echo "$(TZ=Asia/Kolkata date +%T) IST ${out:0:300}"
              tick=$((tick + 1))
              # the stage book: every 2nd tick (4 min) after the open - it shares Upstox's request budget with production, so it is called less often
              if [ "${STAGE_TRADING:-1}" = 1 ] && { [ "$now" -lt 930 ] || [ $((tick % 2)) -eq 0 ]; }; then
                sout=$(curl -s -m 60 -X POST "$STAGE/api/cron/auto-cycle" -w ' [HTTP %{http_code}]' || echo 'request failed')
                echo "$(TZ=Asia/Kolkata date +%T) IST stage ${sout:0:200}"
              fi
              # a holiday: the server still says the market is closed well after the open - stop early (status runs no cycle)
              if [ "$now" -ge 925 ] && [ "$now" -lt 935 ]; then
                if curl -s -m 30 "$SITE/api/auto/status" | grep -q '"marketOpen":false'; then
                  closed=$((closed + 1)); [ $closed -ge 3 ] && { echo "market closed today"; break; }
                else closed=0; fi
              fi
            fi
            # next tick: the top of the next minute until 09:30, then every 2 minutes
            now=$(TZ=Asia/Kolkata date +%H%M); step=60; [ "$now" -ge 930 ] && step=120
            sleep $(( step - $(date +%s) % 60 + 2 ))
          done
