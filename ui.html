<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian Trading Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --panel:#FFFFFF; --panel-2:#F6F7FA; --line:#E2E6EC; --grid:#EEF1F5;
  --text:#0E1726; --text-2:#4A5568; --text-3:#8592A6; --water:rgba(14,23,38,.05); --pill:#0E1726;
  --brand:#2a78d6; --brand-2:#E7F0FC; --up:#0A8F6C; --down:#D93240; --up-bg:#E6F5F0; --down-bg:#FCEBEC;
  --warn:#B7791F; --warn-bg:#FFF6E5;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --shadow:0 10px 30px rgba(16,24,40,.12); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0E14; --panel:#11151D; --panel-2:#171C26; --line:#232A37; --grid:#181E29;
  --text:#E6EAF2; --text-2:#A3ADBF; --text-3:#6B7588; --water:rgba(230,234,242,.04); --pill:#2A3242;
  --brand:#3987e5; --brand-2:#14233B; --up:#22AB94; --down:#F7525F; --up-bg:#0F2A26; --down-bg:#2D1418;
  --warn:#E3A846; --warn-bg:#2B2210;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2f9a2f; --s7:#9085e9; --s8:#e66767;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B0E14; --panel:#11151D; --panel-2:#171C26; --line:#232A37; --grid:#181E29;
  --text:#E6EAF2; --text-2:#A3ADBF; --text-3:#6B7588; --water:rgba(230,234,242,.04); --pill:#2A3242;
  --brand:#3987e5; --brand-2:#14233B; --up:#22AB94; --down:#F7525F; --up-bg:#0F2A26; --down-bg:#2D1418;
  --warn:#E3A846; --warn-bg:#2B2210;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2f9a2f; --s7:#9085e9; --s8:#e66767;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.num,td.num,.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px;border-radius:6px}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--text-3)} .m2{color:var(--text-2)}
svg.i{display:block;flex-shrink:0}

/* Header */
.hdr{position:sticky;top:0;z-index:30;height:52px;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;white-space:nowrap}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--brand),#7aa8ff);display:grid;place-items:center;color:#fff}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 0}
.nav button{height:32px;padding:0 11px;border-radius:8px;color:var(--text-2);font-weight:500;white-space:nowrap}
.nav button:hover{background:var(--panel-2);color:var(--text)}
.nav button.on{background:var(--brand-2);color:var(--brand)}
.search-btn{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;color:var(--text-3);min-width:200px;margin-left:auto}
.search-btn kbd{margin-left:auto;font:11px Inter;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.hdr-r{display:flex;align-items:center;gap:10px}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 3px var(--up-bg)}
.eq{text-align:right;line-height:1.15;white-space:nowrap}.eq small{display:block;font-size:10.5px;color:var(--text-3)}.eq b{font-size:13px}
.ibtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--text-2);position:relative;flex-shrink:0}
.ibtn:hover{background:var(--panel-2);color:var(--text)}
.ibtn.on{background:var(--brand-2);color:var(--brand)}
.cnt{position:absolute;top:2px;right:2px;min-width:15px;height:15px;border-radius:8px;background:var(--down);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 3px}

/* Generic */
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--text-2);white-space:nowrap}
.btn:hover{color:var(--text);border-color:var(--text-3)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-xs{height:24px;padding:0 8px;border-radius:6px;border:1px solid var(--line);font-size:12px;color:var(--text-2)}
.btn-xs:hover{color:var(--text);border-color:var(--text-3)}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{height:26px;padding:0 9px;border-radius:6px;color:var(--text-2);font-weight:500;font-size:12px;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sel{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 8px;color:var(--text)}
.inp{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 10px;width:100%;outline:none}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-2)}
.inp:disabled{color:var(--text-3);background:var(--panel-2)}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:10px;font-size:11px;font-weight:600}
.b-up{background:var(--up-bg);color:var(--up)} .b-down{background:var(--down-bg);color:var(--down)} .b-info{background:var(--brand-2);color:var(--brand)} .b-mute{background:var(--panel-2);color:var(--text-2)} .b-warn{background:var(--warn-bg);color:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h{flex-wrap:wrap}
.card-h h3{font-size:14px;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:28px;padding:0 11px;border-radius:14px;border:1px solid var(--line);color:var(--text-2);font-size:12px;font-weight:500}
.chip.on{border-color:var(--brand);background:var(--brand-2);color:var(--brand)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--text-3);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel)}
th.num,td.num{text-align:right}
td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:hover td{background:var(--panel-2)}
th[data-sort]{cursor:pointer} th[data-sort]:hover{color:var(--text)}
.empty{padding:28px;text-align:center;color:var(--text-3)}
.side-tag{font-weight:600;font-size:12px}

/* ===== Trade layout ===== */
.view{display:none}.view.on{display:block}
#v-trade.on{display:grid}
#v-trade{grid-template-columns:236px minmax(0,1fr) 304px;height:calc(100vh - 52px)}
.wl{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.wl-h{padding:10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.wl-h b{font-size:13px}
.wl-list{overflow:auto;flex:1}
.wl-g{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:10px 12px 4px}
.wl-row{display:grid;grid-template-columns:1fr 54px auto;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 12px;border-left:2px solid transparent}
.wl-row:hover{background:var(--panel-2)}
.wl-row.on{background:var(--brand-2);border-left-color:var(--brand)}
.wl-row b{display:block;font-size:12.5px}.wl-row small{display:block;color:var(--text-3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px}
.wl-row .r{text-align:right;font-size:12px;line-height:1.3}
.center{display:flex;flex-direction:column;min-width:0;min-height:0}
.symbar{display:flex;align-items:center;gap:18px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);min-height:54px;overflow-x:auto;scrollbar-width:none}
.symbtn{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:700;padding:4px 6px;border-radius:6px}
.symbtn:hover{background:var(--panel-2)}
.sb-px{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.sb-px b{font-size:20px;font-weight:700}
.sb-stat{display:flex;flex-direction:column;font-size:11px;color:var(--text-3);white-space:nowrap}
.sb-stat span{color:var(--text);font-size:12.5px}
.rangebar{position:relative;width:90px;height:4px;border-radius:2px;background:var(--line);margin-top:6px}
.rangebar i{position:absolute;top:-3px;width:2px;height:10px;background:var(--text);border-radius:1px}
.toolbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px;flex-shrink:0}
.tb-btn{height:30px;padding:0 9px;border-radius:7px;display:inline-flex;align-items:center;gap:6px;color:var(--text-2);font-weight:500;white-space:nowrap;flex-shrink:0}
.tb-btn:hover{background:var(--panel-2);color:var(--text)}
.tb-btn.on{color:var(--brand);background:var(--brand-2)}
.tb-btn .ct{font-size:11px;background:var(--panel-2);border-radius:8px;padding:0 6px;color:var(--text-2)}
.chart-wrap{flex:1;display:flex;min-height:0;background:var(--panel)}
.tools{width:44px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;flex-shrink:0;overflow-y:auto;scrollbar-width:none}
.tools .sep{width:22px;height:1px;background:var(--line);margin:4px 0}
.tools .ibtn{width:34px;height:34px}
.chart{flex:1;position:relative;min-width:0;min-height:0;overflow:hidden}
.chart canvas{position:absolute;inset:0;touch-action:none;cursor:crosshair}
.legend{position:absolute;inset:0;pointer-events:none;font-size:12px}
.lg-g{position:absolute;left:8px;display:grid;gap:1px;justify-items:start}
.lg-hdr{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:2px 4px;font-variant-numeric:tabular-nums}
.lg-hdr b{font-size:12.5px}
.lg-hdr .k{color:var(--text-3);margin-right:3px}
.lg-row{pointer-events:auto;display:flex;align-items:center;gap:7px;padding:1px 4px;border-radius:5px;font-variant-numeric:tabular-nums;border:1px solid transparent}
.lg-row:hover{background:var(--panel);border-color:var(--line)}
.lg-row.off{opacity:.45}
.lg-name{color:var(--text-2)}
.lg-val{display:flex;gap:8px}
.lg-val span{display:inline-flex;align-items:center;gap:4px}
.sw{display:inline-block;width:10px;height:2px;border-radius:1px}
.lg-act{display:none;gap:1px}
.lg-row:hover .lg-act,.lg-row:focus-within .lg-act{display:flex}
.lg-act button{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;color:var(--text-2)}
.lg-act button:hover{background:var(--panel-2);color:var(--text)}
.chart-hint{position:absolute;right:80px;bottom:30px;font-size:11.5px;color:var(--text-3);pointer-events:none;background:var(--panel);padding:3px 8px;border-radius:6px;border:1px solid var(--line);opacity:0;transition:opacity .2s}
.chart-hint.show{opacity:1}
.zoom{position:absolute;left:50%;transform:translateX(-50%);bottom:30px;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px;opacity:0;transition:opacity .2s}
.chart:hover .zoom{opacity:1}
.zoom .ibtn{width:28px;height:28px}
.bottom{height:214px;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;flex-shrink:0}
.bottom.collapsed{height:40px}
.btabs{display:flex;align-items:center;gap:2px;padding:4px 8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.btabs>*{flex-shrink:0}
.btabs button.t{height:30px;padding:0 11px;border-radius:7px;color:var(--text-2);font-weight:500}
.btabs button.t.on{color:var(--text);background:var(--panel-2)}
.btabs .ct{font-size:11px;color:var(--text-3);margin-left:3px}
.bbody{overflow:auto;flex:1}
.right{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;min-height:0}
.sym-link{font-weight:600}.sym-link:hover{color:var(--brand)}

/* Ticket */
.ticket{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.tk-h{display:flex;align-items:center;justify-content:space-between}
.tk-h b{font-size:14px}
.side-seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.side-seg button{height:36px;border-radius:8px;font-weight:600;border:1px solid var(--line);color:var(--text-2)}
.side-seg button.buy.on{background:var(--up);border-color:var(--up);color:#fff}
.side-seg button.sell.on{background:var(--down);border-color:var(--down);color:#fff}
.type-seg{display:flex}.type-seg button{flex:1}
.fld label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-2);margin-bottom:4px;font-weight:500}
.inp-w{position:relative}.inp-w .suf{position:absolute;right:10px;top:9px;font-size:11.5px;color:var(--text-3);pointer-events:none}
.inp-w .inp{padding-right:52px;font-variant-numeric:tabular-nums}
.pcts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pcts button{height:24px;border-radius:6px;border:1px solid var(--line);font-size:11.5px;color:var(--text-2)}
.pcts button:hover{border-color:var(--brand);color:var(--brand)}
.bracket{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;font-size:12px}
.bracket input[type=checkbox]{accent-color:var(--brand);width:15px;height:15px}
.bracket .inp{height:30px}
.sum{display:grid;gap:4px;font-size:12px;padding:8px 10px;background:var(--panel-2);border-radius:8px}
.sum div{display:flex;justify-content:space-between}
.sum b{font-variant-numeric:tabular-nums}
.tk-msg{font-size:12px;border-radius:7px;padding:6px 9px;display:none}
.tk-msg.err{display:block;background:var(--down-bg);color:var(--down)}
.tk-msg.warn{display:block;background:var(--warn-bg);color:var(--warn)}
.go{height:42px;border-radius:9px;font-weight:600;font-size:14px;color:#fff}
.go.buy{background:var(--up)}.go.sell{background:var(--down)}
.go:disabled{opacity:.45;cursor:not-allowed}

/* Book */
.book{padding:10px 0}
.book-h{display:flex;align-items:center;justify-content:space-between;padding:0 14px 8px}
.ob-cols,.ob-row{display:grid;grid-template-columns:1fr 1fr 1fr;padding:0 14px;font-size:12px;font-variant-numeric:tabular-nums}
.ob-cols{color:var(--text-3);font-size:11px;padding-bottom:4px}
.ob-cols span:not(:first-child),.ob-row span:not(:first-child){text-align:right}
.ob-row{position:relative;height:20px;align-items:center;width:100%;text-align:left}
.ob-row:hover{background:var(--panel-2)}
.ob-row i{position:absolute;right:0;top:1px;bottom:1px;opacity:.16;pointer-events:none}
.ob-mid{display:flex;align-items:baseline;gap:8px;padding:6px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:3px 0}
.ob-mid b{font-size:16px}
.tape-row{display:grid;grid-template-columns:1fr 1fr 1fr;padding:0 14px;height:20px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.tape-row span:not(:first-child){text-align:right}

/* Focus mode */
#v-trade.focus{grid-template-columns:0 minmax(0,1fr) 0}
#v-trade.focus .wl,#v-trade.focus .right{display:none}

/* Pages */
.page{max-width:1240px;margin:0 auto;padding:22px 20px 40px}
.page-h{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-h h1{font-size:22px;letter-spacing:-.01em}
.page-h p{color:var(--text-2);margin-top:2px}
.grid{display:grid;gap:14px}
.grid>*,.two>*,.card{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{padding:14px 16px}
.kpi small{color:var(--text-3);font-size:12px}
.kpi b{display:block;font-size:22px;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px}
.movers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mv-row{display:flex;align-items:center;gap:10px;padding:8px 16px;width:100%;text-align:left}
.mv-row:hover{background:var(--panel-2)}
.mv-row .t{flex:1;min-width:0}.mv-row .t small{display:block;color:var(--text-3);font-size:11.5px}
.heat{display:flex;flex-wrap:wrap;gap:3px;padding:12px}
.tile{min-height:74px;border-radius:6px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;color:var(--text);transition:filter .15s}
.tile:hover{filter:brightness(1.12)}
.tile b{font-size:13px}.tile span{font-size:12px;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.tbl-wrap{overflow-x:auto}
.two{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px}
.eq-chart{position:relative;padding:8px 8px 0}
.eq-chart svg{display:block;width:100%;height:260px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:12px;display:none;min-width:150px;z-index:2}
.tip b{font-size:13px;font-variant-numeric:tabular-nums}
.tip .r{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip .k{display:inline-block;width:10px;height:2px;border-radius:1px;margin-right:4px;vertical-align:middle}
.legend-row{display:flex;gap:14px;font-size:12px;color:var(--text-2)}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.alloc{padding:14px 16px;display:grid;gap:10px}
.alloc .row{display:grid;grid-template-columns:70px 1fr 54px;gap:10px;align-items:center;font-size:12.5px}
.alloc .bar{height:10px;border-radius:0 4px 4px 0;background:var(--brand)}
.form{padding:16px;display:grid;gap:12px}
.form label{display:block;font-size:12px;color:var(--text-2);font-weight:500;margin-bottom:4px}
.al-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.al-row .t{flex:1;min-width:0}
.al-row{flex-wrap:wrap}
.toggle{width:36px;height:20px;border-radius:12px;background:var(--line);position:relative;flex-shrink:0;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.toggle.on{background:var(--brand)}.toggle.on::after{left:18px}
.ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ind-card{padding:14px;display:flex;flex-direction:column;gap:8px}
.ind-card h4{font-size:14px}
.ind-card p{color:var(--text-2);font-size:12.5px}
.ind-card svg{width:100%;height:84px;background:var(--panel-2);border-radius:8px}
.ind-card .foot{display:flex;align-items:center;gap:8px;margin-top:auto}

/* Mobile showcase */
.mob{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:start}
.phone{width:380px;height:790px;border-radius:50px;background:#05070B;padding:11px;box-shadow:0 0 0 1px var(--line),0 30px 60px rgba(0,0,0,.25)}
.pscreen{width:100%;height:100%;border-radius:40px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column;position:relative}
.pstatus{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-weight:600;font-size:13px;flex-shrink:0}
.pnotch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:104px;height:28px;border-radius:16px;background:#05070B}
.pbody{flex:1;overflow:auto;padding:4px 16px 16px;scrollbar-width:none}
.pchart{height:250px;position:relative;margin:0 -16px}
.pbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px 26px;border-top:1px solid var(--line)}
.pbar button{height:46px;border-radius:12px;font-weight:600;color:#fff;font-size:15px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 8px;font-size:12px}
.stats small{display:block;color:var(--text-3);font-size:11px}
.notes-list{display:grid;gap:12px}
.note{padding:14px 16px}
.note b{display:block;margin-bottom:3px}
.note p{color:var(--text-2);font-size:12.5px}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--panel);width:100%;border-radius:22px 22px 0 0;padding:10px 16px 26px;display:grid;gap:12px}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:0 auto}

/* Modal, toast, popover */
.modal-bg{position:fixed;inset:0;background:rgba(5,8,14,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:560px;max-height:84vh;display:flex;flex-direction:column;overflow:hidden}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:15px;flex:1}
.modal-b{overflow:auto;padding:14px 16px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.pick-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 10px;border-radius:8px}
.pick-row:hover,.pick-row.act{background:var(--panel-2)}
.pick-row .t{flex:1;min-width:0}.pick-row .t small{display:block;color:var(--text-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.tpl button{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.tpl button:hover{border-color:var(--brand)}
.tpl small{display:block;color:var(--text-3);font-size:11.5px}
.swatches{display:flex;gap:6px}
.swatches button{width:22px;height:22px;border-radius:6px;border:2px solid transparent}
.swatches button.on{border-color:var(--text);box-shadow:inset 0 0 0 2px var(--panel)}
.kv{display:grid;gap:7px;font-size:13px}.kv div{display:flex;justify-content:space-between}
#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:grid;gap:8px}
.toast{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-left:3px solid var(--brand);border-radius:10px;padding:10px 14px;font-size:13px;max-width:340px;animation:tin .2s ease-out}
.toast.ok{border-left-color:var(--up)}.toast.bad{border-left-color:var(--down)}.toast.warn{border-left-color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
.pop{position:fixed;top:56px;right:12px;width:340px;z-index:90;max-height:70vh;overflow:auto}
.pop .n{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.pop .n small{display:block;color:var(--text-3)}

/* Responsive */
@media (max-width:1300px){
  #v-trade{grid-template-columns:minmax(0,1fr) 300px}
  #v-trade .wl{display:none}
  #v-trade.wl-open .wl{display:flex;position:fixed;left:0;top:52px;bottom:0;width:260px;z-index:40;box-shadow:var(--shadow)}
  .live,.eq{display:none}
}
@media (max-width:960px){
  #v-trade.on{display:block;height:auto}
  .chart-wrap{height:520px;flex:none}
  .center{min-height:auto}
  .right{border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr}
  .search-btn{min-width:0}.search-btn span:not(#searchI),.search-btn kbd{display:none}
  .kpis,.movers{grid-template-columns:1fr 1fr}
  .two,.mob{grid-template-columns:1fr}
  .phone{margin:0 auto}
}
@media (max-width:640px){
  .hdr{gap:8px;padding:0 10px}.brand span.txt{display:none}
  .right{grid-template-columns:1fr}
  .tools{display:none}
  .bp-lbl{display:none}
  .chart-wrap{height:560px}
  .kpis,.movers{grid-template-columns:1fr}
  .page{padding:16px}
  .phone{width:100%;max-width:380px;height:760px;padding:0;background:none;box-shadow:none}
  .pscreen{border-radius:24px;border:1px solid var(--line)}.pnotch{display:none}
  .search-btn{margin-left:0}
}

const I=(n,s=18,sw=1.8)=>`<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

/* ======================= Utils ======================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const gaussFn=r=>()=>{let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const G=gaussFn(Math.random);
const fmtP=(p,dp=2)=>isFinite(p)?p.toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp}):'—';
const fmtN=n=>{if(!isFinite(n))return'—';const a=Math.abs(n);return a>=1e12?(n/1e12).toFixed(2)+'T':a>=1e9?(n/1e9).toFixed(2)+'B':a>=1e6?(n/1e6).toFixed(2)+'M':a>=1e4?(n/1e3).toFixed(1)+'K':n.toFixed(a<10?2:0)};
const money=(n,d=2)=>(n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const smoney=n=>(n>=0?'+':'−')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=x=>(x>=0?'+':'−')+Math.abs(x*100).toFixed(2)+'%';
const cls=x=>x>=0?'up':'down';
function alpha(hex,a){hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');const n=parseInt(hex,16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clockStr=t=>new Date(t).toLocaleTimeString('en-US',{hour12:false});

/* ======================= Market data ======================= */
const SYMS=[
 {s:'AAPL',n:'Apple Inc.',sec:'Technology',p:228.52,vol:.016,cap:3.48e12,pe:34.6,vb:6e6},
 {s:'MSFT',n:'Microsoft Corp.',sec:'Technology',p:431.18,vol:.015,cap:3.2e12,pe:36.1,vb:3e6},

const SYM=k=>SYMS.find(s=>s.s===k);
const TFS=[{k:'1m',sec:60},{k:'5m',sec:300},{k:'15m',sec:900},{k:'1H',sec:3600},{k:'4H',sec:14400},{k:'1D',sec:86400},{k:'1W',sec:604800}];

function genSeries(sym,tf,n=480){
  const r=mulberry32(hash(sym.s+'|'+tf.k)),g=gaussFn(r),ms=tf.sec*1000;
  const sig=sym.vol*Math.sqrt(tf.sec/86400)*(tf.sec<86400?1.5:1),ph=r()*10;
  const rel=new Array(n),rets=new Array(n);rel[n-1]=1;
  for(let i=n-1;i>0;i--){const drift=sig*(0.24*Math.sin(i/41+ph)+0.12*Math.sin(i/13+ph*2));const ret=drift+sig*g();rets[i]=ret;rel[i-1]=rel[i]/(1+ret)}
  const P=sym.last,lastT=Math.floor(Date.now()/ms)*ms,out=[];
  for(let i=0;i<n;i++){const c=rel[i]*P,o=i?rel[i-1]*P*(1+sig*.06*g()):c*(1-sig*.3*g());
    out.push({t:lastT-(n-1-i)*ms,o,c,h:Math.max(o,c)*(1+Math.abs(g())*sig*.45),l:Math.min(o,c)*(1-Math.abs(g())*sig*.45),v:sym.vb*tf.sec/3600*(0.45+r()+Math.abs(rets[i]||0)/sig*.6)})}
  out[n-1].v*=.35;return out;
}
const CACHE={};
function syncSeries(s,sym,tf){const ms=tf.sec*1000,now=Date.now();let lb=s[s.length-1];
  while(now>=lb.t+ms){const nb={t:lb.t+ms,o:lb.c,h:lb.c,l:lb.c,c:lb.c,v:0};s.push(nb);if(s.length>1200)s.shift();lb=nb}
  lb.c=sym.last;lb.h=Math.max(lb.h,lb.c);lb.l=Math.min(lb.l,lb.c);return s}
function series(sym,tf){const k=sym.s+'|'+tf.k;if(!CACHE[k])CACHE[k]=genSeries(sym,tf);return syncSeries(CACHE[k],sym,tf)}

/* ======================= Indicator math ======================= */
const NA=n=>new Array(n).fill(NaN);
const C=d=>d.map(b=>b.c),Hh=d=>d.map(b=>b.h),Ll=d=>d.map(b=>b.l),Vv=d=>d.map(b=>b.v);
function sma(a,n){const o=NA(a.length);let s=0,k=0;for(let i=0;i<a.length;i++){if(isFinite(a[i])){s+=a[i];k++}if(i>=n&&isFinite(a[i-n])){s-=a[i-n];k--}if(k===n)o[i]=s/n}return o}
function emaA(a,n,al){const o=NA(a.length);let p=NaN,s=0,k=0;for(let i=0;i<a.length;i++){const v=a[i];if(!isFinite(v))continue;if(isNaN(p)){s+=v;k++;if(k===n){p=s/n;o[i]=p}}else{p=v*al+p*(1-al);o[i]=p}}return o}
const ema=(a,n)=>emaA(a,n,2/(n+1)), rma=(a,n)=>emaA(a,n,1/n);
function wma(a,n){const o=NA(a.length),den=n*(n+1)/2;for(let i=n-1;i<a.length;i++){let s=0;for(let j=0;j<n;j++)s+=a[i-j]*(n-j);o[i]=s/den}return o}
function stdev(a,n,m){const o=NA(a.length);for(let i=n-1;i<a.length;i++){let s=0;for(let j=0;j<n;j++)s+=(a[i-j]-m[i])**2;o[i]=Math.sqrt(s/n)}return o}
function hhv(a,n){const o=NA(a.length);for(let i=n-1;i<a.length;i++){let m=-Infinity;for(let j=0;j<n;j++)m=Math.max(m,a[i-j]);o[i]=m}return o}
function llv(a,n){const o=NA(a.length);for(let i=n-1;i<a.length;i++){let m=Infinity;for(let j=0;j<n;j++)m=Math.min(m,a[i-j]);o[i]=m}return o}
function trA(d){return d.map((b,i)=>i?Math.max(b.h-b.l,Math.abs(b.h-d[i-1].c),Math.abs(b.l-d[i-1].c)):b.h-b.l)}

const zip=(a,b,f)=>a.map((v,i)=>f(v,b[i]));

function psar(d,st,mx){const o=NA(d.length);if(d.length<3)return o;let up=true,af=st,ep=d[0].h,sar=d[0].l;
  for(let i=1;i<d.length;i++){sar=sar+af*(ep-sar);const p1=d[i-1],p2=d[Math.max(0,i-2)];
    if(up){sar=Math.min(sar,p1.l,p2.l);if(d[i].l<sar){up=false;sar=ep;ep=d[i].l;af=st}else if(d[i].h>ep){ep=d[i].h;af=Math.min(af+st,mx)}}
    else{sar=Math.max(sar,p1.h,p2.h);if(d[i].h>sar){up=true;sar=ep;ep=d[i].h;af=st}else if(d[i].l<ep){ep=d[i].l;af=Math.min(af+st,mx)}}

function adx(d,n){const len=d.length,pdm=NA(len),mdm=NA(len),tr=NA(len);for(let i=1;i<len;i++){const u=d[i].h-d[i-1].h,dn=d[i-1].l-d[i].l;pdm[i]=u>dn&&u>0?u:0;mdm[i]=dn>u&&dn>0?dn:0;tr[i]=Math.max(d[i].h-d[i].l,Math.abs(d[i].h-d[i-1].c),Math.abs(d[i].l-d[i-1].c))}

const FONT='11px Inter, system-ui, sans-serif';
let UID=0;
class Chart{
  constructor(host,o={}){

    this.cv=document.createElement('canvas');this.cv.setAttribute('role','img');host.prepend(this.cv);this.ctx=this.cv.getContext('2d');
    this.lg=document.createElement('div');this.lg.className='legend';this.cv.after(this.lg);
    this.data=[];this.ha=[];this.ind=[];this.drawings=[];this.lines=[];
    this.type='candles';this.log=false;this.bw=8;this.end=0;this.m=null;this.tool='cursor';this.pending=null;this.sel=-1;this.drag=null;this.hideDraw=false;

  }
  resize(){const r=this.host.getBoundingClientRect();if(!r.width||!r.height)return;this.w=r.width;this.h=r.height;const dpr=window.devicePixelRatio||1;
    this.cv.width=Math.round(this.w*dpr);this.cv.height=Math.round(this.h*dpr);this.cv.style.width=this.w+'px';this.cv.style.height=this.h+'px';this.ctx.setTransform(dpr,0,0,dpr,0,0);this.lgDirty=true;this.render()}
  req(){if(this._raf)return;this._raf=requestAnimationFrame(()=>{this._raf=0;this.render()})}
  setData(d,sym,tf,keep){const grew=d.length-(this.data.length||d.length);const follow=keep&&this.end>=this.data.length-1.5;
    this.data=d;this.sym=sym;this.tf=tf;if(!keep)this.resetView();else if(follow&&grew>0)this.end+=grew;this.compute();this.req()}
  resetView(){this.bw=this.o.compact?4:8;this.end=this.data.length-1+(this.o.compact?1:6)}
  compute(){const d=this.data;if(this.type==='ha'){const h=[];d.forEach((b,i)=>{const c=(b.o+b.h+b.l+b.c)/4,o=i?(h[i-1].o+h[i-1].c)/2:(b.o+b.c)/2;h.push({t:b.t,o,c,h:Math.max(b.h,o,c),l:Math.min(b.l,o,c),v:b.v})});this.ha=h}
    for(const ind of this.ind){ind.out=DEFS[ind.key].calc(d,ind.params,{tf:this.tf?.sec||3600})}}
  indChanged(){this.compute();this.lgDirty=true;this.req()}
  bars(){return this.type==='ha'?this.ha:this.data}
  clampEnd(e){const n=this.data.length,pw=this.L.plotW||600;return Math.max(Math.min(10,n-1),Math.min(n-1+pw/this.bw*0.7,e))}
  idxAt(x){return this.end-(this.L.plotW-this.bw/2-x)/this.bw}
  X(i){return this.L.plotW-(this.end-i)*this.bw-this.bw/2}
  Y(p){const s=this.ys;return s.bot-(s.f(p)-s.a)/(s.b-s.a)*(s.bot-s.top)}
  P(y){const s=this.ys;return s.fi(s.a+(s.bot-y)/(s.bot-s.top)*(s.b-s.a))}
  zoom(f,cx){const pw=this.L.plotW;cx=cx??pw*0.75;const i0=this.idxAt(cx);this.bw=Math.max(1.5,Math.min(48,this.bw*f));this.end=this.clampEnd(i0+(pw-this.bw/2-cx)/this.bw);this.req()}
  pan(bars){this.end=this.clampEnd(this.end+bars);this.req()}
  fmt(p){return fmtP(p,this.sym?.dp??2)}
  pos(e){const r=this.cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
  pt(p){return{i:this.idxAt(p.x),p:this.P(p.y)}}
  hitLine(p){if(p.y>this.L.mainH)return null;return this.lines.find(l=>l.drag&&Math.abs(this.Y(l.price)-p.y)<6)||null}
  hitDrawing(p){if(this.hideDraw)return-1;for(let k=this.drawings.length-1;k>=0;k--){const d=this.drawings[k],ax=this.X(d.a.i),ay=this.Y(d.a.p);
      if(d.t==='hline'){if(Math.abs(ay-p.y)<6)return k;continue}
      const bx=this.X(d.b.i),by=this.Y(d.b.p);
      if(d.t==='trend'){const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((p.x-ax)*dx+(p.y-ay)*dy)/L2));if(Math.hypot(ax+t*dx-p.x,ay+t*dy-p.y)<6)return k}
      else if(p.x>=Math.min(ax,bx)-4&&p.x<=Math.max(ax,bx)+4&&p.y>=Math.min(ay,by)-4&&p.y<=Math.max(ay,by)+4)return k}
    return-1}
  setTool(t){this.tool=t;this.pending=null;this.o.onTool?.(t);this.req()}
  delSel(){if(this.sel>=0){this.drawings.splice(this.sel,1);this.sel=-1;this.req();return true}return false}
  bind(){const cv=this.cv;
    cv.addEventListener('pointerdown',e=>{if(e.button!==0)return;cv.setPointerCapture(e.pointerId);const p=this.pos(e);this.m=p;
      if(this.tool!=='cursor'&&!this.o.compact&&p.y<this.L.mainH&&p.x<this.L.plotW){const pt=this.pt(p);
        if(!this.pending){if(this.tool==='hline'){this.drawings.push({t:'hline',a:pt});this.sel=this.drawings.length-1;this.setTool('cursor')}else this.pending={t:this.tool,a:pt,b:{...pt}}}
        else{this.pending.b=pt;this.drawings.push(this.pending);this.sel=this.drawings.length-1;this.setTool('cursor')}
        this.req();return}
      if(!this.o.compact){const ln=this.hitLine(p);if(ln){this.drag={kind:'line',ln};return}
        const di=this.hitDrawing(p);this.sel=di;if(di>=0){const d=this.drawings[di];this.drag={kind:'move',d,start:this.pt(p),orig:JSON.parse(JSON.stringify(d))};this.req();return}}
      this.drag={kind:'pan',x0:p.x,end0:this.end};cv.style.cursor='grabbing'});
    cv.addEventListener('pointermove',e=>{const p=this.pos(e);this.m=p;const d=this.drag;
      if(d?.kind==='pan')this.end=this.clampEnd(d.end0+(d.x0-p.x)/this.bw);
      else if(d?.kind==='line'){d.ln.set(this.P(Math.min(p.y,this.ys.bot)));this.o.onLineDrag?.(d.ln)}
      else if(d?.kind==='move'){const pt=this.pt(p),di=pt.i-d.start.i,dp=pt.p-d.start.p;for(const k of['a','b'])if(d.orig[k])d.d[k]={i:d.orig[k].i+di,p:d.orig[k].p+dp}}
      else if(this.pending)this.pending.b=this.pt(p);
      else if(!this.o.compact)cv.style.cursor=this.tool!=='cursor'?'crosshair':this.hitLine(p)?'ns-resize':this.hitDrawing(p)>=0?'move':'crosshair';
      this.req()});
    cv.addEventListener('pointerup',()=>{const d=this.drag;this.drag=null;this.cv.style.cursor='';if(d?.kind==='line')this.o.onLineDrop?.(d.ln)});
    cv.addEventListener('pointerleave',()=>{if(!this.drag){this.m=null;this.req()}});
    cv.addEventListener('wheel',e=>{e.preventDefault();const p=this.pos(e);if(e.shiftKey||Math.abs(e.deltaX)>Math.abs(e.deltaY)){this.pan((e.deltaX||e.deltaY)/this.bw*0.6);return}this.zoom(Math.exp(-e.deltaY*0.0015),Math.min(p.x,this.L.plotW))},{passive:false});
    cv.addEventListener('dblclick',()=>{this.resetView();this.req()});
    this.lg.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;this.o.onLegend?.(+b.closest('[data-uid]').dataset.uid,b.dataset.a)});
  }
  color(ind,j){return T.s[ind.colors[j]]||T.brand}

  /* ---------- Legend (HTML overlay) ---------- */
  buildLegend(){this.lgDirty=false;if(this.o.compact){this.lg.innerHTML='';return}
    const row=ind=>{const d=DEFS[ind.key];const lbl=d.short+(d.params.length?' '+d.params.map(p=>ind.params[p.k]).join(' '):'');
      return`<div class="lg-row ${ind.hidden?'off':''}" data-uid="${ind.uid}"><span class="lg-name">${esc(lbl)}</span><span class="lg-val"></span><span class="lg-act"><button data-a="hide" aria-label="${ind.hidden?'Show':'Hide'} ${esc(lbl)}">${I(ind.hidden?'eyeoff':'eye',13)}</button><button data-a="cfg" aria-label="Settings for ${esc(lbl)}">${I('gear',13)}</button><button data-a="rm" aria-label="Remove ${esc(lbl)}">${I('x',13)}</button></span></div>`};
    const main=this.ind.filter(i=>DEFS[i.key].pane!=='sub'),subs=this.ind.filter(i=>DEFS[i.key].pane==='sub');
    this.lg.innerHTML=`<div class="lg-g" data-pane="0" style="top:4px"><div class="lg-hdr" id="lgHdr"></div>${main.map(row).join('')}</div>`+subs.map((ind,k)=>`<div class="lg-g" data-pane="${k+1}">${row(ind)}</div>`).join('');
    this.lgHdr=this.lg.querySelector('.lg-hdr');this.lgVals={};$$('.lg-row',this.lg).forEach(r=>this.lgVals[r.dataset.uid]=r.querySelector('.lg-val'))}
  updateLegend(idx){if(this.o.compact)return;const b=this.data[idx],pb=this.data[idx-1];if(!b)return;const dp=this.sym.dp,ch=b.c-(pb?pb.c:b.o);
    this.lgHdr.innerHTML=`<b>${esc(this.sym.s)}</b><span class="muted">${this.tf.k} · ${esc(this.sym.ex)}</span><span><span class="k">O</span>${fmtP(b.o,dp)}</span><span><span class="k">H</span>${fmtP(b.h,dp)}</span><span><span class="k">L</span>${fmtP(b.l,dp)}</span><span><span class="k">C</span>${fmtP(b.c,dp)}</span><span class="${cls(ch)}">${ch>=0?'+':'−'}${fmtP(Math.abs(ch),dp)} (${pct(ch/(pb?pb.c:b.o))})</span>`;

function modal(title,body,{foot='',wide=false,onClose}={}){closeModal();const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" style="${wide?'max-width:720px':''}"><div class="modal-h"><h3>${esc(title)}</h3><button class="ibtn" data-close aria-label="Close">${I('x')}</button></div><div class="modal-b">${body}</div>${foot?`<div class="modal-f">${foot}</div>`:''}</div>`;
  bg.addEventListener('mousedown',e=>{if(e.target===bg||e.target.closest('[data-close]'))closeModal()});bg._onClose=onClose;$('#modalRoot').appendChild(bg);setTimeout(()=>bg.querySelector('input,button.pri,select')?.focus(),20);return bg}
function closeModal(){const m=$('.modal-bg');if(m){m._onClose?.();m.remove()}}
function sparkSVG(vals,w=80,h=26,col){const lo=Math.min(...vals),hi=Math.max(...vals),r=hi-lo||1;const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-2-(v-lo)/r*(h-4)).toFixed(1)}`).join(' ');col=col||(vals.at(-1)>=vals[0]?'var(--up)':'var(--down)');return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round"/></svg>`}
const spark7=s=>series(s,TFS[4]).slice(-42).map(b=>b.c);

/* live-bound cells: data-px, data-chg, data-chga, data-pnl, data-pnlp, data-mv, data-eq, data-dpnl, data-cash, data-heat, data-range */
function liveUpdate(){
  $$('[data-px]').forEach(e=>{const s=SYM(e.dataset.px);e.textContent=fmtP(s.last,s.dp)});
  $$('[data-chg]').forEach(e=>{const s=SYM(e.dataset.chg),c=s.last/s.prev-1;e.textContent=pct(c);e.className=e.className.replace(/\b(up|down)\b/g,'').trim()+' '+cls(c)});
  $$('[data-chga]').forEach(e=>{const s=SYM(e.dataset.chga),c=s.last-s.prev;e.textContent=(c>=0?'+':'−')+fmtP(Math.abs(c),s.dp);e.className=cls(c)});
  $$('[data-pnl]').forEach(e=>{const p=posOf(e.dataset.pnl);if(!p)return;const v=p.q*(SYM(p.sym).last-p.avg);e.textContent=smoney(v);e.className='num '+cls(v)});
  $$('[data-pnlp]').forEach(e=>{const p=posOf(e.dataset.pnlp);if(!p)return;const v=(SYM(p.sym).last/p.avg-1)*Math.sign(p.q);e.textContent=pct(v);e.className='num '+cls(v)});
  $$('[data-mv]').forEach(e=>{const p=posOf(e.dataset.mv);if(p)e.textContent=money(p.q*SYM(p.sym).last)});
  $$('[data-eq]').forEach(e=>e.textContent=money(equity()));
  $$('[data-dpnl]').forEach(e=>{const v=dayPnl();e.textContent=smoney(v);e.className=cls(v)});
  $$('[data-cash]').forEach(e=>e.textContent=money(App.cash));
  $$('[data-range]').forEach(e=>{const s=SYM(e.dataset.range);s.hi=Math.max(s.hi,s.last);s.lo=Math.min(s.lo,s.last);e.querySelector('i').style.left=((s.last-s.lo)/(s.hi-s.lo||1)*100)+'%';const t=e.parentNode.querySelector('[data-rt]');if(t)t.textContent=fmtP(s.lo,s.dp)+' – '+fmtP(s.hi,s.dp)});
  $$('[data-heat]').forEach(e=>{const s=SYM(e.dataset.heat),c=s.last/s.prev-1;e.style.background=heatColor(c);e.querySelector('span').textContent=pct(c)});
}
function heatColor(c){const k=Math.min(1,Math.abs(c)/0.03);return`color-mix(in oklab, ${c>=0?'var(--up)':'var(--down)'} ${Math.round(18+k*62)}%, var(--panel-2))`}

function setChartLines(){const s=App.sym,ls=[],p=posOf(s.s);
  if(p){const pnl=p.q*(s.last-p.avg);ls.push({price:p.avg,label:`${p.q>0?'LONG':'SHORT'} ${qfmt(Math.abs(p.q),s)}  ${smoney(pnl)}`,color:T.s[0],dash:[1,0]});

  <div class="tk-msg" id="tkMsg" role="alert"></div>

function calcTicket(){const s=App.sym,tk=App.tk;if(!$('#tkGo'))return;const q=parseFloat(tk.qty),px=tk.type==='market'?(tk.side==='buy'?ask(s):bid(s)):parseFloat(tk.price);
  $('#tkBid').textContent=fmtP(bid(s),s.dp);$('#tkAsk').textContent=fmtP(ask(s),s.dp);
  let err='',warn='';const ref=isFinite(px)?px:s.last;
  if(!(q>0))err='Enter a quantity greater than zero.';
  else if(tk.type!=='market'&&!(px>0))err=`Enter a ${tk.type} price.`;
  else if(tk.side==='buy'&&q*px>App.cash)err=`Not enough buying power. Max ≈ ${qfmt(Math.floor(App.cash/px*10**(s.qdp||0))/10**(s.qdp||0),s)} ${s.unit}.`;
  const tp=parseFloat(tk.tpPx),sl=parseFloat(tk.slPx),L=tk.side==='buy';
  if(!err&&tk.tp&&!(L?tp>ref:tp<ref))err=`Take profit must be ${L?'above':'below'} the entry price.`;
  if(!err&&tk.sl&&!(L?sl<ref:sl>ref))err=`Stop loss must be ${L?'below':'above'} the entry price.`;
  if(!err&&tk.type==='limit'&&(L?px>ask(s):px<bid(s)))warn=`This limit is ${L?'above the ask':'below the bid'} and will fill right away.`;
  if(!err&&tk.type==='stop'&&(L?px<s.last:px>s.last))warn=`Stop is already ${L?'below':'above'} the market and will trigger right away.`;
  $('#tkTpP').textContent=tk.tp&&tp>0?pct((tp/ref-1)):'';$('#tkSlP').textContent=tk.sl&&sl>0?pct((sl/ref-1)):'';
  $('#tkRR').textContent=tk.tp&&tk.sl&&tp>0&&sl>0?`1 : ${(Math.abs(tp-ref)/Math.abs(ref-sl)).toFixed(2)}`:'—';
  $('#tkCostL').textContent=L?'Est. cost':'Est. proceeds';$('#tkCost').textContent=q>0&&isFinite(px)?money(q*px):'—';
  const m=$('#tkMsg');m.className='tk-msg '+(err?'err':warn?'warn':'');m.textContent=err||warn;
  const g=$('#tkGo');g.disabled=!!err;g.textContent=`${L?'Buy':'Sell'} ${q>0?qfmt(q,s)+' ':''}${s.s}${tk.type!=='market'?' · '+tk.type[0].toUpperCase()+tk.type.slice(1):''}`}
function reviewOrder(){const s=App.sym,tk=App.tk,q=parseFloat(tk.qty),px=tk.type==='market'?(tk.side==='buy'?ask(s):bid(s)):parseFloat(tk.price),L=tk.side==='buy';
  modal('Review order',`<div class="kv"><div><span class="m2">Symbol</span><b>${esc(s.s)} · ${esc(s.n)}</b></div><div><span class="m2">Side</span><b class="${L?'up':'down'}">${L?'Buy':'Sell'}</b></div><div><span class="m2">Type</span><b>${tk.type[0].toUpperCase()+tk.type.slice(1)} · ${tk.tif}</b></div><div><span class="m2">Quantity</span><b class="num">${qfmt(q,s)} ${esc(s.unit)}</b></div><div><span class="m2">${tk.type==='market'?'Est. price':'Price'}</span><b class="num">${fmtP(px,s.dp)}</b></div>${tk.tp?`<div><span class="m2">Take profit</span><b class="num up">${fmtP(+tk.tpPx,s.dp)}</b></div>`:''}${tk.sl?`<div><span class="m2">Stop loss</span><b class="num down">${fmtP(+tk.slPx,s.dp)}</b></div>`:''}<div style="border-top:1px solid var(--line);padding-top:8px"><span class="m2">${L?'Est. total':'Est. proceeds'}</span><b class="num">${money(q*px)}</b></div></div>${tk.type==='market'?'<p class="muted" style="font-size:12px;margin-top:12px">Market orders fill at the best available price, which may differ from the estimate.</p>':''}`,
   {foot:`<button class="btn" data-close>Edit</button><button class="btn pri" id="confirmGo" style="background:var(${L?'--up':'--down'});border-color:var(${L?'--up':'--down'})">Confirm ${L?'buy':'sell'}</button>`});
  $('#confirmGo').onclick=()=>{closeModal();placeOrder()}}
function placeOrder(){const s=App.sym,tk=App.tk,q=parseFloat(tk.qty),L=tk.side==='buy';const o={id:++OID,t:Date.now(),sym:s.s,side:tk.side,type:tk.type,qty:q,tif:tk.tif,tp:tk.tp?+tk.tpPx:null,sl:tk.sl?+tk.slPx:null};
  if(tk.type==='market'){fill(o,L?ask(s):bid(s))}else{o.price=+tk.price;o.status='Open';App.orders.push(o);notify(`${o.type==='limit'?'Limit':'Stop'} ${o.side} ${qfmt(q,s)} ${s.s} @ ${fmtP(o.price,s.dp)} placed`,'');App.btab='orders'}
  tk.price='';tk.tp=false;tk.sl=false;tk.tpPx='';tk.slPx='';renderTicket();renderBottom();setChartLines();renderSymbar();liveUpdate()}
function fill(o,price){const s=SYM(o.sym),sg=o.side==='buy'?1:-1;let p=posOf(o.sym);
  App.cash-=sg*o.qty*price;
  if(!p){p={sym:o.sym,q:0,avg:price};App.positions.push(p)}
  const nq=p.q+sg*o.qty;if(Math.sign(p.q)===sg||p.q===0)p.avg=(p.avg*Math.abs(p.q)+price*o.qty)/Math.abs(nq);else if(Math.sign(nq)===sg)p.avg=price;
  p.q=+nq.toFixed(8);if(o.tp)p.tp=o.tp;if(o.sl)p.sl=o.sl;if(Math.abs(p.q)<1e-9)App.positions=App.positions.filter(x=>x!==p);
  o.status='Filled';o.price=price;o.t=Date.now();App.orders=App.orders.filter(x=>x!==o);App.history.push(o);
  notify(`Filled: ${o.side==='buy'?'Bought':'Sold'} ${qfmt(o.qty,s)} ${s.s} @ ${fmtP(price,s.dp)}`,'ok');App.btab='positions'}
function closePos(sym){const p=posOf(sym),s=SYM(sym);if(!p)return;fill({id:++OID,t:Date.now(),sym,side:p.q>0?'sell':'buy',type:'market',qty:Math.abs(p.q),tif:'Day'},p.q>0?bid(s):ask(s));renderBottom();setChartLines();renderSymbar();if(App.view==='portfolio')renderPortfolio()}

function buildBook(){$('#bookSym').textContent=App.sym.s;const rows=n=>Array.from({length:n},()=>'<button class="ob-row"><i></i><span class="num"></span><span class="num"></span><span class="num"></span></button>').join('');
  $('#book').innerHTML=App.book==='book'?`<div class="ob-cols"><span>Price</span><span>Size</span><span>Total</span></div><div id="asks">${rows(11)}</div><div class="ob-mid"><b class="num" id="obLast"></b><span class="muted" style="font-size:11.5px">Spread <span class="num" id="obSpread"></span></span></div><div id="bids">${rows(11)}</div>`
   :`<div class="ob-cols"><span>Price</span><span>Size</span><span>Time</span></div><div id="tape"></div>`;updateBook()}
function updateBook(){const s=App.sym,st=spread(s);if(App.book==='tape'){$('#tape').innerHTML=App.tape.filter(t=>t.sym===s.s).slice(0,24).map(t=>`<div class="tape-row"><span class="${t.up?'up':'down'}">${fmtP(t.p,s.dp)}</span><span>${qfmt(t.q,s)}</span><span class="muted">${clockStr(t.t)}</span></div>`).join('')||'<div class="empty">Waiting for trades…</div>';return}
  const step=Math.max(Math.pow(10,-s.dp),niceStep(s.last*0.00015)),base=s.vb/40,mk=side=>{let cum=0;return Array.from({length:11},(_,k)=>{const q=base*(0.3+Math.random()*1.4)*(1+k*0.15);cum+=q;return{p:side>0?ask(s)+k*step:bid(s)-k*step,q,cum}})};
  const A=mk(1),B=mk(-1),mx=Math.max(A.at(-1).cum,B.at(-1).cum);
  const put=(el,list,col)=>[...el.children].forEach((r,k)=>{const d=list[k];r.dataset.p=d.p;r.children[0].style.cssText=`width:${d.cum/mx*100}%;background:${col}`;r.children[1].textContent=fmtP(d.p,s.dp);r.children[1].className='num '+(col.includes('up')?'up':'down');r.children[2].textContent=fmtN(d.q);r.children[3].textContent=fmtN(d.cum)});
  put($('#asks'),A.slice().reverse().map((d,k,arr)=>d),'var(--down)');put($('#bids'),B,'var(--up)');
  const l=$('#obLast');l.textContent=fmtP(s.last,s.dp);l.className='num '+cls(s.last-s.prev);$('#obSpread').textContent=fmtP(st,s.dp)}

function tick(){const now=Date.now();
  for(const s of SYMS){const pv=s.last;s.last=Math.max(s.last*0.5,s.last*(1+s.vol*0.0009*G()));s.last=+s.last.toFixed(s.dp);s.dvol+=s.vb*Math.random()*0.01;
    for(const a of App.alerts){if(!a.on||a.status!=='Active'||a.sym!==s.s)continue;const c=s.last/s.prev-1;
      if((a.cond==='above'&&pv<a.v&&s.last>=a.v)||(a.cond==='below'&&pv>a.v&&s.last<=a.v)||(a.cond==='up'&&c*100>=a.v)||(a.cond==='down'&&c*100<=-a.v)){a.status='Triggered';notify(`Alert: ${s.s} ${condText(a).toLowerCase()} — now ${fmtP(s.last,s.dp)}`,'warn');renderBottom();setChartLines();if(App.view==='alerts')renderAlerts()}}
    for(const o of App.orders.slice()){if(o.sym!==s.s||o.status!=='Open')continue;const L=o.side==='buy';
      if(o.type==='limit'?(L?s.last<=o.price:s.last>=o.price):(L?s.last>=o.price:s.last<=o.price)){fill(o,o.type==='limit'?o.price:s.last);renderBottom();setChartLines();if(s===App.sym)renderSymbar()}}
    const p=posOf(s.s);if(p){const L=p.q>0;if(p.tp&&(L?s.last>=p.tp:s.last<=p.tp)){notify(`Take profit hit on ${s.s}`,'ok');closePos(s.s)}else if(p.sl&&(L?s.last<=p.sl:s.last>=p.sl)){notify(`Stop loss hit on ${s.s}`,'bad');closePos(s.s)}}
    if(s===App.sym){const n=1+Math.floor(Math.random()*3);for(let k=0;k<n;k++)App.tape.unshift({sym:s.s,p:s.last+(Math.random()-.5)*spread(s),q:s.vb/200*(0.2+Math.random()*3)*(s.qdp?1:1),up:s.last>=pv,t:now});App.tape.length=Math.min(App.tape.length,60)}}
  const ser=series(App.sym,App.tf);ser.at(-1).v+=App.sym.vb*App.tf.sec/3600*0.004*Math.random();chart.setData(ser,App.sym,App.tf,true);setChartLines();
  if(App.view==='mobile'&&mchart&&document.body.contains(mchart.cv)){series(App.sym,mchart.tf);mchart.compute();mchart.req();if(mchart._hov==null)mobHover(null);updMobEst()}
  if(App.view==='trade'){updateBook();calcTicket()}
  liveUpdate()}

  if(d.side){App.tk.side=d.side;renderTicket();setChartLines();return}
  if(d.otype){App.tk.type=d.otype;if(d.otype!=='market'&&!App.tk.price)App.tk.price=App.sym.last.toFixed(App.sym.dp);renderTicket();setChartLines();return}
  if(d.pct){const s=App.sym,tk=App.tk,p=posOf(s.s),px=tk.type==='market'?ask(s):(+tk.price||s.last),f=+d.pct/100,qd=10**(s.qdp||0);
    tk.qty=String(tk.side==='sell'&&p&&p.q>0?Math.floor(p.q*f*qd)/qd:Math.floor(App.cash*f/px*qd)/qd);$('#tkQty').value=tk.qty;calcTicket();return}
  if(d.b){App.book=d.b;$$('#bookSeg button').forEach(x=>x.classList.toggle('on',x===t));buildBook();return}
  if(d.mkcls){App.mk.cls=d.mkcls;$$('#mkcls .chip').forEach(x=>x.classList.toggle('on',x===t));drawMkTable();return}
  if(d.sort){const mk=App.mk;if(mk.sort===d.sort)mk.dir*=-1;else{mk.sort=d.sort;mk.dir=d.sort==='s'?1:-1}drawMkTable();return}
  if(d.watch){App.watch.has(d.watch)?App.watch.delete(d.watch):App.watch.add(d.watch);drawMkTable();renderWatchlist();return}
  if(d.eqr){eqRange=+d.eqr;$$('#eqSeg button').forEach(x=>x.classList.toggle('on',x===t));drawEquity();return}
  if(d.ord){App.ord=d.ord;renderOrders();return}
  if(d.altog){const a=App.alerts.find(x=>x.id==d.altog);a.on=!a.on;if(a.on)a.status='Active';renderAlerts();renderBottom();setChartLines();return}
  if(d.aldel){App.alerts=App.alerts.filter(x=>x.id!=d.aldel);renderAlerts();renderBottom();setChartLines();toast('Alert deleted');return}
  if(d.libcat){App.indCat=d.libcat;renderIndicators();return}
  if(d.libadd){if(addInd(d.libadd)){go('trade');toast(DEFS[d.libadd].name+' added to chart','ok')}return}
  if(d.mtf){mob.tf=+d.mtf;renderMobile();return}
  if(d.msheet){if(d.msheet==='close'&&e.target!==t)return;mob.sheet=d.msheet==='close'?false:d.msheet;renderMobile();return}
  if(d.mq){mob.qty=Math.max(1,mob.qty+ +d.mq);$('#mq').value=mob.qty;updMobEst();$('[data-mplace]').textContent=`${mob.sheet==='buy'?'Buy':'Sell'} ${mob.qty} ${App.sym.s}`;return}
  if(d.mplace){const s=App.sym;fill({id:++OID,t:Date.now(),sym:s.s,side:mob.sheet,type:'market',qty:mob.qty,tif:'Day'},mob.sheet==='buy'?ask(s):bid(s));mob.sheet=false;renderMobile();renderBottom();setChartLines();return}
  const a=d.act;if(!a)return;
  ({search:openSearch,ind:openIndicators,alert:()=>alertDialog(App.sym.s,chart.m&&chart.m.y<chart.L.mainH?chart.P(chart.m.y):null),
    log:()=>{chart.log=!chart.log;chart.req();renderToolbar()},
    shot:()=>{const a=document.createElement('a');a.download=`${App.sym.s.replace('/','-')}-${App.tf.k}.png`;a.href=chart.cv.toDataURL('image/png');a.click();toast('Chart image downloaded','ok')},
    focus:()=>{$('#v-trade').classList.toggle('focus');renderToolbar()},
    wl:()=>{if(matchMedia('(max-width:1300px)').matches){$('#v-trade').classList.toggle('wl-open');$('#wlClose').style.display=''}else{$('#v-trade').classList.toggle('focus')}renderToolbar()},
    hidedraw:()=>{chart.hideDraw=!chart.hideDraw;chart.sel=-1;renderTools();chart.req()},
    cleardraw:()=>{if(!chart.drawings.length){toast('No drawings to remove');return}const n=chart.drawings.length,keep=chart.drawings;chart.drawings=[];chart.sel=-1;chart.req();toast(`${n} drawing${n>1?'s':''} removed`)},
    collapse:()=>{$('#bottom').classList.toggle('collapsed');renderBottom()},
    star:()=>{const k=App.sym.s;App.watch.has(k)?App.watch.delete(k):App.watch.add(k);renderSymbar();renderWatchlist();if(App.view==='mobile')renderMobile();liveUpdate()},
    usemkt:()=>{App.tk.price=App.sym.last.toFixed(App.sym.dp);$('#tkPrice').value=App.tk.price;calcTicket();setChartLines()},
    csv:()=>{const rows=[['id','time','symbol','side','type','qty','price','status'],...[...App.orders,...App.history].map(o=>[o.id,new Date(o.t).toISOString(),o.sym,o.side,o.type,o.qty,o.price,o.status])];const b=new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='orders.csv';l.click();toast('orders.csv downloaded','ok')},
  })[a]?.()});
document.addEventListener('input',e=>{const id=e.target.id,tk=App.tk;
  if(id==='tkQty'){tk.qty=e.target.value;calcTicket()}else if(id==='tkPrice'){tk.price=e.target.value;calcTicket();setChartLines()}
  else if(id==='tkTpPx'){tk.tpPx=e.target.value;calcTicket()}else if(id==='tkSlPx'){tk.slPx=e.target.value;calcTicket()}
  else if(id==='tkTif')tk.tif=e.target.value;else if(id==='ctype'){chart.type=e.target.value;chart.compute();chart.req()}else if(id==='wlFilter')renderWatchlist();
  else if(id==='mq'){mob.qty=Math.max(1,parseInt(e.target.value)||1);updMobEst()}});
document.addEventListener('change',e=>{const id=e.target.id,tk=App.tk,s=App.sym;
  if(id==='tkTp'||id==='tkSl'){const on=e.target.checked,k=id==='tkTp'?'tp':'sl';tk[k]=on;const ref=tk.type==='market'?s.last:(+tk.price||s.last),L=tk.side==='buy';
    if(on&&!tk[k+'Px'])tk[k+'Px']=(ref*(1+(k==='tp'?1:-1)*(L?1:-1)*(k==='tp'?0.04:0.02))).toFixed(s.dp);renderTicket()}});
$('#ticket').addEventListener('click',e=>{if(e.target.closest('#tkGo'))reviewOrder()});
$('#book').addEventListener('click',e=>{const r=e.target.closest('.ob-row');if(!r||!r.dataset.p)return;const tk=App.tk;if(tk.type==='market')tk.type='limit';tk.price=(+r.dataset.p).toFixed(App.sym.dp);renderTicket();setChartLines();toast('Limit price set from order book')});
$('#wlList').addEventListener('click',e=>{const r=e.target.closest('[data-sym]');if(r)e.stopPropagation(),switchSym(r.dataset.sym)});
$('#wlClose').onclick=()=>$('#v-trade').classList.remove('wl-open');
$('#searchBtn').onclick=openSearch;$('#themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
$('#bellBtn').onclick=()=>{const ex=$('.pop');if(ex){ex.remove();return}App.unread=0;renderBell();const p=document.createElement('div');p.className='pop card';p.innerHTML=`<div class="card-h"><h3>Notifications</h3></div>${App.notes.map(n=>`<div class="n">${esc(n.msg)}<small>${clockStr(n.t)}</small></div>`).join('')||'<div class="empty">You’re all caught up.</div>'}`;document.body.appendChild(p);setTimeout(()=>document.addEventListener('click',function h(ev){if(!p.contains(ev.target)&&!ev.target.closest('#bellBtn')){p.remove();document.removeEventListener('click',h)}}),0)};
document.addEventListener('keydown',e=>{const inField=e.target.matches('input,select,textarea');
  if(e.key==='Escape'){if($('.modal-bg')){closeModal();return}if(chart.pending||chart.tool!=='cursor'){chart.setTool('cursor');return}chart.sel=-1;chart.req();return}
  if(inField||$('.modal-bg'))return;
  if(e.key==='/'||(e.key.toLowerCase()==='k'&&(e.metaKey||e.ctrlKey))){e.preventDefault();openSearch();return}
  if(App.view!=='trade')return;
  if((e.key==='Delete'||e.key==='Backspace')&&chart.delSel()){e.preventDefault();toast('Drawing removed')}
  if(e.key==='+'||e.key==='=')chart.zoom(1.2);if(e.key==='-')chart.zoom(1/1.2);if(e.key==='ArrowLeft')chart.pan(-5);if(e.key==='ArrowRight')chart.pan(5);
  if(e.altKey&&e.key.toLowerCase()==='t')chart.setTool('trend');if(e.altKey&&e.key.toLowerCase()==='h')chart.setTool('hline')});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==App.view&&VIEWS.some(v=>v[0]===h))go(h)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readTheme();chart.req()});

/* ======================= Boot ======================= */
(function boot(){let th='dark';try{th=localStorage.getItem('mer-theme')||th}catch(e){}document.documentElement.dataset.theme=th;readTheme();
  $('#logoI').innerHTML=I('trendup',16,2.4);$('#searchI').innerHTML=I('search',15);$('#themeBtn').innerHTML=I(th==='dark'?'sun':'moon');renderBell();renderNav();
  chart=new Chart($('#chart'),{onTool:()=>renderTools(),onLegend:(uid,a)=>{const i=chart.ind.findIndex(x=>x.uid===uid);if(i<0)return;
      if(a==='hide'){chart.ind[i].hidden=!chart.ind[i].hidden;chart.lgDirty=true;chart.req()}else if(a==='rm'){const n=DEFS[chart.ind[i].key].name;chart.ind.splice(i,1);chart.indChanged();renderToolbar();toast(n+' removed')}else indSettings(uid)},
    onLineDrag:ln=>{ln.label=ln.label.replace(/^(TP|SL) .*/,(m,k)=>k+' '+chart.fmt(ln.price))},
    onLineDrop:ln=>{if(ln.kind==='preview'){calcTicket();return}const s=App.sym;toast(`${ln.kind==='order'?'Order':ln.kind==='alert'?'Alert':ln.kind==='tp'?'Take profit':'Stop loss'} moved to ${fmtP(ln.price,s.dp)}`,'ok');renderBottom();setChartLines()}});
  $('#zoom').innerHTML=`<button class="ibtn" aria-label="Zoom out" data-z="out">${I('zout',16)}</button><button class="ibtn" aria-label="Reset view" data-z="reset">${I('reset',16)}</button><button class="ibtn" aria-label="Zoom in" data-z="in">${I('zin',16)}</button>`;
  $('#zoom').addEventListener('click',e=>{const z=e.target.closest('[data-z]')?.dataset.z;if(z==='in')chart.zoom(1.25);if(z==='out')chart.zoom(0.8);if(z==='reset'){chart.resetView();chart.req()}});
  [['vol'],['sma',{len:20}],['sma',{len:50}],['rsi'],['macd']].forEach(([k,p])=>addInd(k,p,true));
  loadChart(false);renderSymbar();renderToolbar();renderTools();renderWatchlist();renderBottom();renderTicket();buildBook();
  const h=location.hash.slice(1);go(VIEWS.some(v=>v[0]===h)?h:'trade');
  setInterval(tick,1000)})();
</script>
</body>
</html>
