/* ---- client-side overlays for strategies that used to be status-only ---- */
function haBars(d){const o=[];let po=null,pc=null;for(const b of d){const c=(b.o+b.h+b.l+b.c)/4,op=po==null?(b.o+b.c)/2:(po+pc)/2;o.push({o:op,c,h:Math.max(b.h,op,c),l:Math.min(b.l,op,c),t:b.t});po=op;pc=c}return o}
const fillN=(n,v)=>{const a=NA(n);if(v!=null&&isFinite(v))a.fill(v);return a};
function srvLevels(key){const sym=App.sym.s,k=key+'|'+sym,R=ST.res[k];
  if(!R){ST.res[k]={pending:1};runStrat(key,sym,true).then(()=>{if(chart&&App.sym.s===sym){chart.compute();chart.req()}});return null}
  return R.pending||R.err?null:R.levels||null}
const STRAT_SPECIAL={
  'heikin-ashi-channel':{lines:[['upper','HA upper'],['lower','HA lower'],['basis','HA basis']],
    calc:(d)=>{const c=haBars(d).map(b=>b.c),n=c.length,u=NA(n),l=NA(n),b=NA(n);for(let i=19;i<n;i++){let s=0;for(let j=i-19;j<=i;j++)s+=c[j];const m=s/20;let v=0;for(let j=i-19;j<=i;j++)v+=(c[j]-m)**2;const sd=Math.sqrt(v/20)*2;b[i]=m;u[i]=m+sd;l[i]=m-sd}return{upper:u,lower:l,basis:b}}},
  'ha-dancing-trend':{lines:[['emaFast','EMA 9'],['emaSlow','EMA 21'],['upper','Channel upper'],['lower','Channel lower'],['basis','Basis']],
    calc:(d)=>{const ha=haBars(d),c=ha.map(b=>b.c),n=c.length,bs=ema(c,20),at=rma(trA(ha),14);return{emaFast:ema(c,9),emaSlow:ema(c,21),basis:bs,upper:bs.map((v,i)=>isFinite(v)&&isFinite(at[i])?v+1.5*at[i]:NaN),lower:bs.map((v,i)=>isFinite(v)&&isFinite(at[i])?v-1.5*at[i]:NaN)}}},
  'quantum-matrix':{lines:[['ema8','EMA 8'],['ema13','EMA 13'],['ema21','EMA 21'],['ema34','EMA 34'],['support','Support'],['resistance','Resistance']],
    calc:(d)=>{const c=C(d),n=d.length,L=srvLevels('quantum-matrix');return{ema8:ema(c,8),ema13:ema(c,13),ema21:ema(c,21),ema34:ema(c,34),support:fillN(n,L&&L.support),resistance:fillN(n,L&&L.resistance)}}},
  'orb-15m':{lines:[['orbHigh','ORB high'],['orbLow','ORB low'],['t1l','Long T1'],['t2l','Long T2'],['t1s','Short T1'],['t2s','Short T2']],
    calc:(d,p,x)=>{const n=d.length,L=srvLevels('orb-15m'),o={};['orbHigh','orbLow','t1l','t2l','t1s','t2s'].forEach(k=>o[k]=NA(n));if(!L||x.tf>=86400)return o;
      for(let i=0;i<n;i++)if(istDay(d[i].t)===L.date)['orbHigh','orbLow','t1l','t2l','t1s','t2s'].forEach(k=>o[k][i]=L[k]);return o}},
  'vwap-rsi':{lines:[['vwap','VWAP'],['upper','Upper band'],['lower','Lower band']],
    calc:(d,p,x)=>{const n=d.length,vw=NA(n);if(x.tf>=86400||n<25)return{vwap:vw,upper:NA(n),lower:NA(n)};let pv=0,vv=0,day=null;
      for(let i=0;i<n;i++){const dd=istDay(d[i].t);if(dd!==day){day=dd;pv=0;vv=0}const tp=(d[i].h+d[i].l+d[i].c)/3,w=d[i].v||1;pv+=tp*w;vv+=w;vw[i]=pv/vv}
      const df=d.map((b,i)=>b.c-vw[i]),mean=sma(df,20),sd=stdev(df,20,mean);return{vwap:vw,upper:vw.map((v,i)=>isFinite(sd[i])?v+1.5*sd[i]:NaN),lower:vw.map((v,i)=>isFinite(sd[i])?v-1.5*sd[i]:NaN)}}}
};
function registerStratDefs(list){list.forEach(m=>{const sp=STRAT_SPECIAL[m.key];if(sp){m.chart=true;m.lines=sp.lines.map(([k,l])=>({k,label:l}))}});
  registerStratBase(list);
  for(const m of list){const sp=STRAT_SPECIAL[m.key];if(!sp)continue;
    const lines=sp.lines.map(([k],i)=>({k,c:STPAL[i%STPAL.length]}));
    DEFS['S:'+m.key]={name:m.name,short:m.name.split(' ').slice(0,2).join(' '),cat:'Rajan',pane:'main',params:[],lines,calc:sp.calc,desc:m.desc,
      read:'Calculated on the chart you are viewing, so it follows the selected timeframe.'}}}

/* ---- estimated Indian trading charges (shown as estimates) ---- */
function calcCharges(kind,side,value){const buy=side==='buy',sell=!buy;
  const brk=value>0?(kind==='option'?20:Math.min(20,value*0.0003)):0,stt=sell?value*(kind==='option'?0.001:0.00025):0,txn=value*(kind==='option'?0.00035:0.0000297),sebi=value*0.000001,stamp=buy?value*0.00003:0,gst=(brk+txn+sebi)*0.18;
  const r=x=>+x.toFixed(2),total=r(brk+stt+txn+sebi+stamp+gst);return{brk:r(brk),stt:r(stt),txn:r(txn),sebi:r(sebi),stamp:r(stamp),gst:r(gst),total}}
function planSnap(){try{const p=tradePlan(chart.data,App.sym,App.tf,false);return p?{sig:p.sig,entry:p.px,sl:p.sl,t1:p.t1,t2:p.t2,tf:p.tf,bias:p.rd.bias}:null}catch(e){return null}}

  if(pre.q!==0&&Math.sign(pre.q)!==sg){closeQty=Math.min(Math.abs(pre.q),o.qty);realized=(price-pre.avg)*closeQty*Math.sign(pre.q)}
  const kind=kindOf(s),value=o.qty*price,ch=calcCharges(kind,o.side,value);App.cash-=ch.total;
  const p=posOf(o.sym),meta=(App.meta[o.sym]&&App.meta[o.sym].ikey)?App.meta[o.sym]:null,now=Date.now();
  App.trades.push({id:o.id||++OID,t:now,day:istDay(now),sym:o.sym,name:s.n||o.sym,kind,und:meta?meta.und:o.sym,side:o.side,qty:o.qty,price,value:+value.toFixed(2),charges:ch.total,chg:ch,otype:o.type||'market',
    src:o.src||(o.type&&o.type!=='market'?o.type:'manual'),closeQty,realized:+realized.toFixed(2),net:+(realized-ch.total).toFixed(2),posAfter:p?p.q:0,avgBefore:pre.avg,note:'',tag:'',risk:(()=>{const r=p||pre;return{sl:r.sl||null,tp:r.tp||null,tsl:r.tsl||null}})(),plan:o.plan||(o.sym===App.sym.s&&App.view==='trade'&&o.side==='buy'?planSnap():null),meta});
  saveTrades();if(App.view==='journal')renderJournal()}

function optOrder(side){if(!netGuard())return;const o=OPT.osym;if(!o||!OPT.sel)return;const lots=Math.max(1,parseInt($('#opLots').value)||1),lot=o.lot||1;let qty=lots*lot;

function riskTds(sym,risk,editable){const p=editable?posOf(sym):null,e=esc(sym);
  if(p){return`<td class="num"><input class="inp jr-px" inputmode="decimal" data-jsl="${e}" value="${p.sl||''}" placeholder="—" aria-label="Stop-loss for ${e}"></td><td class="num"><input class="inp jr-px" inputmode="decimal" data-jtp="${e}" value="${p.tp||''}" placeholder="—" aria-label="Target for ${e}"></td><td class="num"><div class="jr-tsl"><input class="inp jr-px" inputmode="decimal" data-jtsl="${e}" value="${p.tsl?p.tsl.v:''}" placeholder="—" aria-label="Trailing stop for ${e}"><select class="inp jr-u" data-jtslu="${e}" aria-label="Trailing stop unit"><option value="pct" ${!p.tsl||p.tsl.u!=='abs'?'selected':''}>%</option><option value="abs" ${p.tsl&&p.tsl.u==='abs'?'selected':''}>₹</option></select></div></td>`}
  return`<td class="num down">${risk&&risk.sl?fmtP(risk.sl):'—'}</td><td class="num up">${risk&&risk.tp?fmtP(risk.tp):'—'}</td><td class="num down">${risk&&risk.tsl?(risk.tsl.u==='abs'?'₹'+fmtP(risk.tsl.v):risk.tsl.v+'%'):'—'}</td>`}
function buildTrips(){const st={},trips=[];
  for(const x of App.trades.slice().sort((a,b)=>a.t-b.t)){const sg=x.side==='buy'?1:-1;let s=st[x.sym];
    if(!s){s=st[x.sym]={q:0,trip:null}}
    const startTrip=()=>({sym:x.sym,name:x.name,kind:x.kind,dir:sg>0?'Long':'Short',open:x.t,close:null,qtyIn:0,costIn:0,qtyOut:0,valOut:0,gross:0,charges:0,fills:[],plan:x.plan,risk:x.risk,und:x.und});
    if(s.q===0)s.trip=startTrip();const T=s.trip;T.fills.push(x.id);T.charges+=x.charges;T.gross+=x.realized;
    const same=Math.sign(s.q)===sg||s.q===0;
    if(same){T.qtyIn+=x.qty;T.costIn+=x.qty*x.price}else{const cq=x.closeQty;T.qtyOut+=cq;T.valOut+=cq*x.price}
    s.q=+(s.q+sg*x.qty).toFixed(8);
    if(Math.abs(s.q)<1e-9){T.close=x.t;T.net=+(T.gross-T.charges).toFixed(2);trips.push(T);s.trip=null;s.q=0}
    else if(!same&&Math.sign(s.q)===sg){T.close=x.t;T.net=+(T.gross-T.charges).toFixed(2);trips.push(T);const rem=Math.abs(s.q);s.trip={sym:x.sym,name:x.name,kind:x.kind,dir:sg>0?'Long':'Short',open:x.t,close:null,qtyIn:rem,costIn:rem*x.price,qtyOut:0,valOut:0,gross:0,charges:0,fills:[],plan:x.plan,risk:x.risk,und:x.und}}}
  const open=Object.values(st).filter(s=>s.trip&&Math.abs(s.q)>1e-9).map(s=>s.trip);
  return{closed:trips,open}}
function jStats(trips,fills){const w=trips.filter(t=>t.net>0),l=trips.filter(t=>t.net<=0),sum=a=>a.reduce((x,t)=>x+t.net,0),gw=sum(w),gl=Math.abs(sum(l));

            :(ok?`${und} strategies lean bearish (${be} vs ${bu}) — supports buying this PE`:`${und} strategies lean bearish (${be} vs ${bu}) — this CE goes against them; a PE fits better`);

function trig(s,pv){
  if(MKT.err||MKT.stale)return;
  for(const a of App.alerts){if(!a.on||a.status!=='Active'||a.sym!==s.s)continue;const c=s.last/s.prev-1;
    if((a.cond==='above'&&pv<a.v&&s.last>=a.v)||(a.cond==='below'&&pv>a.v&&s.last<=a.v)||(a.cond==='up'&&c*100>=a.v)||(a.cond==='down'&&c*100<=-a.v)){a.status='Triggered';{const px=fmtP(s.last,s.dp),link={sym:s.s},key='alert|'+a.id+'|'+Date.now();
      if(a.cond==='above')RN.emit('N-09',{sym:s.s,level:fmtP(a.v,s.dp),price:px},{key,link});
      else if(a.cond==='below')RN.emit('N-10',{sym:s.s,level:fmtP(a.v,s.dp),price:px},{key,link});
      else RN.emit('N-11',{sym:s.s,dir:a.cond==='up'?'up':'down',pct:Math.abs(c*100).toFixed(1),price:px},{key,link})}renderBottom();setChartLines();if(App.view==='alerts')renderAlerts()}}
  for(const o of App.orders.slice()){if(o.sym!==s.s||o.status!=='Open')continue;const L=o.side==='buy';
    if(o.type==='limit'?(L?s.last<=o.price:s.last>=o.price):(L?s.last>=o.price:s.last<=o.price)){fill(o,o.type==='limit'?o.price:s.last);renderBottom();setChartLines();if(s===App.sym)renderSymbar()}}
  const p=posOf(s.s);if(p){const L=p.q>0;
    if(p.tsl){const better=L?(!(p.peak>0)||s.last>p.peak):(!(p.peak>0)||s.last<p.peak);   /* trailing stop follows the best price and never moves back */
      if(better){p.peak=s.last;const d=p.tsl.u==='abs'?p.tsl.v:s.last*p.tsl.v/100,st=+(L?s.last-d:s.last+d).toFixed(s.dp||2);

    if(p.tp&&(L?s.last>=p.tp:s.last<=p.tp)){closePos(s.s,'TP')}else if(p.sl&&(L?s.last<=p.sl:s.last>=p.sl)){closePos(s.s,p.tsl?'TSL':'SL')}}}

/* A range button used to only rescale the candles already loaded (e.g. 28 days of 1m), so anything past the
   default window never appeared. Now it widens the request and, when the timeframe is too fine for the range,
   steps up to one that can show it (1m/5m/15m -> 1H -> 4H -> 1D). */
function rangeTo(days){
  const want=days==null?1830:days,ladder=TFS.filter(x=>!x.custom).sort((a,b)=>a.sec-b.sec),bpd=x=>x.sec>=86400?86400/x.sec:22500/x.sec;
  let tf=App.tf,sw=false;
  while(tf.sec<86400&&want*bpd(tf)>4500){const nx=ladder.find(x=>x.sec>tf.sec);if(!nx)break;tf=nx;sw=true}
  if(days==null&&tf.sec<86400){tf=ladder.find(x=>x.k==='1D')||tf;sw=true}
  if(sw){App.tf=tf;saveTfLast();toast('Showing '+tfLabel(tf.k)+' bars so the '+(days==null?'full history':days+'-day range')+' loads','info')}
  App.span=days==null?null:want;
  const k=App.sym.s+'|'+App.tf.k,c=CACHE[k],need=Date.now()-want*864e5;
  const covers=c&&c.length&&c[0].t<=need+7*864e5,tried=c&&c._span>=want;
  const refetch=!App.sym.ikey&&!App.sym.tv&&!covers&&!tried;
  if(refetch)delete CACHE[k];
  if(sw||refetch){App.pendingRange=days;if(sw)renderToolbar();loadChart(false)}else chart.showRange(days)}
