<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<script>/* open the app with ?reset=1 to wipe this device's paper account + journal (positions, trades, orders, journal entries) before anything loads */try{if(/[?&]reset=1(&|$)/.test(location.search)){['rs-paper-v1','rs-trades-v1','rj-journal-v1','rj-journal-settings-v1','mer-trades','mer-paper'].forEach(function(k){localStorage.removeItem(k)});history.replaceState(null,'',location.pathname+location.hash)}}catch(e){}</script>
<link rel="manifest" href="/manifest.webmanifest?v=2e956231">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=ca46e1fe">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=d17945e3">
<link rel="apple-touch-icon" href="/icon-192.png?v=a4a70263">
<meta name="theme-color" content="#4f46e5">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<title>Rajan Algo · NSE Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --panel:#FFFFFF; --panel-2:#F6F7FA; --line:#E2E6EC; --grid:#EEF1F5;
  --text:#0E1726; --text-2:#4A5568; --text-3:#8592A6; --water:rgba(14,23,38,.05); --pill:#0E1726;
  --brand:#2a78d6; --brand-2:#E7F0FC; --up:#0A8F6C; --down:#D93240; --up-bg:#E6F5F0; --down-bg:#FCEBEC;
  --warn:#B7791F; --warn-bg:#FFF6E5;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --shadow:0 10px 30px rgba(16,24,40,.12); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0E14; --panel:#11151D; --panel-2:#171C26; --line:#232A37; --grid:#181E29;
  --text:#E6EAF2; --text-2:#A3ADBF; --text-3:#8E99AD; --water:rgba(230,234,242,.04); --pill:#2A3242;
  --brand:#3987e5; --brand-2:#14233B; --up:#22AB94; --down:#F7525F; --up-bg:#0F2A26; --down-bg:#2D1418;
  --warn:#E3A846; --warn-bg:#2B2210;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2f9a2f; --s7:#9085e9; --s8:#e66767;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B0E14; --panel:#11151D; --panel-2:#171C26; --line:#232A37; --grid:#181E29;
  --text:#E6EAF2; --text-2:#A3ADBF; --text-3:#8E99AD; --water:rgba(230,234,242,.04); --pill:#2A3242;
  --brand:#3987e5; --brand-2:#14233B; --up:#22AB94; --down:#F7525F; --up-bg:#0F2A26; --down-bg:#2D1418;
  --warn:#E3A846; --warn-bg:#2B2210;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2f9a2f; --s7:#9085e9; --s8:#e66767;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.num,td.num,.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px;border-radius:6px}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--text-3)} .m2{color:var(--text-2)}
svg.i{display:block;flex-shrink:0}

/* Header */
.hdr{position:sticky;top:var(--nb,0px);z-index:30;height:52px;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;white-space:nowrap;cursor:pointer;user-select:none}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--brand),#7aa8ff);display:grid;place-items:center;color:#fff}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 0}
.nav button{height:32px;padding:0 11px;border-radius:8px;color:var(--text-2);font-weight:500;white-space:nowrap}
.nav button:hover{background:var(--panel-2);color:var(--text)}
.nav button.on{background:var(--brand);color:#fff;font-weight:650;box-shadow:0 2px 10px color-mix(in srgb,var(--brand) 35%,transparent)}
.nav button.on:hover{background:var(--brand);color:#fff}
.here{display:none}
.nav .nav-sub{font-weight:500;opacity:.85;margin-left:4px}
.pick-row.on{background:var(--brand-2)}.pick-row.on b{color:var(--brand)}
@media (min-width:961px) and (max-width:1440px){.hdr .search-btn{width:34px;min-width:0;padding:0;justify-content:center;flex:none}.hdr .search-btn span:not(#searchI),.hdr .search-btn kbd{display:none}}
.search-btn{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;color:var(--text-3);min-width:150px}
.hx{display:flex;align-items:center;gap:2px;margin-left:auto;flex:none}
.hx-i{display:flex;align-items:center;gap:6px;height:32px;padding:0 9px;border-radius:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hx-i:hover{background:var(--panel-2)}.hx-i small{font-size:11px;color:var(--text-3);font-weight:600}.hx-i b{font-size:13px;font-weight:600;color:var(--text)}.hx-i span{font-size:11.5px;font-weight:600;color:var(--text-3)}
.hx-i span.up{color:var(--up)}.hx-i span.down{color:var(--down)}
@media (max-width:1820px){.hx-i[data-hx=INDIAVIX]{display:none}}@media (max-width:1700px){.hx-i[data-hx=BANKNIFTY]{display:none}}@media (max-width:1480px){.hx-i[data-hx=SENSEX]{display:none}}@media (max-width:1240px){.hx{display:none}.search-btn{margin-left:auto}}
@media (min-width:961px) and (max-width:1800px){.hdr .search-btn{width:34px;min-width:0;padding:0;justify-content:center;flex:none}.hdr .search-btn span:not(#searchI),.hdr .search-btn kbd{display:none}}
.search-btn kbd{margin-left:auto;font:11px Inter;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.hdr-r{display:flex;align-items:center;gap:10px}
.live{display:flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:13px;background:var(--panel-2);font-size:11.5px;font-weight:600;color:var(--text-2);white-space:nowrap;cursor:help}
.live i{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 3px var(--up-bg)}
.pf-chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--line);background:var(--panel-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.pf-chip small{font-size:11px;color:var(--text-3)}.pf-chip b{font-size:13px;color:var(--text)}.pf-d{font-size:11.5px;font-weight:600;color:var(--text-3)}
.pf-chip.up .pf-d{color:var(--up)}.pf-chip.down .pf-d{color:var(--down)}.pf-chip:hover{border-color:var(--brand)}.pf-chip.last{border-style:dashed;opacity:.8}
.ibtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--text-2);position:relative;flex-shrink:0}
.ibtn:hover{background:var(--panel-2);color:var(--text)}
.ibtn.on{background:var(--brand-2);color:var(--brand)}
/* Install-app button: gradient pill with a soft pulse so users notice it can install the app */
#pwaBtn{width:auto;min-width:32px;height:32px;padding:0 10px 0 8px;border-radius:16px;grid-auto-flow:column;align-items:center;gap:5px;
  background:linear-gradient(135deg,#2a78d6,#5b9cf0);color:#fff;border:none;
  box-shadow:0 2px 8px rgba(42,120,214,.35);animation:pwaPulse 2.8s ease-out infinite}
#pwaBtn::after{content:'App';font-size:11.5px;font-weight:700;letter-spacing:.3px}
#pwaBtn svg{width:15px;height:15px}
#pwaBtn:active{transform:scale(.94)}
@keyframes pwaPulse{0%{box-shadow:0 2px 8px rgba(42,120,214,.35),0 0 0 0 rgba(42,120,214,.45)}70%{box-shadow:0 2px 8px rgba(42,120,214,.35),0 0 0 8px rgba(42,120,214,0)}100%{box-shadow:0 2px 8px rgba(42,120,214,.35),0 0 0 0 rgba(42,120,214,0)}}
@media (prefers-reduced-motion: reduce){#pwaBtn{animation:none}}
@media all and (display-mode: standalone), all and (display-mode: fullscreen), all and (display-mode: minimal-ui) { #pwaBtn { display: none !important; } }
#pwaBtn[hidden] { display: none !important; }
.cnt{position:absolute;top:2px;right:2px;min-width:15px;height:15px;border-radius:8px;background:var(--down);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 3px}

/* Generic */
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--text-2);white-space:nowrap}
.btn:hover{color:var(--text);border-color:var(--text-3)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-xs{height:24px;padding:0 8px;border-radius:6px;border:1px solid var(--line);font-size:12px;color:var(--text-2)}
.btn-xs:hover{color:var(--text);border-color:var(--text-3)}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{height:26px;padding:0 9px;border-radius:6px;color:var(--text-2);font-weight:500;font-size:12px;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sel{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 8px;color:var(--text)}
.inp{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 10px;width:100%;outline:none}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-2)}
.inp:disabled{color:var(--text-3);background:var(--panel-2)}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:10px;font-size:11px;font-weight:600}
.b-up{background:var(--up-bg);color:var(--up)} .b-down{background:var(--down-bg);color:var(--down)} .b-info{background:var(--brand-2);color:var(--brand)} .b-mute{background:var(--panel-2);color:var(--text-2)} .b-warn{background:var(--warn-bg);color:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h{flex-wrap:wrap}
.card-h h3{font-size:14px;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:28px;padding:0 11px;border-radius:14px;border:1px solid var(--line);color:var(--text-2);font-size:12px;font-weight:500}
.chip.on{border-color:var(--brand);background:var(--brand-2);color:var(--brand)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--text-3);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel)}
th.num,td.num{text-align:right}
td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:hover td{background:var(--panel-2)}
th[data-sort]{cursor:pointer} th[data-sort]:hover{color:var(--text)}
.empty{padding:28px;text-align:center;color:var(--text-3)}
.side-tag{font-weight:600;font-size:12px}

/* ===== Trade layout ===== */
.view{display:none}.view.on{display:block}
#v-trade.on{display:grid}
#v-trade{grid-template-columns:236px minmax(0,1fr) 304px;height:calc(100vh - 52px - var(--nb,0px))}
.wl{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.wl-h{padding:10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.wl-h b{font-size:13px}
.wl-list{overflow:auto;flex:1}
.wl-g{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:10px 12px 4px}
.wl-row{display:grid;grid-template-columns:minmax(0,1fr) 54px auto;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 12px;border-left:2px solid transparent}
.wl-row:hover{background:var(--panel-2)}
.wl-row.on{background:var(--brand-2);border-left-color:var(--brand)}
.wl-row b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wl-row small{display:block;color:var(--text-3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px}
.wl-row .r{text-align:right;font-size:12px;line-height:1.3;white-space:nowrap}
.center{display:flex;flex-direction:column;min-width:0;min-height:0}
.symbar{display:flex;align-items:center;gap:18px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);min-height:54px;overflow-x:auto;scrollbar-width:none}
.symbtn{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:700;padding:4px 6px;border-radius:6px}
.symbtn:hover{background:var(--panel-2)}
.sb-px{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.sb-px b{font-size:20px;font-weight:700}
.sb-stat{display:flex;flex-direction:column;font-size:11px;color:var(--text-3);white-space:nowrap}
.sb-stat span{color:var(--text);font-size:12.5px}
.rangebar{position:relative;width:90px;height:4px;border-radius:2px;background:var(--line);margin-top:6px}
.rangebar i{position:absolute;top:-3px;width:2px;height:10px;background:var(--text);border-radius:1px}
.toolbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px;flex-shrink:0}
.tb-btn{height:30px;padding:0 9px;border-radius:7px;display:inline-flex;align-items:center;gap:6px;color:var(--text-2);font-weight:500;white-space:nowrap;flex-shrink:0}
.tb-btn:hover{background:var(--panel-2);color:var(--text)}
.tb-btn.on{color:var(--brand);background:var(--brand-2)}
.tb-btn .ct{font-size:11px;background:var(--panel-2);border-radius:8px;padding:0 6px;color:var(--text-2)}
.chart-wrap{flex:1;display:flex;min-height:0;background:var(--panel)}
.tools{width:44px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;flex-shrink:0;overflow-y:auto;scrollbar-width:none}
.tools .sep{width:22px;height:1px;background:var(--line);margin:4px 0}
.tools .ibtn{width:34px;height:34px}
.chart{flex:1;position:relative;min-width:0;min-height:0;overflow:hidden}
.chart canvas{position:absolute;inset:0;touch-action:none;cursor:crosshair}
.legend{position:absolute;inset:0;pointer-events:none;font-size:12px}
.lg-g{position:absolute;left:8px;display:grid;gap:1px;justify-items:start}
.lg-hdr{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:2px 4px;font-variant-numeric:tabular-nums}
.lg-hdr b{font-size:12.5px}
.lg-hdr .k{color:var(--text-3);margin-right:3px}
.lg-row{pointer-events:auto;display:flex;align-items:center;gap:7px;padding:1px 4px;border-radius:5px;font-variant-numeric:tabular-nums;border:1px solid transparent}
.lg-row:hover{background:var(--panel);border-color:var(--line)}
.lg-row.off{opacity:.45}
.lg-name{color:var(--text-2)}
.lg-val{display:flex;gap:8px}
.lg-val span{display:inline-flex;align-items:center;gap:4px}
.sw{display:inline-block;width:10px;height:2px;border-radius:1px}
.lg-act{display:none;gap:1px}
.lg-row:hover .lg-act,.lg-row:focus-within .lg-act{display:flex}
.lg-act button{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;color:var(--text-2)}
.lg-act button:hover{background:var(--panel-2);color:var(--text)}
.chart-hint{position:absolute;right:80px;bottom:30px;font-size:11.5px;color:var(--text-3);pointer-events:none;background:var(--panel);padding:3px 8px;border-radius:6px;border:1px solid var(--line);opacity:0;transition:opacity .2s}
.chart-hint.show{opacity:1}
.zoom{position:absolute;left:50%;transform:translateX(-50%);bottom:30px;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px;opacity:0;transition:opacity .2s}
.chart:hover .zoom{opacity:1}
.zoom .ibtn{width:28px;height:28px}
.view#v-trade .bottom{display:none}
.bottom{height:214px;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;flex-shrink:0}
.bottom.collapsed{height:40px}
.btabs{display:flex;align-items:center;gap:2px;padding:4px 8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.btabs>*{flex-shrink:0}
.btabs button.t{height:30px;padding:0 11px;border-radius:7px;color:var(--text-2);font-weight:500}
.btabs button.t.on{color:var(--text);background:var(--panel-2)}
.btabs .ct{font-size:11px;color:var(--text-3);margin-left:3px}
.bbody{overflow:auto;flex:1}
.right{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;min-height:0}
.sym-link{font-weight:600}.sym-link:hover{color:var(--brand)}

/* Ticket */
.ticket{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.tk-h{display:flex;align-items:center;justify-content:space-between}
.tk-h b{font-size:14px}
.side-seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.side-seg button{height:36px;border-radius:8px;font-weight:600;border:1px solid var(--line);color:var(--text-2)}
.side-seg button.buy.on{background:var(--up);border-color:var(--up);color:#fff}
.side-seg button.sell.on{background:var(--down);border-color:var(--down);color:#fff}
.type-seg{display:flex}.type-seg button{flex:1}
.fld label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-2);margin-bottom:4px;font-weight:500}
.inp-w{position:relative}.inp-w .suf{position:absolute;right:10px;top:9px;font-size:11.5px;color:var(--text-3);pointer-events:none}
.inp-w .inp{padding-right:52px;font-variant-numeric:tabular-nums}
.pcts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pcts button{height:24px;border-radius:6px;border:1px solid var(--line);font-size:11.5px;color:var(--text-2)}
.pcts button:hover{border-color:var(--brand);color:var(--brand)}
.bracket{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;font-size:12px}
.bracket input[type=checkbox]{accent-color:var(--brand);width:15px;height:15px}
.bracket .inp{height:30px}
.sum{display:grid;gap:4px;font-size:12px;padding:8px 10px;background:var(--panel-2);border-radius:8px}
.sum div{display:flex;justify-content:space-between}
.sum b{font-variant-numeric:tabular-nums}
.tk-msg{font-size:12px;border-radius:7px;padding:6px 9px;display:none}
.tk-msg.err{display:block;background:var(--down-bg);color:var(--down)}
.tk-msg.warn{display:block;background:var(--warn-bg);color:var(--warn)}
.go{height:42px;border-radius:9px;font-weight:600;font-size:14px;color:#fff}
.go.buy{background:var(--up)}.go.sell{background:var(--down)}
.go:disabled{opacity:.45;cursor:not-allowed}

/* Book */
.book{padding:10px 0}
.book-h{display:flex;align-items:center;justify-content:space-between;padding:0 14px 8px}
.ob-cols,.ob-row{display:grid;grid-template-columns:1fr 1fr 1fr;padding:0 14px;font-size:12px;font-variant-numeric:tabular-nums}
.ob-cols{color:var(--text-3);font-size:11px;padding-bottom:4px}
.ob-cols span:not(:first-child),.ob-row span:not(:first-child){text-align:right}
.ob-row{position:relative;height:20px;align-items:center;width:100%;text-align:left}
.ob-row:hover{background:var(--panel-2)}
.ob-row i{position:absolute;right:0;top:1px;bottom:1px;opacity:.16;pointer-events:none}
.ob-mid{display:flex;align-items:baseline;gap:8px;padding:6px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:3px 0}
.ob-mid b{font-size:16px}
.tape-row{display:grid;grid-template-columns:1fr 1fr 1fr;padding:0 14px;height:20px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums}

.grid{display:grid;gap:14px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{padding:14px 16px}

.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.tbl-wrap{overflow-x:auto}
.two{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px}

.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:12px;display:none;min-width:150px;z-index:2}

.tip .r{display:flex;align-items:center;gap:6px;justify-content:space-between}

.legend-row{display:flex;gap:14px;font-size:12px;color:var(--text-2)}

.toggle{width:36px;height:20px;border-radius:12px;background:var(--line);position:relative;flex-shrink:0;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}

      </div>

<script>
/* ===================== All NSE stocks browser (SB) =====================
   Search and trade every listed NSE stock: full list, index constituents (Nifty 50 … Microcap 250, Infra, sectors)
   and a multibagger screen. The host app supplies get(), trade(), chart() and alert(). */
(function(global){
'use strict';
const CHIPS=[['IDX','All Nifty indices'],['ALL','All NSE stocks'],['multi','Multibaggers (≥2× 52W low)'],['nifty50','Nifty 50'],['sensex','BSE Sensex 30'],['niftynext50','Next 50'],['midcap150','Midcap 150'],['smallcap250','Smallcap 250'],['microcap250','Microcap 250'],['infra','Nifty Infra']];
const GROUPS=['ALL','Main','Broad market','Midcap','Smallcap and microcap','Sectoral','Thematic','Strategy','BSE'];
const SIZES=[10,15,30,100,500,1000];
const savedSize=(()=>{try{const v=+localStorage.getItem('sbSize');return SIZES.includes(v)?v:15}catch(e){return 15}})();
const S={h:null,all:null,allP:null,idxAll:null,nameKey:{},grp:'ALL',tab:'IDX',q:'',page:0,size:savedSize,f:{mv:'all',pmin:'',pmax:'',near:false},fOpen:false,sort:'sym',asc:true,rows:[],quotes:{},loading:false,err:'',more:[],timer:0,tok:0};
const $=(s,r)=>(r||document).querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fp=(n,d=2)=>isFinite(n)&&n!==null?Number(n).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const get=p=>S.h.get(p);
const panel=()=>S.mode==='page'?S.mountEl:document.getElementById('sbPanel');

function ensureAll(){if(S.all)return Promise.resolve(S.all);
  if(!S.allP)S.allP=get('/api/m/stocks/all').then(r=>{S.all=(r&&r.stocks)||[];return S.all}).catch(e=>{S.allP=null;throw e});
  return S.allP}
function lookup(sym){sym=String(sym||'').trim().toUpperCase();return ensureAll().then(a=>{const r=a.find(x=>x[0]===sym);return r?{s:r[0],n:r[1]}:null}).catch(()=>null)}

async function loadTab(){const tok=++S.tok;S.loading=true;S.err='';S.page=0;S.quotes=S.quotes||{};draw();
  try{
    let rows;
    if(S.tab==='IDX'){const u=await get('/api/m/universe');
      rows=[...(u.indices||[]).map(i=>({s:i.s,n:i.n,industry:'Main',idx:1})),...(u.more||[]).map(i=>({s:i.s,n:i.n,industry:i.g,idx:1}))];S.idxAll=rows}
    else if(S.tab==='ALL'){rows=(await ensureAll()).map(([s,n])=>({s,n}))}
    else if(S.tab==='multi'){const r=await get('/api/m/multibaggers?min_x=2&limit=1000');rows=(r.stocks||[]).map(x=>({s:x.s,n:x.n,industry:x.industry}));(r.stocks||[]).forEach(x=>{S.quotes[x.s]={s:x.s,last:x.last,prev:x.prev,yl:x.yl,yh:x.yh,vol:x.vol}})}
    else{const r=await get('/api/m/index-stocks?index='+encodeURIComponent(S.tab));rows=r.stocks||[]}
    if(tok!==S.tok)return;S.rows=rows;S.loading=false;
    S.sort=S.tab==='multi'?'x':S.tab==='IDX'?'grp':'sym';S.asc=S.tab!=='multi';
    draw();fetchQuotes(true)
  }catch(e){if(tok!==S.tok)return;S.loading=false;S.rows=[];S.err='Could not load this list ('+(e&&e.message||e)+'). Please try again.';draw()}}

function view(noQF){const q=S.q.trim().toLowerCase();
  let l=S.rows.filter(r=>(S.tab!=='IDX'||S.grp==='ALL'||r.industry===S.grp)&&(!q||r.s.toLowerCase().includes(q)||(r.n||'').toLowerCase().includes(q)||(r.industry||'').toLowerCase().includes(q)));
  if(!noQF&&qFilterOn()&&S.tab!=='ALL'){const f=S.f,mn=f.pmin===''?null:+f.pmin,mx=f.pmax===''?null:+f.pmax;
    l=l.filter(r=>{const k=S.quotes[r.s];if(!k||!(k.last>0))return false;const c=k.prev>0?k.last/k.prev-1:0;
      if(f.mv==='up'&&!(c>0))return false;if(f.mv==='down'&&!(c<0))return false;
      if(mn!=null&&k.last<mn)return false;if(mx!=null&&k.last>mx)return false;
      if(f.near&&!(k.yh>0&&k.last>=k.yh*0.97))return false;return true})}
  if(S.sort==='grp'&&!q)return l;
  if(q)l=l.slice().sort((a,b)=>(+b.s.toLowerCase().startsWith(q)-+a.s.toLowerCase().startsWith(q))||a.s.localeCompare(b.s));
  else{const v=r=>{const k=S.quotes[r.s];if(S.sort==='sym')return r.s;if(!k||!(k.last>0))return null;
      return S.sort==='chg'?(k.prev>0?(k.last/k.prev-1):0):S.sort==='x'?(k.yl>0?k.last/k.yl:0):S.sort==='off'?(k.yh>0?k.last/k.yh:0):S.sort==='vol'?(k.vol||0):k.last};
    l=l.slice().sort((a,b)=>{const x=v(a),y=v(b);if(x===y)return 0;if(x==null)return 1;if(y==null)return -1;return(S.asc?1:-1)*(typeof x==='string'?x.localeCompare(y):x-y)})}
  return l}
async function fetchQuotes(all){if(!S.h)return;const lu=view(true),lf=view(),page=S.tab==='ALL'||S.q?lu.slice(S.page*S.size,(S.page+1)*S.size):lu;
  const need=(all?page:lf.slice(S.page*S.size,(S.page+1)*S.size)).map(r=>r.s);
  const isIdx=new Set(S.rows.filter(r=>r.idx).map(r=>r.s)),chunks=[];
  const si=need.filter(x=>isIdx.has(x)),ss=need.filter(x=>!isIdx.has(x));
  for(let i=0;i<si.length;i+=60)chunks.push(['/api/m/quotes?symbols=',si.slice(i,i+60)]);
  for(let i=0;i<ss.length;i+=100)chunks.push(['/api/m/stocks/quotes?symbols=',ss.slice(i,i+100)]);
  for(const [u,c] of chunks){try{const r=await get(u+encodeURIComponent(c.join(',')));(r.quotes||[]).forEach(x=>S.quotes[x.s]=x)}catch(e){}}
  if(panel())drawTable()}

const ICON={
  search:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  filter:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>',
  chart:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16"/><path d="m5 15 4-5 4 3 6-7"/></svg>',
  bell:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
  list:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>',
  x:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>'};
const SORTS=[['grp','Default order','IDX'],['sym','Symbol A–Z',''],['last','Price (LTP)',''],['chg','Day % change',''],['off','% off 52W high','IDX'],['x','× 52W low','NOIDX'],['vol','Volume (shares)','']];
function qFilterOn(){const f=S.f;return f.mv!=='all'||f.pmin!==''||f.pmax!==''||f.near}
function activeCount(){return (S.tab==='IDX'&&S.grp!=='ALL'?1:0)+(S.f.mv!=='all'?1:0)+(S.f.pmin!==''||S.f.pmax!==''?1:0)+(S.f.near?1:0)}
function chipsHtml(){return `<div class="sb-tabs-s" role="tablist">`+CHIPS.map(([k,l])=>`<button class="sb-chip ${S.tab===k?'on':''}" role="tab" aria-selected="${S.tab===k}" data-sb="tab:${k}">${esc(l)}</button>`).join('')+`</div>`+
  `<select class="sb-sel" id="sbMore" aria-label="More lists"><option value="">More lists…</option>${S.more.map(g=>`<optgroup label="${esc(g[0])}">${g[1].map(i=>`<option value="${esc(i.key)}" ${S.tab===i.key?'selected':''}>${esc(i.label)}</option>`).join('')}</optgroup>`).join('')}</select>`}
function seg(name,cur,opts){return `<div class="sb-seg" role="group">${opts.map(([v,l])=>`<button class="${String(cur)===String(v)?'on':''}" data-sb="${name}:${v}">${l}</button>`).join('')}</div>`}
function fpHtml(){const f=S.f,noQ=S.tab==='ALL';
  const sorts=SORTS.filter(s=>!s[2]||(s[2]==='IDX'?S.tab==='IDX':S.tab!=='IDX'));
  return `<div class="sb-fp-h"><b>Filters & sort</b><button class="sb-ib" data-sb="flt" aria-label="Close filters">${ICON.x}</button></div>
  <div class="sb-fp-b">
    ${S.tab==='IDX'?`<div class="sb-fg"><label>Index group</label><div class="sb-pills">${GROUPS.map(g=>`<button class="sb-chip ${S.grp===g?'on':''}" data-sb="grp:${esc(g)}">${g==='ALL'?'All groups':esc(g)}</button>`).join('')}</div></div>`:''}
    <div class="sb-fg ${noQ?'sb-dis':''}"><label>Today's move</label>${seg('mv',f.mv,[['all','All'],['up','Gainers ▲'],['down','Losers ▼']])}</div>
    <div class="sb-fg ${noQ?'sb-dis':''}"><label>Price (LTP, ₹)</label><div class="sb-rangein"><input id="sbPmin" inputmode="decimal" placeholder="Min" value="${esc(f.pmin)}" ${noQ?'disabled':''}><span>to</span><input id="sbPmax" inputmode="decimal" placeholder="Max" value="${esc(f.pmax)}" ${noQ?'disabled':''}></div></div>
    <div class="sb-fg ${noQ?'sb-dis':''}"><label class="sb-tog"><input type="checkbox" id="sbNear" ${f.near?'checked':''} ${noQ?'disabled':''}><span></span>Near 52-week high (within 3%)</label></div>
    ${noQ?`<p class="sb-note">Move and price filters work on lists. For "All NSE stocks" (2,700+), search by name, or pick a list.</p>`:''}
    <div class="sb-fg"><label>Sort by</label><div class="sb-sortrow"><select id="sbSort" class="sb-in">${sorts.map(([k,l])=>`<option value="${k}" ${S.sort===k?'selected':''}>${l}</option>`).join('')}</select>${seg('ord',S.asc?'asc':'desc',[['asc','↑ Asc'],['desc','↓ Desc']])}</div></div>
  </div>
  <div class="sb-fp-f"><button class="sb-btn" data-sb="reset">Reset all</button><button class="sb-btn pri" data-sb="flt">Show ${view().length.toLocaleString('en-IN')} stocks</button></div>`}
function activeHtml(){const p=[];
  if(S.tab==='IDX'&&S.grp!=='ALL')p.push(['grp',S.grp]);
  if(S.f.mv!=='all')p.push(['mv',S.f.mv==='up'?'Gainers':'Losers']);
  if(S.f.pmin!==''||S.f.pmax!=='')p.push(['price','₹'+(S.f.pmin||'0')+' – '+(S.f.pmax||'∞')]);
  if(S.f.near)p.push(['near','Near 52W high']);
  return p.length?p.map(([k,l])=>`<button class="sb-pill" data-sb="clr:${k}" aria-label="Remove filter ${esc(l)}">${esc(l)}${ICON.x}</button>`).join('')+`<button class="sb-link" data-sb="reset">Clear all</button>`:''}
function syncChrome(){const n=activeCount(),bd=$('#sbBadge');if(bd){bd.textContent=n||'';bd.hidden=!n}
  const a=$('#sbActive');if(a){a.innerHTML=activeHtml();a.hidden=!a.innerHTML}
  const fp=$('#sbFp');if(fp){fp.hidden=!S.fOpen;if(S.fOpen&&!fp.contains(document.activeElement))fp.innerHTML=fpHtml()}
  const sc=$('#sbScrim');if(sc)sc.hidden=!S.fOpen;
  const fb=$('#sbFbtn');if(fb){fb.classList.toggle('on',S.fOpen||n>0);fb.setAttribute('aria-expanded',S.fOpen)}}
function draw(){let p;if(S.mode==='page'){p=S.mountEl;if(!p)return}else{p=$('#sbPanel');if(!p){p=document.createElement('div');p.id='sbPanel';p.className='sb-bg';document.body.appendChild(p)}}
  p.innerHTML=`<div class="sb-box${S.mode==='page'?' sb-page':''}" ${S.mode==='page'?'':'role="dialog" aria-modal="true"'} aria-label="All NSE stocks">
    <div class="sb-top">
      <div class="sb-title"><h2>NSE stocks</h2><span class="sb-cnt" id="sbCnt"></span>${S.mode==='page'?'':`<button class="sb-ib sb-x" data-sb="close" aria-label="Close">${ICON.x}</button>`}</div>
      <div class="sb-tools">
        <label class="sb-search">${ICON.search}<input id="sbQ" type="search" placeholder="Search stock or company — e.g. SEPC, Suzlon" value="${esc(S.q)}" autocomplete="off" aria-label="Search stocks"></label>
        <button class="sb-fbtn" id="sbFbtn" data-sb="flt" aria-haspopup="dialog" aria-expanded="false">${ICON.filter}<span class="sb-fl">Filters</span><span class="sb-badge" id="sbBadge" hidden></span></button>
      </div>
      <div class="sb-tabs" id="sbChips">${chipsHtml()}</div>
      <div class="sb-active" id="sbActive" hidden></div>
    </div>
    <div class="sb-scrim" id="sbScrim" data-sb="flt" hidden></div>
    <div class="sb-fp" id="sbFp" role="dialog" aria-label="Filters" hidden></div>
    <div class="sb-b" id="sbBody"></div>
    <div class="sb-pg" id="sbPg"></div></div>`;
  syncChrome();drawTable()}
function rng(lo,hi,v){if(!(lo>0&&hi>0&&hi>=lo))return '<span class="sb-dim">—</span>';const pos=hi>lo&&v>0?Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100)):50;
  return `<div class="sb-rng" title="Low ${fp(lo)} · High ${fp(hi)}"><div class="sb-rbar"><i style="left:${pos.toFixed(1)}%"></i></div><div class="sb-rlbl"><span>${fp(lo)}</span><span>${fp(hi)}</span></div></div>`}
function drawTable(){const b=$('#sbBody'),pg=$('#sbPg');if(!b)return;
  const idx=S.tab==='IDX';
  if(S.loading){b.innerHTML=`<div class="sb-list">${Array.from({length:Math.min(S.size,8)},()=>'<div class="sb-row sb-skel"><i></i><i></i><i></i><i></i></div>').join('')}</div>`;if(pg)pg.innerHTML='';return}
  if(S.err){b.innerHTML=`<div class="sb-empty">${esc(S.err)}<br><button class="sb-btn pri" data-sb="retry">Try again</button></div>`;if(pg)pg.innerHTML='';return}
  const l=view(),pages=Math.max(1,Math.ceil(l.length/S.size));S.page=Math.min(S.page,pages-1);const part=l.slice(S.page*S.size,(S.page+1)*S.size);
  const c=$('#sbCnt');if(c)c.textContent=l.length.toLocaleString('en-IN')+(idx?' indices':' stocks');
  if(!part.length){b.innerHTML=`<div class="sb-empty">${S.q?'No stock matches “'+esc(S.q)+'”.':activeCount()?'No stocks match these filters.':'No stocks in this list right now.'}${activeCount()?'<br><button class="sb-btn" data-sb="reset">Clear filters</button>':''}</div>`;if(pg)pg.innerHTML='';return}
  const th=(k,label,cls)=>`<div class="sb-th ${cls||''}" role="columnheader"><button class="sb-sort ${S.sort===k?'on':''}" data-sb="sort:${k}">${label}<span>${S.sort===k?(S.asc?'↑':'↓'):''}</span></button></div>`;
  const head=`<div class="sb-row sb-head" role="row">${th('sym',idx?'Index':'Stock','c-stk')}${th('last','LTP','c-ltp r')}${th('chg','Day %','c-chg r')}<div class="sb-th c-rng" role="columnheader">${idx?'Day range':'52W range'}</div>${idx?th('off','52W high','c-yr r'):th('x','× 52W low','c-yr r')}<div class="sb-th c-act" role="columnheader"><span class="sb-vh">Actions</span></div></div>`;
  const rows=part.map(r=>{const k=S.quotes[r.s]||{},ok=k.last>0,chg=ok&&k.prev>0?(k.last/k.prev-1)*100:null,x=ok&&k.yl>0?k.last/k.yl:null,off=ok&&k.yh>0?(k.last/k.yh-1)*100:null;
    const cons=r.idx&&S.nameKey[(r.n||'').toLowerCase()];
    const yr=idx?(off==null?'<span class="sb-dim">—</span>':`<span class="${off>=-3?'up':off<=-20?'down':''}">${off.toFixed(1)}%</span>`):(x?`<span class="${x>=2?'up':''}">${x.toFixed(2)}×</span>`:'<span class="sb-dim">—</span>');
    return `<div class="sb-row" role="row">
      <div class="c-stk" role="cell"><b class="sb-sym">${esc(r.s)}</b><div class="sb-name">${esc(r.n||'')}${r.industry&&r.industry!=='Main'?' · '+esc(r.industry):''}${k.vol!=null?`<span class="sb-vol" style="margin-left:6px;color:var(--text-2);font-weight:600">· Vol ${fmtN(k.vol)}</span>`:''}</div></div>
      <div class="c-ltp r num" role="cell">${ok?fp(k.last):'<span class="sb-dim">—</span>'}</div>
      <div class="c-chg r" role="cell">${chg==null?'<span class="sb-dim">—</span>':`<span class="sb-chg ${chg>=0?'up':'down'}">${chg>=0?'+':'−'}${Math.abs(chg).toFixed(2)}%</span>`}</div>
      <div class="c-rng" role="cell"><span class="sb-mlbl">${idx?'Day range':'52-week range'}</span>${idx?rng(k.low,k.high,k.last):rng(k.yl,k.yh,k.last)}</div>
      <div class="c-yr r num" role="cell"><span class="sb-mlbl">${idx?'Off 52W high':'× 52W low'}</span>${yr}</div>
      <div class="c-act" role="cell">
        <button class="sb-btn buy" data-sb="buy:${esc(r.s)}">Buy</button><button class="sb-btn sell" data-sb="sell:${esc(r.s)}">Sell</button>
        <button class="sb-ib" data-sb="chart:${esc(r.s)}" title="Chart" aria-label="Chart ${esc(r.s)}">${ICON.chart}</button>
        <button class="sb-ib" data-sb="alert:${esc(r.s)}" title="Price alert" aria-label="Alert on ${esc(r.s)}">${ICON.bell}</button>
        ${cons?`<button class="sb-ib" data-sb="cons:${esc(cons)}" title="Stocks in this index" aria-label="Stocks in ${esc(r.n||r.s)}">${ICON.list}</button>`:''}
      </div></div>`}).join('');
  b.innerHTML=`<div class="sb-list${idx?' is-idx':''}" role="table">${head}${rows}</div>`;
  if(!pg)return;
  const nums=[];for(let i=0;i<pages;i++){if(i===0||i===pages-1||Math.abs(i-S.page)<=1)nums.push(i);else if(nums[nums.length-1]!==-1)nums.push(-1)}
  pg.innerHTML=`<div class="sb-ps"><span>Rows</span>${seg('size',S.size,SIZES.map(n=>[n,n]))}</div>
    <span class="sb-range">${(S.page*S.size+1).toLocaleString('en-IN')}–${(S.page*S.size+part.length).toLocaleString('en-IN')} of ${l.length.toLocaleString('en-IN')}</span>
    <nav class="sb-pgb" aria-label="Pages"><button class="sb-pb" data-sb="page:0" ${S.page<=0?'disabled':''} aria-label="First page">«</button><button class="sb-pb" data-sb="page:${S.page-1}" ${S.page<=0?'disabled':''} aria-label="Previous page">‹</button>
      <span class="sb-nums">${nums.map(i=>i<0?'<span class="sb-dots">…</span>':`<button class="sb-pb ${i===S.page?'on':''}" data-sb="page:${i}" ${i===S.page?'aria-current="page"':''}>${i+1}</button>`).join('')}</span>
      <span class="sb-pos">${S.page+1} / ${pages}</span>
      <button class="sb-pb" data-sb="page:${S.page+1}" ${S.page>=pages-1?'disabled':''} aria-label="Next page">›</button><button class="sb-pb" data-sb="page:${pages-1}" ${S.page>=pages-1?'disabled':''} aria-label="Last page">»</button></nav>`}
function open(tab){if(!S.h)return;if(S.h.goTab){S.h.goTab(tab);return}S.mode='overlay';if(tab)S.tab=tab;draw();if(!S.rows.length||tab)loadTab();else fetchQuotes(true);
  if(!S.more.length)get('/api/m/index-stocks/list').then(r=>{const g={};(r.indices||[]).forEach(i=>{(g[i.group]=g[i.group]||[]).push(i)});S.more=Object.entries(g);(r.indices||[]).forEach(i=>{S.nameKey[i.label.toLowerCase()]=i.key});if($('#sbMore'))$('#sbChips').innerHTML=chipsHtml();if($('#sbBody'))drawTable()}).catch(()=>{});
  startTimer();

  return false}

  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  // Android/desktop Chrome only fire beforeinstallprompt while the app is NOT installed, so no event = already installed
  // (or not installable): hide. Only iOS Safari has no event, so it keeps the Add-to-Home-Screen guide button.

    el.className='rn-toast '+(n.cat==='security'||n.evt==='N-08'||n.evt==='N-05'||n.evt==='N-14'?'bad':n.evt==='N-02'||n.evt==='N-07'?'ok':'info');
    el.innerHTML=`<div class="rn-t-b"><b>${esc(n.title)}</b>${n.body?`<span>${esc(n.body)}</span>`:''}</div><button class="rn-t-x" aria-label="Dismiss notification">×</button>`;
    const done=()=>{if(el._d)return;el._d=1;el.remove();S.toasts=S.toasts.filter(x=>x!==el);pumpToasts()};
    el.querySelector('.rn-t-x').onclick=e=>{e.stopPropagation();done()};el.onclick=()=>{open(n);done()};
    $(crit?'#rnLiveA':'#rnLiveP').appendChild(el);S.toasts.push(el);if(!crit)setTimeout(done,6000)}}
let actx=null;function beep(){try{actx=actx||new(global.AudioContext||global.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.05;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.12)}catch(e){}}

  p.innerHTML=`<div class="rn-pop-h"><b>Notifications</b><span class="rn-sp"></span><button data-rn="readall">Mark all read</button><button data-rn="centre:prefs" aria-label="Notification settings" title="Settings">⚙</button><button class="rn-x" data-rn="closepop" aria-label="Close notifications" title="Close">×</button></div>

/* ---------- price alerts ---------- */
const money=v=>{const n=Number(v),d=Math.round(Math.abs(n)*100)%100===0?0:2;return n.toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d})};
const alertText=a=>a.cond==='above'?`Crosses above ${money(a.v)}`:a.cond==='below'?`Crosses below ${money(a.v)}`:a.cond==='up'?`Day change ≥ +${a.v}%`:`Day change ≤ −${a.v}%`;
function price(sym){try{return S.H.price(sym)||null}catch(e){return null}}
function condMet(a,p){return a.cond==='above'?p.last>=a.v:a.cond==='below'?p.last<=a.v:a.cond==='up'?p.chgPct>=a.v:p.chgPct<=-a.v}
function marketOpen(p){if(!p||p.market==='GLOBAL')return true;if(S.H.marketOpen)return S.H.marketOpen(p);const t=IST_MIN();return!(t.d==='Sat'||t.d==='Sun')&&t.m>=9*60&&t.m<=15*60+40}
function evalAlerts(){let ch=false;const now=Date.now();
  for(const a of S.alerts){if(a.status!=='Active')continue;
    if(a.expires&&now>a.expires){a.status='Expired';ch=true;emit('SYS-01',{sym:a.sym},{key:'exp|'+a.id,link:{sym:a.sym}});continue}
    const p=price(a.sym);if(!p||!(p.last>0)||!marketOpen(p))continue;
    const met=condMet(a,p),crossed=!a.inside&&met;   /* fires once per crossing: needs the previous tick on the other side */
    if(crossed){const px=money(p.last);
      emit(a.cond==='above'?'N-09':a.cond==='below'?'N-10':'N-11',a.cond==='up'||a.cond==='down'?{sym:a.sym,dir:a.cond==='up'?'up':'down',pct:Math.abs(p.chgPct).toFixed(1),price:px}:{sym:a.sym,level:money(a.v),price:px},{key:'alert|'+a.id+'|'+now,link:{sym:a.sym}});
      a.last=now;ch=true;if(a.recurring)a.inside=true;else a.status='Triggered'}
    else if(a.inside&&!met){a.inside=false;ch=true}
    if(a.prev!==p.last){a.prev=p.last;ch=true}
  }
  if(ch){saveA();if(S.H.onAlerts)S.H.onAlerts();if($('#rnCentre')&&S.tab==='alerts')drawAlertList()}}
setInterval(()=>{try{evalAlerts()}catch(e){console.error(e)}},1000);
function activeCount(){return S.alerts.filter(a=>a.status==='Active'||a.status==='Paused').length}
function saveAlert(f){const sym=String(f.sym||'').trim().toUpperCase(),v=parseFloat(f.v);
  if(!sym)return{err:'Choose a symbol'};if(!(v>0))return{err:'Enter a value above 0'};
  const p=price(sym);if(!p||!(p.last>0))return{err:'No live price for '+sym+' yet — try again in a moment'};
  const exp=f.days>0?Date.now()+f.days*864e5:0;
  if(f.id){const a=S.alerts.find(x=>x.id===f.id);if(!a)return{err:'Alert not found'};Object.assign(a,{sym,cond:f.cond,v,recurring:!!f.recurring,expires:exp,prev:p.last,inside:condMet({cond:f.cond,v},p),status:'Active'});audit('Edited price alert',sym+' '+alertText(a))}
  else{if(activeCount()>=MAX_ALERTS)return{err:`You have reached the limit of ${MAX_ALERTS} active alerts`};
    const a={id:uid(),sym,cond:f.cond,v,recurring:!!f.recurring,expires:exp,status:'Active',created:Date.now(),last:null,prev:p.last,inside:false};a.inside=condMet(a,p);S.alerts.unshift(a);audit('Created price alert',sym+' '+alertText(a))}
  saveA();if(S.H.onAlerts)S.H.onAlerts();return{ok:true,warn:condMet({cond:f.cond,v},p)?'That level has already been passed — the alert fires next time it is crossed.':''}}
function alertAction(act,id){const a=S.alerts.find(x=>x.id===id);if(!a)return;
  if(act==='pause'){a.status='Paused';audit('Paused price alert',a.sym)}
  else if(act==='resume'){const p=price(a.sym);a.status='Active';a.prev=p?p.last:a.prev;a.inside=p?condMet(a,p):false;audit('Resumed price alert',a.sym)}   /* re-armed from the current price */
  else if(act==='del'){S.alerts=S.alerts.filter(x=>x!==a);audit('Deleted price alert',a.sym)}
  else if(act==='edit'){S.editing=id;drawCentre();return}
  saveA();if(S.H.onAlerts)S.H.onAlerts();drawAlertList();refresh()}
function linesFor(sym){return S.alerts.filter(a=>a.sym===sym&&a.status==='Active'&&(a.cond==='above'||a.cond==='below')).map(a=>({price:a.v,label:'ALERT '+money(a.v),color:'#EDA100',drag:false}))}

function bindAlertForm(){const hint=()=>{const sym=($('#alS')||{}).value||'',p=sym&&price(sym.toUpperCase()),c=$('#alC').value,v=parseFloat($('#alV').value);
    $('#alHint').textContent=!p||!(p.last>0)?'Enter a symbol to see its live price.':!(v>0)?`${sym.toUpperCase()} is ${money(p.last)} now.`:(c==='above'||c==='below')?`${sym.toUpperCase()} is ${money(p.last)} now — ${((v/p.last-1)*100).toFixed(2)}% from your level.`:`${sym.toUpperCase()} is ${p.chgPct>=0?'+':''}${(p.chgPct||0).toFixed(2)}% today.`};
  const pre=()=>{const sym=$('#alS').value.toUpperCase(),p=price(sym),c=$('#alC').value;if(!p||!(p.last>0))return;if($('#alV').dataset.t==='1')return;$('#alV').value=c==='up'||c==='down'?'3':(p.last*(c==='below'?0.98:1.02)).toFixed(2)};

    if(r.err){$('#alErr').textContent=r.err;return}S.editing=null;S.newSym=null;drawCentre();if(r.warn)toastInfo(r.warn);else toastInfo('Alert created')};

function drawAlertList(){const h=$('#rnAlList');if(!h)return;const ord={Active:0,Paused:1,Triggered:2,Expired:3},l=S.alerts.slice().sort((a,b)=>ord[a.status]-ord[b.status]||b.created-a.created);

  else if(k==='pause'){const id=$('#psEv').value,why=$('#psWhy').value.trim();S.prefs.paused[id]={t:Date.now(),why};saveP();audit('Paused event type '+id,why||'no reason given');drawCentre()}

/* ---- permission prompt: Chrome (esp. mobile) shows its native dialog only after a user tap, so we ask with a button ---- */
const ASK_KEY='algo-push-ask';
function askBanner(){
  if(document.getElementById('pushAsk'))return;
  const d=document.createElement('div');d.id='pushAsk';d.className='push-ask';d.setAttribute('role','dialog');d.setAttribute('aria-label','Allow notifications');
  d.innerHTML=`<div class="pa-t"><b>Get trade alerts on this phone?</b><span>Recommendations (max 5 a day) and your own price alerts, even when the app is closed. You can turn this off any time.</span></div>
    <div class="pa-b"><button class="rn-btn pri" id="paAllow">Allow notifications</button><button class="rn-btn" id="paLater">Not now</button></div><p class="pa-e" id="paErr" hidden></p>`;
  document.body.appendChild(d);
  document.getElementById('paLater').onclick=()=>{try{localStorage.setItem(ASK_KEY,String(Date.now()))}catch(e){}d.remove()};
  document.getElementById('paAllow').onclick=async()=>{const b=document.getElementById('paAllow');b.disabled=true;b.textContent='Waiting for your choice…';
    try{await pushEnable();try{localStorage.setItem(ASK_KEY,'done')}catch(e){}d.remove();toastInfo('Notifications are on for this device')}
    catch(e){const er=document.getElementById('paErr');er.textContent=String(e&&e.message||e).replace('Notification permission was denied','Notifications are blocked. Tap the lock icon in the address bar → Notifications → Allow, then try again.');er.hidden=false;b.disabled=false;b.textContent='Try again'}}}
function maybeAsk(){
  if(!('Notification' in global)||!('serviceWorker' in navigator))return;
  if(Notification.permission==='granted'){pushEnable().catch(()=>{});return}         // make sure the server has this device
  if(Notification.permission!=='default')return;
  let last=null;try{last=localStorage.getItem(ASK_KEY)}catch(e){}
  if(last==='done')return;
  if(last&&Date.now()-Number(last)<3*864e5)return;                                   // asked recently: wait 3 days
  askBanner()}
setTimeout(maybeAsk,5000);

function stubSeries(sym,tf){const ms=tf.sec*1000,t0=Math.floor(Date.now()/ms)*ms,P=sym.last||1,o=[];for(let i=60;i>=0;i--)o.push({t:t0-i*ms,o:P,h:P,l:P,c:P,v:0});return o}
function syncSeries(s,sym,tf){const ms=tf.sec*1000,now=Date.now();let lb=s[s.length-1];if(!MKT.open||!sym.last)return s;
  // history from the server can lag (cached for minutes): refresh it in the background, but never stop the live price meanwhile
  if(now-lb.t>ms*3&&Date.now()-(s._ts||0)>20000){s._ts=Date.now();fetchSeries(sym,tf).then(()=>onSeries(sym,tf))}
  if(tf.sec<86400){const slot=lb.t+Math.floor((now-lb.t)/ms)*ms;
    if(slot-lb.t>ms*3){const nb={t:slot,o:sym.last,h:sym.last,l:sym.last,c:sym.last,v:0};s.push(nb);lb=nb}   // long gap: start a fresh bar, don't fill flat ones
    else while(now>=lb.t+ms){const nb={t:lb.t+ms,o:lb.c,h:lb.c,l:lb.c,c:lb.c,v:0};s.push(nb);lb=nb}
    if(s.length>20000)s.splice(0,s.length-20000)}
  lb.c=sym.last;lb.h=Math.max(lb.h,lb.c);lb.l=Math.min(lb.l,lb.c);
  return s}
/* a history reload must not wipe newer live bars: keep the live tail that the (cached) server copy doesn't have yet */
function keepTail(old,fresh){if(!old||!old.length||!fresh||!fresh.length)return fresh;const lt=fresh[fresh.length-1].t;const tail=old.filter(b=>b.t>lt);if(!tail.length)return fresh;
  const out=fresh.concat(tail);out._ts=fresh._ts;out._note=fresh._note;out._span=fresh._span;out._partial=fresh._partial;return out}
function series(sym,tf){const k=sym.s+'|'+tf.k;if(!CACHE[k]||!CACHE[k].length){if(!CACHE[k]&&!SWAIT[k]&&!(FAILS[k]&&Date.now()-FAILS[k]<8000)){SWAIT[k]=1;fetchSeries(sym,tf).then(()=>{delete SWAIT[k];onSeries(sym,tf)})}return stubSeries(sym,tf)}return syncSeries(CACHE[k],sym,tf)}

const NA=n=>new Array(n).fill(NaN);

function sma(a,n){const o=NA(a.length);let s=0,k=0;for(let i=0;i<a.length;i++){if(isFinite(a[i])){s+=a[i];k++}if(i>=n&&isFinite(a[i-n])){s-=a[i-n];k--}if(k===n)o[i]=s/n}return o}
function emaA(a,n,al){const o=NA(a.length);let p=NaN,s=0,k=0;for(let i=0;i<a.length;i++){const v=a[i];if(!isFinite(v))continue;if(isNaN(p)){s+=v;k++;if(k===n){p=s/n;o[i]=p}}else{p=v*al+p*(1-al);o[i]=p}}return o}
const ema=(a,n)=>emaA(a,n,2/(n+1)), rma=(a,n)=>emaA(a,n,1/n);
function wma(a,n){const o=NA(a.length),den=n*(n+1)/2;for(let i=n-1;i<a.length;i++){let s=0;for(let j=0;j<n;j++)s+=a[i-j]*(n-j);o[i]=s/den}return o}
function stdev(a,n,m){const o=NA(a.length);for(let i=n-1;i<a.length;i++){let s=0;for(let j=0;j<n;j++)s+=(a[i-j]-m[i])**2;o[i]=Math.sqrt(s/n)}return o}
function hhv(a,n){const o=NA(a.length);for(let i=n-1;i<a.length;i++){let m=-Infinity;for(let j=0;j<n;j++)m=Math.max(m,a[i-j]);o[i]=m}return o}
function llv(a,n){const o=NA(a.length);for(let i=n-1;i<a.length;i++){let m=Infinity;for(let j=0;j<n;j++)m=Math.min(m,a[i-j]);o[i]=m}return o}
function trA(d){return d.map((b,i)=>i?Math.max(b.h-b.l,Math.abs(b.h-d[i-1].c),Math.abs(b.l-d[i-1].c)):b.h-b.l)}
const atr=(d,n)=>rma(trA(d),n);
const zip=(a,b,f)=>a.map((v,i)=>f(v,b[i]));
function rsi(c,n){const o=NA(c.length);let g=0,l=0;for(let i=1;i<c.length;i++){const ch=c[i]-c[i-1],u=Math.max(ch,0),dn=Math.max(-ch,0);if(i<=n){g+=u;l+=dn;if(i===n){g/=n;l/=n;o[i]=l===0?100:100-100/(1+g/l)}}else{g=(g*(n-1)+u)/n;l=(l*(n-1)+dn)/n;o[i]=l===0?100:100-100/(1+g/l)}}return o}
function psar(d,st,mx){const o=NA(d.length);if(d.length<3)return o;let up=true,af=st,ep=d[0].h,sar=d[0].l;
  for(let i=1;i<d.length;i++){sar=sar+af*(ep-sar);const p1=d[i-1],p2=d[Math.max(0,i-2)];
    if(up){sar=Math.min(sar,p1.l,p2.l);if(d[i].l<sar){up=false;sar=ep;ep=d[i].l;af=st}else if(d[i].h>ep){ep=d[i].h;af=Math.min(af+st,mx)}}
    else{sar=Math.max(sar,p1.h,p2.h);if(d[i].h>sar){up=true;sar=ep;ep=d[i].h;af=st}else if(d[i].l<ep){ep=d[i].l;af=Math.min(af+st,mx)}}
    o[i]=sar}return o}
function vwap(d,tfSec){const o=NA(d.length);let pv=0,vv=0,key=null;for(let i=0;i<d.length;i++){const dt=new Date(d[i].t);const k=tfSec<86400?dt.toDateString():tfSec<604800?dt.getFullYear()+'-'+dt.getMonth():dt.getFullYear();if(k!==key){key=k;pv=0;vv=0}const tp=(d[i].h+d[i].l+d[i].c)/3;pv+=tp*d[i].v;vv+=d[i].v;o[i]=vv?pv/vv:tp}return o}
function adx(d,n){const len=d.length,pdm=NA(len),mdm=NA(len),tr=NA(len);for(let i=1;i<len;i++){const u=d[i].h-d[i-1].h,dn=d[i-1].l-d[i].l;pdm[i]=u>dn&&u>0?u:0;mdm[i]=dn>u&&dn>0?dn:0;tr[i]=Math.max(d[i].h-d[i].l,Math.abs(d[i].h-d[i-1].c),Math.abs(d[i].l-d[i-1].c))}
  const a=rma(tr,n),p=rma(pdm,n),m=rma(mdm,n),pdi=zip(p,a,(x,y)=>100*x/y),mdi=zip(m,a,(x,y)=>100*x/y),dx=zip(pdi,mdi,(x,y)=>100*Math.abs(x-y)/((x+y)||1));return{adx:rma(dx,n),pdi,mdi}}
function cci(d,n){const tp=d.map(b=>(b.h+b.l+b.c)/3),m=sma(tp,n),o=NA(d.length);for(let i=n-1;i<d.length;i++){let md=0;for(let j=0;j<n;j++)md+=Math.abs(tp[i-j]-m[i]);md/=n;o[i]=md?(tp[i]-m[i])/(0.015*md):0}return o}

function fill(o,price){if(!(price>0)||!isFinite(price)){try{toast('No live price for '+o.sym+' right now - order not filled','warn')}catch(e){}return}const s=SYM(o.sym),sg=o.side==='buy'?1:-1;let p=posOf(o.sym);const pre={q:p?p.q:0,avg:p?p.avg:0,sl:p&&p.sl||null,tp:p&&p.tp||null,tsl:p&&p.tsl||null};
  App.cash-=sg*o.qty*price;
  if(!p){p={sym:o.sym,q:0,avg:price};App.positions.push(p)}
  const nq=p.q+sg*o.qty;if(Math.sign(p.q)===sg||p.q===0)p.avg=(p.avg*Math.abs(p.q)+price*o.qty)/Math.abs(nq);else if(Math.sign(nq)===sg)p.avg=price;
  p.q=+nq.toFixed(8);if(o.tp)p.tp=o.tp;if(o.sl)p.sl=o.sl;
  if(o.tsl&&o.tsl.v>0&&p.q!==0){p.tsl={u:o.tsl.u,v:o.tsl.v};p.peak=price;const d=p.tsl.u==='abs'?p.tsl.v:price*p.tsl.v/100,st=+(p.q>0?price-d:price+d).toFixed((s&&s.dp)||2);if(!(p.sl>0)||(p.q>0?st>p.sl:st<p.sl))p.sl=st}if(Math.abs(p.q)<1e-9)App.positions=App.positions.filter(x=>x!==p);
  o.status='Filled';o.price=price;o.t=Date.now();App.orders=App.orders.filter(x=>x!==o);App.history.push(o);try{logTrade(o,price,pre)}catch(e){console.error(e)}
  try{window.JV&&JV.cap&&JV.cap()}catch(e){}
  {const px=fmtP(price,s.dp),key='fill|'+o.id,link={sym:s.s};try{
    if(o.src==='TP')RN.emit('N-07',{sym:s.s,price:px},{key,link});

  App.btab='positions'}

  const step=Math.max(Math.pow(10,-s.dp),niceStep(s.last*0.00015)),base=s.vb/40,mk=side=>{let cum=0;return Array.from({length:11},(_,k)=>{const q=base*(0.3+Math.random()*1.4)*(1+k*0.15);cum+=q;return{p:side>0?ask(s)+k*step:bid(s)-k*step,q,cum}})};
  const A=mk(1),B=mk(-1),mx=Math.max(A.at(-1).cum,B.at(-1).cum);
  const put=(el,list,col)=>[...el.children].forEach((r,k)=>{const d=list[k];r.dataset.p=d.p;r.children[0].style.cssText=`width:${d.cum/mx*100}%;background:${col}`;r.children[1].textContent=fmtP(d.p,s.dp);r.children[1].className='num '+(col.includes('up')?'up':'down');r.children[2].textContent=fmtN(d.q);r.children[3].textContent=fmtN(d.cum)});
  put($('#asks'),A.slice().reverse().map((d,k,arr)=>d),'var(--down)');put($('#bids'),B,'var(--up)');
  const l=$('#obLast');l.textContent=fmtP(s.last,s.dp);l.className='num '+cls(s.last-s.prev);$('#obSpread').textContent=fmtP(st,s.dp)}

function drawMovers(){const host=$('#mkMovers');if(!host)return;const mk=App.mk;mk.pg=mk.pg||{g:0,l:0,a:0};

function dailyReadout(sym){

/* ---- Rajan premium indicators (live). Rules agreed 20 Oct 2026 - see premium_backtest.py for the test:
   A Expiry divisor (contract's own expiry day): premium Open = High (high <= open + 0.5) -> buy at open/4, /6.5, /8, /10; SL 5-10 pts
   B Daily divisor (other days): base = High when High = Open or High = previous close -> buy at base/2, /4; SL 5-10 pts
     + Open = Low (low >= open - 0.5) with price above open -> clean buy
   C Open = Low within 10 pts (low >= open - 10) with price at/above open -> buy; SL 3 pts

/* ---- What-if premium (Sensibull-style): Black-Scholes with the IV implied by the live premium, so the table shows

/* When the market is shut, the last premium was struck at the last session's 15:30 close, so time value is measured

const TF_RE=/^(\d{1,3})([mHDWM])$/,TF_LIM={m:720,H:24,D:30,W:8,M:12},TF_NAME={m:'minutes',H:'hours',D:'days',W:'weeks',M:'months'};
const tfValid=k=>{const m=TF_RE.exec(k);return !!m&&+m[1]>=1&&+m[1]<=TF_LIM[m[2]]};
const tfSecOf=k=>{const m=TF_RE.exec(k);return m?+m[1]*({m:60,H:3600,D:86400,W:604800,M:2592000}[m[2]]):0};
function saveCustomTfs(){try{localStorage.setItem('rs-tfs',JSON.stringify(TFS.filter(t=>t.custom).map(t=>t.k)))}catch(e){}}
function addCustomTf(k,persist=true){if(!tfValid(k))return null;let t=TFS.find(x=>x.k===k);if(!t){t={k,sec:tfSecOf(k),custom:true};TFS.push(t);TFS.sort((a,b)=>a.sec-b.sec)}if(persist)saveCustomTfs();return t}

/* ---- readings + trade plan (same maths for stocks, indices and options) ---- */
function computeReadings(d,o,tf){const px=o.last,R=[];const add=(name,val,note,b)=>R.push({name,val,note,b});
  if(!d||d.length<5)return{R,bu:0,be:0,bias:'Neutral'};
  const rsi_=lastv(calcDef('rsi',d,tf).v);if(isFinite(rsi_))add('RSI (14)',rsi_.toFixed(1),rsi_>=70?'Overbought':rsi_<=30?'Oversold':rsi_>=55?'Momentum up':rsi_<=45?'Momentum down':'Neutral',rsi_>=70?-1:rsi_<=30?1:rsi_>=55?1:rsi_<=45?-1:0);
  const mc=calcDef('macd',d,tf),mm=lastv(mc.m),ms=lastv(mc.sig),mh=lastv(mc.h);if(isFinite(mm))add('MACD (12,26,9)',`${mm.toFixed(2)} / ${ms.toFixed(2)}`,mh>=0?'MACD above signal':'MACD below signal',mh>=0?1:-1);
  if(tf.sec<86400){const vv=lastv(calcDef('vwap',d,tf).v);if(isFinite(vv))add('VWAP',fmtP(vv),px>=vv?'Price above VWAP':'Price below VWAP',px>=vv?1:-1)}
  const e21=lastv(calcDef('ema',d,tf).v);if(isFinite(e21))add('EMA (21)',fmtP(e21),px>=e21?'Price above EMA':'Price below EMA',px>=e21?1:-1);
  const s20=lastv(calcDef('sma',d,tf).v);if(isFinite(s20))add('SMA (20)',fmtP(s20),px>=s20?'Price above SMA':'Price below SMA',px>=s20?1:-1);
  const bb=calcDef('bb',d,tf),bu=lastv(bb.up),bl=lastv(bb.lo);if(isFinite(bu)&&bu>bl){const pb=(px-bl)/(bu-bl);add('Bollinger %B',(pb*100).toFixed(0)+'%',pb>1?'Above upper band':pb<0?'Below lower band':pb>.8?'Near upper band':pb<.2?'Near lower band':'Inside bands',pb>1?-1:pb<0?1:0)}
  const at=lastv(calcDef('atr',d,tf).v);if(isFinite(at))add('ATR (14)',fmtP(at),`${(at/px*100).toFixed(1)}% of price`,0);
  const vols=d.slice(-21,-1).map(b=>b.v),av=vols.length?vols.reduce((a,b)=>a+b,0)/vols.length:0,lv=d.at(-1)?.v||0;if(av>0)add('Volume vs 20-bar avg',(lv/av).toFixed(2)+'×',lv/av>=1.5?'Volume surge':lv/av<0.5?'Thin volume':'Normal',0);
  if(o.hi>o.lo)add('Position in day range',((px-o.lo)/(o.hi-o.lo)*100).toFixed(0)+'%',px>=o.lo+(o.hi-o.lo)*.7?'Upper part of range':px<=o.lo+(o.hi-o.lo)*.3?'Lower part of range':'Mid range',px>=o.lo+(o.hi-o.lo)*.7?1:px<=o.lo+(o.hi-o.lo)*.3?-1:0);
  if(o.open>0&&o.hi>o.lo){const tol=Math.max(0.05,px*0.0002),oh=Math.abs(o.open-o.hi)<=tol,ol=Math.abs(o.open-o.lo)<=tol;add('Open = High / Low',oh?'Open = High':ol?'Open = Low':'No',oh?'Opened at the day high — sellers in control':ol?'Opened at the day low — buyers in control':'Neither today',oh?-1:ol?1:0)}
  const bu_=R.filter(r=>r.b>0).length,be_=R.filter(r=>r.b<0).length,tot=bu_+be_;return{R,bu:bu_,be:be_,bias:tot?bu_>be_?'Bullish':be_>bu_?'Bearish':'Mixed':'Neutral',atr:at}}
function tradePlan(d,o,tf,isOpt){const rd=computeReadings(d,o,tf);if(!d||d.length<20||!(o.last>0))return null;const px=o.last,atr=isFinite(rd.atr)&&rd.atr>0?rd.atr:px*0.012,score=rd.bu-rd.be;
  const sig=score>=2?'BUY':score<=-2?'SELL':'WAIT',w=d.slice(-10),swLo=Math.min(...w.map(b=>b.l)),swHi=Math.max(...w.map(b=>b.h));
  let sl,t1,t2,risk;
  if(sig==='SELL'){sl=Math.min(swHi,px+1.5*atr);if(sl-px<px*0.003)sl=px+1.5*atr;risk=sl-px;t1=px-1.5*risk;t2=px-2.5*risk}
  else{sl=Math.max(swLo,px-1.5*atr);if(px-sl<px*0.003)sl=px-1.5*atr;risk=px-sl;t1=px+1.5*risk;t2=px+2.5*risk}
  if(isOpt){sl=Math.max(sl,px*0.35);risk=Math.abs(px-sl);t1=sig==='SELL'?px-1.5*risk:px+1.5*risk;t2=sig==='SELL'?px-2.5*risk:px+2.5*risk;if(t1<0)t1=0.05;if(t2<0)t2=0.05}
  const why=rd.R.filter(r=>r.b!==0).sort((a,b)=>Math.abs(b.b)-Math.abs(a.b)).slice(0,3).map(r=>r.name.split(' (')[0]+': '+r.note.toLowerCase());
  return{sig,px,sl,t1,t2,rr:1.5,why,rd,tf:tf.k,label:isOpt?(sig==='BUY'?'BUY this option':sig==='SELL'?'SELL / EXIT this option':'WAIT'):(sig==='BUY'?'BUY':sig==='SELL'?'SELL / SHORT':'WAIT')}}
function planHTML(p,isOpt){if(!p)return'';const open=localStorage.getItem(PLAN_STORE)==='1',cl=p.sig==='BUY'?'pl-buy':p.sig==='SELL'?'pl-sell':'pl-wait';
  const oside=isOpt&&OPT.sel&&!OPT.sel.fut?OPT.sel.side:null,V=isOpt&&oside?optVerdict(OPT.sym,oside):null,
    clash=V&&V.ok!==null&&p.sig==='BUY'&&!V.ok?` <span class="down">⚠ The underlying's strategies disagree — higher risk.</span>`:'';

/* ---- resilient candle loading: never cache a failure, show a message + retry ---- */
const FAILS={};
function histQS(sym,tf){let q='';
  if(!sym.ikey){if(tf.sec>=3600){if(App.from)q+='&from='+App.from;if(App.to&&tf.sec>=86400)q+='&to='+App.to}
    if(!q&&App.span){q='&from='+new Date(Date.now()-App.span*864e5).toISOString().slice(0,10)}}
  return q}
/* Intraday charts paint from the last few days first (one small request, ~0.3 s) and the full history is fetched right
   behind it and swapped in without moving the view - instead of waiting 1-9 s for every window of history up front. */
const quickDays=tf=>{const m=/^(\d+)([mH])$/.exec(tf.k);if(!m)return 0;const mins=+m[1]*(m[2]==='H'?60:1);return Math.max(3,Math.min(30,Math.ceil(320/(375/Math.max(1,mins)))+2))};
function swapFull(sym,tf,k){return api(candleURL(sym,tf)).then(r=>{if(!(r.bars&&r.bars.length))return;CACHE[k]=keepTail(CACHE[k],r.bars);CACHE[k]._ts=Date.now();CACHE[k]._note=r.note||null;CACHE[k]._span=App.span||0;
  if(sym===App.sym&&tf===App.tf&&chart){chart.setData(series(sym,tf),sym,tf,true);chart.lgDirty=true;try{setChartLines()}catch(e){}}
  if(typeof OPT!=='undefined'&&OPT.osym===sym&&OPT.tf===tf&&OPT.ochart){OPT.ochart.setData(series(sym,tf),sym,tf,true);try{optReadings(false)}catch(e){}}}).catch(()=>{})}
async function fetchSeries(sym,tf){const k=sym.s+'|'+tf.k;if(PEND[k])return PEND[k];if(FAILS[k]&&Date.now()-FAILS[k]<8000)return;
  return PEND[k]=(async()=>{try{
    const qd=!CACHE[k]&&!sym.tv&&!histQS(sym,tf)?quickDays(tf):0;
    if(qd){try{const q=await api(candleURL(sym,tf)+'&recent='+qd);
      if(q.bars&&q.bars.length>=40){CACHE[k]=keepTail(CACHE[k],q.bars);CACHE[k]._ts=Date.now();CACHE[k]._partial=true;delete FAILS[k];swapFull(sym,tf,k);return}}catch(e){}}
    const r=await api(candleURL(sym,tf));
    if(r.bars&&r.bars.length){CACHE[k]=keepTail(CACHE[k],r.bars);CACHE[k]._ts=Date.now();CACHE[k]._note=r.note||null;CACHE[k]._span=App.span||0;delete FAILS[k]}else{FAILS[k]=Date.now()}}
    catch(e){FAILS[k]=Date.now();console.warn('candles',e)}finally{delete PEND[k]}})()}
let chartErrTimer=0,chartErrTries=0;
function chartErr(show,retry,msg){const host=$('#chart');if(!host)return;let el=host.querySelector('.chart-err');clearTimeout(chartErrTimer);
  if(!show){el&&el.remove();return}
  if(!el){el=document.createElement('div');el.className='chart-err';host.appendChild(el)}
  el.innerHTML=`<b>${esc(msg||'Could not load candles')}</b><span class="muted">${retry?'Retrying automatically…':''}</span>${retry?'<button class="btn-xs pri">Retry now</button>':''}`;
  if(retry){const go=()=>{chartErr(false);retry()};el.querySelector('button').onclick=go;if(chartErrTries++<3)chartErrTimer=setTimeout(go,6000)}else chartErrTries=0}
function loadChart(keep){const k=App.sym.s+'|'+App.tf.k;
  if(!CACHE[k]){$('#hint').textContent='Loading '+App.sym.s+' · '+tfLabel(App.tf.k)+'…';$('#hint').classList.add('show');chartErr(false);const sy=App.sym,tf=App.tf;
    if(chart.sym!==sy){chart.setData([],sy,tf,false);chart.lgDirty=true;
      try{if(chart.ctx&&chart.w&&chart.h)chart.ctx.clearRect(0,0,chart.w,chart.h);
        if(chart.lgDirty)chart.buildLegend();
        if(chart.lgHdr)chart.lgHdr.innerHTML=`<b>${esc(sy.s)}</b><span class="muted">${tfLabel(tf.k)} · ${esc(sy.ex)}</span>`}catch(e){}}
    fetchSeries(sy,tf).then(()=>{$('#hint').classList.remove('show');if(sy!==App.sym||tf!==App.tf)return;if(CACHE[k]){chartErrTries=0;loadChart(keep)}else chartErr(true,()=>{delete FAILS[k];loadChart(keep)},'Could not load '+sy.s+' · '+tfLabel(tf.k)+' candles')});return}
  chartErr(false);chart.setData(series(App.sym,App.tf),App.sym,App.tf,keep);chart.lgDirty=true;setChartLines();updatePlan(true);
  if(App.pendingRange!==undefined){const r=App.pendingRange;App.pendingRange=undefined;chart.showRange(r)}
  if(App.fitAll){App.fitAll=false;chart.showRange(null)}
  if(CACHE[k]._empty)chartErr(true,null,'No candles for '+App.sym.s+' on '+tfLabel(App.tf.k)+' in this period.');
  else if(CACHE[k]._note&&App.from)toast(CACHE[k]._note,'info')}

/* ---- Gann time-price angles: a slanted support / resistance line drawn from the last confirmed swing low / high (user, 28 Oct) ----
   1x1 = the diagonal that crosses the whole chart corner to corner (price range / number of bars per bar); 2x1 climbs twice as fast, 1x2 half as fast.
   A line starts from a swing confirmed `swing` bars later, so it never repaints. Picked from the indicator list (Gann group). */
function gannCalc(d,p,mode,ratios){const n=d.length,out=ratios.map(()=>NA(n));if(n<12)return out;const low=mode==='sup',k=Math.max(2,Math.round(p.swing||5));let ai=-1;
  for(let i=n-1-k;i>=k;i--){const v=low?d[i].l:d[i].h;let ok=true;for(let j=i-k;j<=i+k;j++){if(low?d[j].l<v:d[j].h>v){ok=false;break}}if(ok){ai=i;break}}
  if(ai<0){ai=0;for(let i=1;i<n;i++)if(low?d[i].l<d[ai].l:d[i].h>d[ai].h)ai=i}
  const ap=low?d[ai].l:d[ai].h;let hi=-Infinity,lo=Infinity;for(const b of d){if(b.h>hi)hi=b.h;if(b.l<lo)lo=b.l}
  const unit=p.scale>0?p.scale:(hi-lo)/Math.max(1,n);
  ratios.forEach((r,j)=>{const sl=unit*(p.ratio>0&&ratios.length===1?p.ratio:r);for(let i=ai;i<n;i++){const v=ap+(low?1:-1)*sl*(i-ai);if(v>0)out[j][i]=v}});return out}
(function(){const G=[['sup','1x1',[1],'Gann support 1x1','Gann Sup 1x1'],['sup','2x1',[2],'Gann support 2x1 (steep)','Gann Sup 2x1'],['sup','1x2',[0.5],'Gann support 1x2 (gentle)','Gann Sup 1x2'],['sup','fan',[0.5,1,2],'Gann support fan (1x2, 1x1, 2x1)','Gann Fan'],
  ['res','1x1',[1],'Gann resistance 1x1','Gann Res 1x1'],['res','fan',[0.5,1,2],'Gann resistance fan (1x2, 1x1, 2x1)','Gann Res Fan']];
  G.forEach(([mode,tag,ratios,name,short])=>{const sup=mode==='sup',single=ratios.length===1;
    DEFS['gann-'+mode+'-'+tag]={name,short,cat:'Gann',pane:'main',
      params:[{k:'swing',l:'Swing strength (bars)',v:5,min:2,max:50}].concat(single?[{k:'ratio',l:'Steepness (1 = 1x1)',v:ratios[0],min:.05,max:10,step:.05}]:[]).concat([{k:'scale',l:'Price per bar (0 = auto)',v:0,min:0,max:100000,step:.01}]),
      lines:ratios.map((r,j)=>({k:'a'+j,label:ratios.length===1?name:(r===1?'1x1':r===2?'2x1':'1x2'),c:ratios.length===1?(sup?4:5):[2,1,3][j]})),
      calc:(d,p)=>{const o=gannCalc(d,p,mode,ratios),r={};o.forEach((a,j)=>r['a'+j]=a);return r},
      desc:sup?'A rising Gann time-price line from the last swing low: where a pullback often finds support.':'A falling Gann time-price line from the last swing high: where a bounce often meets resistance.',
      read:sup?'Starts at the last confirmed swing low and climbs one price step per bar (1x1 = corner to corner of the chart). Buy when price touches the line and closes back above it, stop just under the line, first target the next fan line or the last high. If a bar closes under the line, the support has failed.'
              :'Starts at the last confirmed swing high and falls one price step per bar. Sell (or buy a put) when price rises to the line and closes back under it, stop just above the line. A close above the line means the resistance has failed.'}})})();

function optOrder(side){if(!netGuard())return;const o=OPT.osym;if(!o||!OPT.sel)return;const lots=Math.max(1,parseInt($('#opLots').value)||1),lot=o.lot||1;let qty=lots*lot;

    App.meta[sym]={xstk:1,n:name,idx:isIdx?1:0};try{savePaper()}catch(_){}}
  try{const r=await api('/api/m/quotes?symbols='+encodeURIComponent(sym)),q=(r.quotes||[]).find(x=>x.s===sym);
    if(q&&q.last>0)Object.assign(e,{last:q.last,p:q.last,prev:q.prev>0?q.prev:q.last,hi:q.high||q.last,lo:q.low||q.last,open:q.open||q.last,yh:q.yh||e.yh,yl:q.yl||e.yl})}catch(_){}
  return e}

/* A range button used to only rescale the candles already loaded (e.g. 28 days of 1m), so anything past the
   default window never appeared. Now it widens the request and, when the timeframe is too fine for the range,
   steps up to one that can show it (1m/5m/15m -> 1H -> 4H -> 1D). */
function rangeTo(days){
  const want=days==null?1830:days,ladder=TFS.filter(x=>!x.custom).sort((a,b)=>a.sec-b.sec),bpd=x=>x.sec>=86400?86400/x.sec:22500/x.sec;
  let tf=App.tf,sw=false;
  while(tf.sec<86400&&want*bpd(tf)>4500){const nx=ladder.find(x=>x.sec>tf.sec);if(!nx)break;tf=nx;sw=true}
  if(days==null&&tf.sec<86400){tf=ladder.find(x=>x.k==='1D')||tf;sw=true}
  if(sw){App.tf=tf;saveTfLast();toast('Showing '+tfLabel(tf.k)+' bars so the '+(days==null?'full history':days+'-day range')+' loads','info')}
  App.span=days==null?null:want;
  const k=App.sym.s+'|'+App.tf.k,c=CACHE[k],need=Date.now()-want*864e5;
  const covers=c&&c.length&&c[0].t<=need+7*864e5,tried=c&&c._span>=want;
  const refetch=!App.sym.ikey&&!covers&&!tried;
  if(refetch)delete CACHE[k];
  if(sw||refetch){App.pendingRange=days;if(sw)renderToolbar();loadChart(false)}else chart.showRange(days)}
