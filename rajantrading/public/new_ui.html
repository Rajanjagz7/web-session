<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algo Trades · NSE Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8;--panel:#FFFFFF;--panel-2:#F6F7FA;--line:#E2E6EC;--grid:#EEF1F5;
  --text:#0E1726;--text-2:#4A5568;--text-3:#8592A6;--water:rgba(14,23,38,.05);--pill:#0E1726;
  --brand:#2a78d6;--brand-2:#E7F0FC;--up:#0A8F6C;--down:#D93240;--up-bg:#E6F5F0;--down-bg:#FCEBEC;
  --warn:#B7791F;--warn-bg:#FFF6E5;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;
  --shadow:0 10px 30px rgba(16,24,40,.12);color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0E14;--panel:#11151D;--panel-2:#171C26;--line:#232A37;--grid:#181E29;
  --text:#E6EAF2;--text-2:#A3ADBF;--text-3:#6B7588;--water:rgba(230,234,242,.04);--pill:#2A3242;
  --brand:#3987e5;--brand-2:#14233B;--up:#22AB94;--down:#F7525F;--up-bg:#0F2A26;--down-bg:#2D1418;
  --warn:#E3A846;--warn-bg:#2B2210;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#2f9a2f;--s7:#9085e9;--s8:#e66767;
  --shadow:0 10px 30px rgba(0,0,0,.45);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B0E14;--panel:#11151D;--panel-2:#171C26;--line:#232A37;--grid:#181E29;
  --text:#E6EAF2;--text-2:#A3ADBF;--text-3:#6B7588;--water:rgba(230,234,242,.04);--pill:#2A3242;
  --brand:#3987e5;--brand-2:#14233B;--up:#22AB94;--down:#F7525F;--up-bg:#0F2A26;--down-bg:#2D1418;
  --warn:#E3A846;--warn-bg:#2B2210;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#2f9a2f;--s7:#9085e9;--s8:#e66767;
  --shadow:0 10px 30px rgba(0,0,0,.45);color-scheme:dark;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.num,td.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px;border-radius:6px}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--text-3)}.m2{color:var(--text-2)}
svg.i{display:block;flex-shrink:0}

/* ── Header ── */
.hdr{position:sticky;top:var(--nb,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.hdr-top{height:50px;display:flex;align-items:center;gap:12px;padding:0 14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap;flex-shrink:0}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#8b5cf6,#4f46e5);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1 1 0}
.nav::-webkit-scrollbar{display:none}
.nav button{height:30px;padding:0 10px;border-radius:8px;color:var(--text-2);font-weight:500;white-space:nowrap;font-size:13px}
.nav button:hover{background:var(--panel-2);color:var(--text)}
.nav button.on{background:var(--brand-2);color:var(--brand)}
.hdr-r{display:flex;align-items:center;gap:6px;flex-shrink:0}
.ibtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--text-2)}
.ibtn:hover{background:var(--panel-2);color:var(--text)}
.live-dot{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-2);white-space:nowrap;padding:0 6px}
.live-dot i{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 3px var(--up-bg);flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.live-dot.open i{animation:blink 2s infinite}

/* ── Ticker strip ── */
.ticker{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding:0 12px;border-top:1px solid var(--line);height:32px;align-items:center;background:var(--panel-2)}
.ticker::-webkit-scrollbar{display:none}
.tk-chip{display:flex;align-items:center;gap:6px;padding:0 9px;height:24px;border-radius:6px;white-space:nowrap;flex-shrink:0;font-size:12px;cursor:pointer}
.tk-chip:hover{background:var(--panel)}
.tk-chip b{font-weight:600}
.tk-sep{width:1px;height:14px;background:var(--line);margin:0 3px;flex-shrink:0}

/* ── Generic components ── */
.btn{height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;gap:5px;font-weight:500;color:var(--text-2);white-space:nowrap}
.btn:hover{color:var(--text);border-color:var(--text-3)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{height:24px;padding:0 8px;border-radius:6px;color:var(--text-2);font-weight:500;font-size:12px;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sel{height:30px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 8px;color:var(--text);outline:none}
.sel:focus{border-color:var(--brand)}
.inp{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 10px;width:100%;outline:none;color:var(--text)}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-2)}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:10px;font-size:11px;font-weight:600}
.b-up{background:var(--up-bg);color:var(--up)}.b-down{background:var(--down-bg);color:var(--down)}
.b-info{background:var(--brand-2);color:var(--brand)}.b-mute{background:var(--panel-2);color:var(--text-2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:13.5px;flex:1;font-weight:600}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--text-3);text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel)}
th.r,td.r{text-align:right}
td{padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
tbody tr:hover td{background:var(--panel-2)}
.empty{padding:32px;text-align:center;color:var(--text-3)}

/* ── Page layout ── */
.view{display:none}.view.on{display:block}
.page{max-width:1280px;margin:0 auto;padding:18px 16px 40px}
.page-h{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-h h1{font-size:20px;letter-spacing:-.01em;font-weight:700}

/* ── Index KPI grid ── */
.idx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-bottom:14px}
.idx-card{padding:13px 14px;cursor:pointer;transition:border-color .15s}
.idx-card:hover,.idx-card.on{border-color:var(--brand)}
.idx-card.on{background:var(--brand-2)}
.idx-card small{color:var(--text-3);font-size:11px;display:block;margin-bottom:3px}
.idx-card b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.idx-card span{font-size:12px}

/* ── Global markets ── */
.gm-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 14px}
.gm-row::-webkit-scrollbar{display:none}
.gm-chip{padding:8px 12px;border-radius:8px;flex-shrink:0;text-align:center;border:1px solid var(--line);background:var(--panel-2);min-width:90px}
.gm-chip small{display:block;color:var(--text-3);font-size:10.5px;margin-bottom:2px}
.gm-chip b{font-size:13px;font-variant-numeric:tabular-nums}
.gm-chip span{display:block;font-size:11px}

/* ── Call cards ── */
.calls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.call-card{padding:14px;background:#14141c;border-radius:12px;border:1px solid rgba(255,255,255,.08);color:#fff;display:flex;flex-direction:column;gap:9px}
.call-card .cc-hdr{display:flex;align-items:center;gap:7px}
.call-card .sym{font-size:14px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.call-card .bs{height:21px;padding:0 8px;border-radius:5px;font-size:11.5px;font-weight:700}
.call-card .bs.buy{background:rgba(34,171,148,.2);color:#22AB94}
.call-card .bs.sell{background:rgba(247,82,95,.2);color:#F7525F}
.call-card .bt{height:19px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:600;background:rgba(255,255,255,.09);color:rgba(255,255,255,.65)}
.call-card .cc-sub{font-size:11px;color:rgba(255,255,255,.38)}
.call-card .cc-track{display:grid;grid-template-columns:1fr 8px 1fr;gap:3px;align-items:center}
.call-card .tb{height:3px;border-radius:2px}
.call-card .tb.l{background:linear-gradient(to right,#F7525F,rgba(255,255,255,.3))}
.call-card .tb.r{background:linear-gradient(to right,rgba(255,255,255,.3),#22AB94)}
.call-card .ed{width:8px;height:8px;border-radius:50%;background:#fff;flex-shrink:0}
.call-card .cc-vals{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center}
.call-card .cvl{font-size:10px;color:rgba(255,255,255,.38);margin-bottom:2px}
.call-card .cvn{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.call-card .cc-foot{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.35)}

/* ── Scanner ── */
.scan-bar{display:flex;gap:7px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center;background:var(--panel)}
.scan-err{display:none;margin:10px 14px;padding:9px 12px;border-radius:8px;background:var(--down-bg);border:1px solid var(--down);color:var(--down);font-size:12px}
.scan-err.show{display:block}
.scan-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:9px;padding:12px 14px}

/* ── Trade/Chart layout ── */
#v-chart.on{display:grid}
#v-chart{grid-template-columns:210px minmax(0,1fr) 280px;height:calc(100vh - 82px - var(--nb,0px))}
.wl{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.wl-h{padding:7px 9px;border-bottom:1px solid var(--line);display:grid;gap:5px}
.wl-list{overflow-y:auto;flex:1}
.wl-g{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:7px 10px 2px}
.wl-row{display:grid;grid-template-columns:1fr 52px auto;align-items:center;gap:5px;width:100%;text-align:left;padding:5px 9px;border-left:2px solid transparent}
.wl-row:hover{background:var(--panel-2)}
.wl-row.on{background:var(--brand-2);border-left-color:var(--brand)}
.wl-row b{display:block;font-size:12px;font-weight:600}
.wl-row small{display:block;color:var(--text-3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl-row .r{text-align:right;font-size:11.5px;line-height:1.25}
.center{display:flex;flex-direction:column;min-width:0;min-height:0}
.symbar{display:flex;align-items:center;gap:14px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;min-height:50px}
.symbar::-webkit-scrollbar{display:none}
.sb-name{font-size:15px;font-weight:700;white-space:nowrap}
.sb-px b{font-size:19px;font-weight:700}
.sb-px{display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.sb-stat{display:flex;flex-direction:column;font-size:11px;color:var(--text-3);white-space:nowrap}
.sb-stat span{color:var(--text);font-size:12px}
.toolbar{display:flex;align-items:center;gap:3px;padding:4px 7px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.toolbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px;flex-shrink:0}
.tb-btn{height:27px;padding:0 7px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;color:var(--text-2);font-weight:500;font-size:12px;white-space:nowrap;flex-shrink:0}
.tb-btn:hover{background:var(--panel-2);color:var(--text)}
.tb-btn.on{color:var(--brand);background:var(--brand-2)}
.chart-wrap{flex:1;display:flex;min-height:0}
.tools{width:38px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;flex-shrink:0}
.tools .sep{width:18px;height:1px;background:var(--line);margin:2px 0}
.tools .ibtn{width:30px;height:30px}
.chart{flex:1;position:relative;min-width:0;min-height:0;overflow:hidden}
.chart canvas{position:absolute;inset:0;touch-action:none;cursor:crosshair}
.legend{position:absolute;inset:0;pointer-events:none;font-size:12px}
.lg-g{position:absolute;left:6px;display:grid;gap:1px;justify-items:start}
.lg-hdr{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:2px 3px;font-variant-numeric:tabular-nums;font-size:12px}
.lg-hdr b{font-size:12.5px}
.lg-hdr .k{color:var(--text-3);margin-right:2px}
.lg-row{pointer-events:auto;display:flex;align-items:center;gap:5px;padding:1px 3px;border-radius:5px;font-variant-numeric:tabular-nums;border:1px solid transparent}
.lg-row:hover{background:var(--panel);border-color:var(--line)}
.lg-row.off{opacity:.45}
.lg-name{color:var(--text-2)}
.lg-val{display:flex;gap:5px}
.lg-val span{display:inline-flex;align-items:center;gap:3px}
.sw{display:inline-block;width:10px;height:2px;border-radius:1px}
.lg-act{display:none;gap:1px}
.lg-row:hover .lg-act,.lg-row:focus-within .lg-act{display:flex}
.lg-act button{width:17px;height:17px;border-radius:4px;display:grid;place-items:center;color:var(--text-2)}
.lg-act button:hover{background:var(--panel-2)}
.zoom{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:2px;opacity:0;transition:opacity .15s}
.chart:hover .zoom{opacity:1}
.bottom{height:190px;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;flex-shrink:0}
.btabs{display:flex;align-items:center;gap:2px;padding:3px 6px;border-bottom:1px solid var(--line)}
.btabs button{height:27px;padding:0 9px;border-radius:6px;color:var(--text-2);font-weight:500;font-size:12px}
.btabs button.on{color:var(--text);background:var(--panel-2)}
.bbody{overflow:auto;flex:1}
.right{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto}

/* ── Ticket ── */
.ticket{padding:11px 12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.tk-h b{font-size:13.5px}
.side-seg{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.side-seg button{height:33px;border-radius:8px;font-weight:600;border:1px solid var(--line);color:var(--text-2)}
.side-seg button.buy.on{background:var(--up);border-color:var(--up);color:#fff}
.side-seg button.sell.on{background:var(--down);border-color:var(--down);color:#fff}
.fld label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-2);margin-bottom:3px;font-weight:500}
.inp-w{position:relative}
.inp-w .suf{position:absolute;right:9px;top:8px;font-size:11.5px;color:var(--text-3);pointer-events:none}
.inp-w .inp{padding-right:48px;font-variant-numeric:tabular-nums}
.sum{display:grid;gap:3px;font-size:12px;padding:7px 9px;background:var(--panel-2);border-radius:7px}
.sum div{display:flex;justify-content:space-between}
.sum b{font-variant-numeric:tabular-nums}
.go{height:38px;border-radius:8px;font-weight:600;font-size:13px;color:#fff;width:100%}
.go.buy{background:var(--up)}.go.sell{background:var(--down)}
.go:disabled{opacity:.45;cursor:not-allowed}
.tk-msg{font-size:12px;border-radius:6px;padding:5px 8px;display:none}
.tk-msg.err{display:block;background:var(--down-bg);color:var(--down)}

/* ── Orders ── */
.pos-row{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.pos-row b{font-size:13px;font-weight:700}
.pos-row .det{font-size:12px;color:var(--text-2)}

/* ── Toasts ── */
#toasts{position:fixed;right:14px;bottom:14px;z-index:200;display:grid;gap:7px;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-left:3px solid var(--brand);border-radius:9px;padding:9px 13px;font-size:13px;max-width:300px;animation:tin .18s ease-out}
.toast.ok{border-left-color:var(--up)}.toast.bad{border-left-color:var(--down)}
@keyframes tin{from{opacity:0;transform:translateY(5px)}}

/* ── Settings Modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;place-items:center;backdrop-filter:blur(3px)}
.overlay.on{display:grid}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(460px,95vw);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:15px;font-weight:700;flex:1}
.modal-b{padding:18px;display:grid;gap:14px}
.fld-row{display:grid;gap:5px}
.fld-row label{font-size:11.5px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.03em}
.inp-grp{display:flex;gap:6px}
.inp-grp .inp{flex:1;font-family:monospace;font-size:12.5px}
.token-status{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:9px 11px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line)}
.token-status.ok{background:var(--up-bg);border-color:var(--up)}
.modal-divider{height:1px;background:var(--line)}
.modal-info{font-size:12px;color:var(--text-3);line-height:1.6}
.modal-info b{color:var(--text-2)}

/* ── Responsive ── */
@media(max-width:1100px){
  #v-chart{grid-template-columns:minmax(0,1fr) 270px}
  #v-chart .wl{display:none}
}
@media(max-width:780px){
  #v-chart.on{display:block;height:auto}
  .chart-wrap{height:400px;flex:none}
  .right{border-left:0;border-top:1px solid var(--line)}
  .tools{display:none}
  .idx-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:480px){
  .hdr-top{padding:0 9px;gap:7px}
  .brand span:last-child{display:none}
  .live-dot span{display:none}
  .idx-grid{grid-template-columns:1fr 1fr}
  .page{padding:10px}
  .scan-bar{flex-wrap:wrap;gap:6px;padding:8px 10px}
  .scan-bar>*{flex-wrap:wrap}
}
.newsbar{position:sticky;top:0;z-index:36;height:30px;display:flex;align-items:center;background:var(--panel-2);border-bottom:1px solid var(--line);overflow:hidden}
.nb-l{flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;height:100%;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#fff;background:linear-gradient(135deg,#8b5cf6,#4f46e5)}
.nb-l i{width:7px;height:7px;border-radius:50%;background:#fff;animation:nbp 1.4s ease-in-out infinite}@keyframes nbp{50%{opacity:.25}}
.nb-track{flex:1;min-width:0;overflow:hidden;white-space:nowrap}

/* ===================== Utils ===================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const gaussFn=r=>()=>{let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const G=gaussFn(Math.random);
const fmtP=(p,dp=2)=>isFinite(p)?p.toLocaleString('en-IN',{minimumFractionDigits:dp,maximumFractionDigits:dp}):'—';
const fmtN=n=>{if(!isFinite(n))return'—';const a=Math.abs(n);return a>=1e9?(n/1e9).toFixed(2)+'B':a>=1e7?(n/1e7).toFixed(2)+'Cr':a>=1e5?(n/1e5).toFixed(2)+'L':a>=1e3?(n/1e3).toFixed(1)+'K':n.toFixed(0)};
const pct=x=>(x>=0?'+':'−')+Math.abs(x).toFixed(2)+'%';
const cls=x=>x>=0?'up':'down';
function alpha(hex,a){hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');const n=parseInt(hex,16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg,type='',dur=3200){const el=document.createElement('div');el.className='toast '+type;el.textContent=msg;$('#toasts').prepend(el);setTimeout(()=>el.remove(),dur)}

/* ===================== NSE Symbols ===================== */

  s.chg=s.last-s.prev;s.chgPct=c0*100;
  s.dvol=s.vb*6.5*(0.8+r()*0.5);s.unit='shares';
});
const SYM=k=>NSE_SYMS.find(s=>s.s===k);
const TFS=[{k:'1m',sec:60},{k:'5m',sec:300},{k:'15m',sec:900},{k:'1H',sec:3600},{k:'4H',sec:14400},{k:'1D',sec:86400},{k:'1W',sec:604800}];

/* ===================== API Client ===================== */
const API_BASE=(()=>{
  const p=new URLSearchParams(location.search).get('api');
  if(p)return p.replace(/\/$/,'');
  if(location.protocol==='file:')return'https://rajantrading1.vercel.app';
  return'';
})();
const api={
  async get(path){try{const r=await fetch(API_BASE+path);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}catch(e){console.warn('[API]',path,e.message);return null}},
  async post(path,body){try{const r=await fetch(API_BASE+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return r.json()}catch(e){console.warn('[API POST]',path,e.message);return null}},
};

/* ===================== Upstox Direct API ===================== */
const UPSTOX_KEYS={
  NIFTY:'NSE_INDEX|Nifty 50',      BANKNIFTY:'NSE_INDEX|Nifty Bank',
  FINNIFTY:'NSE_INDEX|Nifty Fin Services', MIDCPNIFTY:'NSE_INDEX|NIFTY MID SELECT',
  SENSEX:'BSE_INDEX|SENSEX',
  RELIANCE:'NSE_EQ|INE002A01018',  TCS:'NSE_EQ|INE467B01029',
  INFY:'NSE_EQ|INE009A01021',      HDFCBANK:'NSE_EQ|INE040A01034',
  ICICIBANK:'NSE_EQ|INE090A01021', BAJFINANCE:'NSE_EQ|INE296A01024',
  WIPRO:'NSE_EQ|INE075A01022',     SBIN:'NSE_EQ|INE062A01020',
  ADANIENT:'NSE_EQ|INE423A01024',  TATAMOTORS:'NSE_EQ|INE155A01022',
  AXISBANK:'NSE_EQ|INE238A01034',  KOTAKBANK:'NSE_EQ|INE237A01028',
  MARUTI:'NSE_EQ|INE585B01010',    SUNPHARMA:'NSE_EQ|INE044A01036',
  TITAN:'NSE_EQ|INE280A01028',
};
// Upstox response keys use ':' separator (e.g. "NSE_INDEX:Nifty 50") vs '|' in requests
const UPSTOX_RKEYS=Object.fromEntries(Object.entries(UPSTOX_KEYS).map(([s,k])=>[k.replace('|',':'),s]));

const _DEFAULT_TOKEN=''; // credentials never live in client code - data comes from the server
const upstox={
  BASE:'https://api.upstox.com/v2',
  get token(){return localStorage.getItem('upstox_token')||_DEFAULT_TOKEN},
  set token(t){t?localStorage.setItem('upstox_token',t):localStorage.removeItem('upstox_token')},
  async call(path,params={}){
    if(!this.token)throw new Error('No token');
    const url=new URL(this.BASE+path);
    Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
    const r=await fetch(url,{headers:{Authorization:'Bearer '+this.token,Accept:'application/json'}});
    if(r.status===401){this.token='';updateTokenStatus();throw new Error('Token expired — please refresh')}
    if(!r.ok)throw new Error('Upstox HTTP '+r.status);
    const j=await r.json();
    if(j.status!=='success')throw new Error(j.errors?.[0]?.message||j.message||'Upstox error');
    return j.data;
  },
  async getLTP(syms){
    const keys=syms.map(s=>UPSTOX_KEYS[s]).filter(Boolean);
    if(!keys.length||!this.token)return{};
    return this.call('/market-quote/ltp',{instrument_key:keys.join(',')});
  },
  async getFullQuotes(syms){
    const keys=syms.map(s=>UPSTOX_KEYS[s]).filter(Boolean);
    if(!keys.length||!this.token)return{};
    return this.call('/market-quote/quotes',{instrument_key:keys.join(',')});
  },
  async getExpiries(sym){
    const key=UPSTOX_KEYS[sym];if(!key||!this.token)return[];
    return this.call('/option/chain/expiry-dates',{instrument_key:key});
  },
  async getOptionChain(sym,expiryDate){
    const key=UPSTOX_KEYS[sym];if(!key||!this.token)return[];
    return this.call('/option/chain',{instrument_key:key,expiry_date:expiryDate});
  },
  // Apply scan filter criteria to a raw Upstox option chain array
  filterChain(chain,sym,expiry,f){
    const out=[];
    for(const item of chain){
      const s=item.strike_price;
      const doSide=(opt,type)=>{
        if(!opt?.market_data)return;
        const md=opt.market_data;
        const ltp=md.ltp||0,low=md.low_price||ltp,prev=md.prev_close_price||0,vol=md.volume||0,oi=md.oi||0;
        if(f.optType!=='BOTH'&&type!==f.optType)return;
        if(f.lowOn&&(low<f.lowFrom||low>f.lowTo))return;
        if(f.prevOn&&prev>0&&(prev<f.prevFrom||prev>f.prevTo))return;
        if(f.minOi>0&&oi<f.minOi)return;
        out.push({symbol:sym,type,strike:s,expiry,ltp,close:ltp,low,prevClose:prev,
          vol,oi,high:md.high_price||0,open:md.open_price||0,
          chgPct:prev>0?(ltp/prev-1)*100:0});
      };
      doSide(item.call_options,'CE');
      doSide(item.put_options,'PE');
    }
    return out;
  },
};

function _pickExpiry(expiries,mode){
  if(!expiries?.length)return null;
  if(mode==='nearest')return expiries[0];
  // weekly = nearest Thursday (day 4); monthly = last Thursday of month
  const isThursday=e=>{const d=new Date(e);return d.getDay()===4};
  const isMonthlyExp=e=>{const d=new Date(e);if(d.getDay()!==4)return false;const nx=new Date(d);nx.setDate(d.getDate()+7);return nx.getMonth()!==d.getMonth()};
  if(mode==='monthly')return expiries.find(isMonthlyExp)||expiries[expiries.length-1];
  return expiries.find(isThursday)||expiries[0]; // weekly
}

/* ===================== Live Data ===================== */
const DATA={status:null,picks:null,global:null};

async function refreshData(){
  // 1. Backend market status (non-blocking — just for open/closed indicator)
  const sr=await api.get('/api/status').catch(()=>null);
  if(sr){
    DATA.status=sr;
    // Local deployment: indices{} with last prices; live deployment: just marketStatus string
    const idx=sr.indices||{};
    if(!upstox.token){
      for(const[k,d]of Object.entries(idx)){
        const nm=SYM(k);
        if(nm&&d&&d.last>0){
          nm.prev=nm.last;nm.last=d.last;nm.chg=d.change??nm.last-nm.prev;
          nm.chgPct=d.pct??nm.chg/nm.prev*100;
          nm.hi=Math.max(nm.hi||nm.last,nm.last);nm.lo=Math.min(nm.lo||nm.last,nm.last);
          delete CACHE[k+'|1H'];delete CACHE[k+'|1D'];
        }
      }
    }
    const mkt=sr.market||sr.marketStatus||sr.status||'';
    const open=/open/i.test(mkt);
    const dot=$('#mktDot'),txt=$('#mktTxt');
    if(dot){dot.classList.toggle('open',open);dot.querySelector('i').style.background=open?'var(--up)':'var(--text-3)'}
    if(txt){const date=sr.tradeDate?` · ${sr.tradeDate}`:'';txt.textContent=(open?'Market Open':'Market Closed')+date}
  }

  if(await pullQuotes()&&$('#v-markets.on'))renderMarkets();
  // 2. Upstox full quotes — live OHLC for all symbols
  if(upstox.token){
    try{
      const q=await upstox.getFullQuotes(NSE_SYMS.map(s=>s.s));
      for(const[k,d]of Object.entries(q)){
        const sym=UPSTOX_RKEYS[k];const nm=sym&&SYM(sym);
        if(!nm||!d)continue;
        const ltp=d.last_price||0,ohlc=d.ohlc||{};
        if(ltp>0){
          nm.last=ltp;
          // Upstox: net_change is reliable for indices; ohlc.close = prev day's close
          const prevClose=ohlc.close||0;
          nm.chg=d.net_change??((prevClose>0)?ltp-prevClose:0);
          nm.chgPct=prevClose>0?nm.chg/prevClose*100:0;
          nm.prev=prevClose>0?prevClose:(ohlc.open||ltp);
          nm.hi=ohlc.high||nm.hi;nm.lo=ohlc.low||nm.lo;
          delete CACHE[sym+'|1H'];delete CACHE[sym+'|1D'];
        }
      }
    }catch(e){console.warn('[Upstox quotes]',e.message);
      if(/expired|401/i.test(e.message))toast('Upstox token expired — update in Settings','bad')}
  }

  // 3. Calls/picks: try stock-picks backend → nothing
  if(!DATA.picks||!DATA.picks.length){
    const pr=await api.get('/api/stock-picks').catch(()=>null);
    if(pr){
      let arr=pr.picks||pr.recommendations||pr.calls||(Array.isArray(pr)?pr:null);
      if(!arr&&pr.results){arr=(pr.results||[]).filter(r=>r.match||r.ltp>0).map(r=>({
        instrument:pr.symbol||'NIFTY',
        contract:`${pr.symbol||'NIFTY'} ${r.strike} ${r.type==='CALL'?'CE':'PE'}`,
        signal:r.type==='CALL'?'BUY CALL':'BUY PUT',entry:r.ltp||0,
        target1:(r.ltp||0)*1.09,stopLoss:(r.ltp||0)*0.95,
        changePct:r.ltp&&r.open?(r.ltp/r.open-1)*100:0,timestamp:new Date().toISOString(),
      })).filter(r=>r.entry>0)}
      DATA.picks=arr||[];
    }
  }

/* ===================== Series / Cache ===================== */
const CACHE={};
function genSeries(sym,tf,n=480){
  const r=mulberry32(hash(sym.s+'|'+tf.k)),g=gaussFn(r),ms=tf.sec*1000;
  const sig=sym.vol*Math.sqrt(tf.sec/86400)*(tf.sec<86400?1.5:1),ph=r()*10;
  const rel=new Array(n),rets=new Array(n);rel[n-1]=1;
  for(let i=n-1;i>0;i--){const drift=sig*(0.24*Math.sin(i/41+ph)+0.12*Math.sin(i/13+ph*2));const ret=drift+sig*g();rets[i]=ret;rel[i-1]=rel[i]/(1+ret)}
  const P=sym.last,lastT=Math.floor(Date.now()/ms)*ms,out=[];
  for(let i=0;i<n;i++){const c=rel[i]*P,o=i?rel[i-1]*P*(1+sig*.06*g()):c*(1-sig*.3*g());
    out.push({t:lastT-(n-1-i)*ms,o,c,h:Math.max(o,c)*(1+Math.abs(g())*sig*.45),l:Math.min(o,c)*(1-Math.abs(g())*sig*.45),v:sym.vb*tf.sec/3600*(0.45+r()+Math.abs(rets[i]||0)/sig*.6)})}
  out[n-1].v*=.35;return out;
}
window.MKT_OPEN=false;const PENDING={};
function stubSeries(sym,tf){const ms=tf.sec*1000,t0=Math.floor(Date.now()/ms)*ms,P=sym.last||1,o=[];for(let i=60;i>=0;i--)o.push({t:t0-i*ms,o:P,h:P,l:P,c:P,v:0});return o}
async function fetchReal(sym,tf){const k=sym.s+'|'+tf.k;if(PENDING[k])return PENDING[k];
  return PENDING[k]=(async()=>{try{const r=await api.get((sym.ikey?'/api/m/candles?ikey='+encodeURIComponent(sym.ikey)+'&tf='+tf.k:sym.tv?'/api/m/gcandles?id='+encodeURIComponent(sym.tv)+'&tf='+tf.k:'/api/m/candles?symbol='+encodeURIComponent(sym.s)+'&tf='+tf.k));if(r&&r.bars&&r.bars.length){CACHE[k]=r.bars;CACHE[k]._real=1;CACHE[k]._ts=Date.now()}}catch(e){console.warn('candles',e)}finally{delete PENDING[k]}})()}
function syncSeries(s,sym,tf){const ms=tf.sec*1000,now=Date.now();let lb=s[s.length-1];if(!window.MKT_OPEN||!s._real)return s;
  if(now-lb.t>ms*3){if(now-(s._ts||0)>20000){s._ts=now;fetchReal(sym,tf).then(()=>{if(CHART&&ACTIVE.sym===sym&&ACTIVE.tf===tf)CHART.setData(getSeries(sym,tf),sym,tf,true)})}return s}
  if(tf.sec<86400)while(now>=lb.t+ms){const nb={t:lb.t+ms,o:lb.c,h:lb.c,l:lb.c,c:lb.c,v:0};s.push(nb);if(s.length>1200)s.shift();lb=nb}
  lb.c=sym.last;lb.h=Math.max(lb.h,lb.c);lb.l=Math.min(lb.l,lb.c);return s}
function getSeries(sym,tf){const k=sym.s+'|'+tf.k;
  if(!CACHE[k]||!CACHE[k]._real){fetchReal(sym,tf).then(()=>{if(CHART&&ACTIVE.sym===sym&&ACTIVE.tf===tf&&CACHE[k]&&CACHE[k]._real)CHART.setData(getSeries(sym,tf),sym,tf,false)});return stubSeries(sym,tf)}
  return syncSeries(CACHE[k],sym,tf)}
async function pullQuotes(){try{const r=await api.get('/api/m/quotes?symbols='+NSE_SYMS.map(s=>s.s).join(','));window.MKT_OPEN=!!r.marketOpen;
  for(const x of r.quotes||[]){const nm=SYM(x.s);if(!nm||!(x.last>0))continue;nm.last=x.last;nm.prev=x.prev>0?x.prev:nm.prev;nm.chg=nm.last-nm.prev;nm.chgPct=nm.prev?nm.chg/nm.prev*100:0;nm.hi=x.high||nm.last;nm.lo=x.low||nm.last;nm.open=x.open||nm.open;if(x.vol)nm.dvol=x.vol}
  window.LIVE_OK=true;return true}catch(e){console.warn('quotes',e);return false}}

/* ===================== Indicator math ===================== */
const NA=n=>new Array(n).fill(NaN);
const C=d=>d.map(b=>b.c),Hh=d=>d.map(b=>b.h),Ll=d=>d.map(b=>b.l),Vv=d=>d.map(b=>b.v);
function sma(a,n){const o=NA(a.length);let s=0,k=0;for(let i=0;i<a.length;i++){if(isFinite(a[i])){s+=a[i];k++}if(i>=n&&isFinite(a[i-n])){s-=a[i-n];k--}if(k===n)o[i]=s/n}return o}
function emaA(a,n,al){const o=NA(a.length);let p=NaN,s=0,k=0;for(let i=0;i<a.length;i++){const v=a[i];if(!isFinite(v))continue;if(isNaN(p)){s+=v;k++;if(k===n){p=s/n;o[i]=p}}else{p=v*al+p*(1-al);o[i]=p}}return o}
const ema=(a,n)=>emaA(a,n,2/(n+1)),rma=(a,n)=>emaA(a,n,1/n);
function stdev(a,n,m){const o=NA(a.length);for(let i=n-1;i<a.length;i++){let s=0;for(let j=0;j<n;j++)s+=(a[i-j]-m[i])**2;o[i]=Math.sqrt(s/n)}return o}
function hhv(a,n){const o=NA(a.length);for(let i=n-1;i<a.length;i++){let m=-Infinity;for(let j=0;j<n;j++)m=Math.max(m,a[i-j]);o[i]=m}return o}
function llv(a,n){const o=NA(a.length);for(let i=n-1;i<a.length;i++){let m=Infinity;for(let j=0;j<n;j++)m=Math.min(m,a[i-j]);o[i]=m}return o}
const trA=d=>d.map((b,i)=>i?Math.max(b.h-b.l,Math.abs(b.h-d[i-1].c),Math.abs(b.l-d[i-1].c)):b.h-b.l);
const atr=(d,n)=>rma(trA(d),n);
const zip=(a,b,f)=>a.map((v,i)=>f(v,b[i]));
function rsi(c,n){const o=NA(c.length);let g=0,l=0;for(let i=1;i<c.length;i++){const ch=c[i]-c[i-1],u=Math.max(ch,0),dn=Math.max(-ch,0);if(i<=n){g+=u;l+=dn;if(i===n){g/=n;l/=n;o[i]=l===0?100:100-100/(1+g/l)}}else{g=(g*(n-1)+u)/n;l=(l*(n-1)+dn)/n;o[i]=l===0?100:100-100/(1+g/l)}}return o}
function psar(d,st,mx){const o=NA(d.length);if(d.length<3)return o;let up=true,af=st,ep=d[0].h,sar=d[0].l;
  for(let i=1;i<d.length;i++){sar=sar+af*(ep-sar);const p1=d[i-1],p2=d[Math.max(0,i-2)];
    if(up){sar=Math.min(sar,p1.l,p2.l);if(d[i].l<sar){up=false;sar=ep;ep=d[i].l;af=st}else if(d[i].h>ep){ep=d[i].h;af=Math.min(af+st,mx)}}
    else{sar=Math.max(sar,p1.h,p2.h);if(d[i].h>sar){up=true;sar=ep;ep=d[i].h;af=st}else if(d[i].l<ep){ep=d[i].l;af=Math.min(af+st,mx)}}}return o}

const DEFS={
  vol:{name:'Volume',short:'Vol',pane:'vol',params:[],lines:[{k:'v',style:'vol'}],calc:d=>({v:Vv(d)}),fmt:'n'},
  ema:{name:'EMA',short:'EMA',pane:'main',params:[{k:'len',l:'Length',v:21,min:1,max:400}],lines:[{k:'v'}],calc:(d,p)=>({v:ema(C(d),p.len)})},
  sma:{name:'SMA',short:'SMA',pane:'main',params:[{k:'len',l:'Length',v:20,min:1,max:400}],lines:[{k:'v'}],calc:(d,p)=>({v:sma(C(d),p.len)})},
  bb:{name:'Bollinger Bands',short:'BB',pane:'main',params:[{k:'len',l:'Length',v:20,min:2,max:200},{k:'mult',l:'Std.dev',v:2,min:.5,max:5,step:.1}],lines:[{k:'up'},{k:'mid'},{k:'lo'}],fill:['up','lo'],

function renderTicker(){
  const el=$('#ticker');if(!el)return;
  const IDX=['NIFTY','BANKNIFTY','FINNIFTY','MIDCPNIFTY','SENSEX'];
  let html='';
  for(const sym of IDX){const s=SYM(sym);if(!s||!window.LIVE_OK)continue;
    html+=`<button class="tk-chip" onclick="selectSymAndSwitch('${sym}')"><b>${esc(sym)}</b><span class="${cls(s.chg)}">${fmtP(s.last,s.dp)}</span><span class="${cls(s.chg)}">${s.chg>=0?'+':''}${fmtP(s.chg,s.dp)} (${Math.abs(s.chgPct).toFixed(2)}%)</span></button><div class="tk-sep"></div>`}
  const g=DATA.global;
  if(g){html+='<div class="tk-sep" style="margin:0 8px;height:20px"></div>';
    const comms=(g.commodities||[]).filter(c=>c.available&&c.price!==null).slice(0,5);
    for(const c of comms){const chg=c.chg||0;
      html+=`<${c.chart===false?'div':'button'} class="tk-chip" ${c.chart===false?'':`onclick="openGlobalChart('${esc(c.id)}')"`}><b>${esc(c.name||c.id)}</b><span class="${cls(chg)}">${esc(c.priceFormatted||fmtP(c.price,2))}</span><span class="${cls(chg)}">${chg>=0?'+':''}${(c.chgPct||0).toFixed(2)}%</span></${c.chart===false?'div':'button'}><div class="tk-sep"></div>`}
    // legacy flat format fallback
    if(!comms.length)for(const[k,d]of Object.entries(g).slice(0,5)){if(!d||!d.last)continue;const chg=d.change||d.chg||0;
      html+=`<div class="tk-chip"><b>${esc(d.name||k)}</b><span class="${cls(chg)}">${fmtP(d.last,2)}</span><span class="${cls(chg)}">${chg>=0?'+':''}${fmtP(chg,2)}</span></div><div class="tk-sep"></div>`}}
  el.innerHTML=html}

/* ===================== Calls: filter (stocks / index) + pagination ===================== */
const CALLS={kind:'ALL',dir:'ALL',inst:'ALL',idx:[],page:0,size:10};
const callInst=p=>/CALL|PUT/i.test(p.signal||'')?'OPT':'FUT';
const CALL_INDEX=new Set(['NIFTY','BANKNIFTY','FINNIFTY','MIDCPNIFTY','SENSEX','NIFTYNXT50','INDIAVIX']);
const callDir=p=>{const g=String(p.signal||'').toUpperCase();
  if(/^SELL/.test(g)||/BEAR/.test(g))return'SELL';
  if(/^BUY/.test(g)||/BULL/.test(g))return'BUY';
  return'WATCH'};
/* market view of an idea: BUY CALL / SELL PUT / BUY are bullish; BUY PUT / SELL CALL / SELL are bearish */
const callView=p=>{const g=String(p.signal||'').toUpperCase();
  if(/BUY CALL|SELL PUT|^BUY$|BULL/.test(g))return'BULL';
  if(/BUY PUT|SELL CALL|^SELL$|BEAR/.test(g))return'BEAR';
  return'FLAT'};
const callKind=p=>CALL_INDEX.has(String(p.instrument||p.symbol||'').toUpperCase())?'INDEX':'STOCK';
function callsBlock(all){
  const nI=all.filter(p=>callKind(p)==='INDEX').length,nS=all.length-nI;
  let byKind=CALLS.kind==='ALL'?all:all.filter(p=>callKind(p)===CALLS.kind);
  if(CALLS.kind!=='INDEX'&&CALLS.inst!=='ALL')byKind=byKind.filter(p=>CALL_INDEX.has(String(p.instrument||p.symbol||'').toUpperCase())||callInst(p)===CALLS.inst);
  if(CALLS.kind==='INDEX'&&CALLS.idx.length)byKind=byKind.filter(p=>CALLS.idx.includes(String(p.instrument||p.symbol||'').toUpperCase()));
  const nB=byKind.filter(p=>callDir(p)==='BUY').length,nSe=byKind.filter(p=>callDir(p)==='SELL').length;
  const list=CALLS.dir==='ALL'?byKind:byKind.filter(p=>callDir(p)===CALLS.dir);
  const size=CALLS.size,pages=Math.max(1,Math.ceil(list.length/size));CALLS.page=Math.min(CALLS.page,pages-1);
  const pg=CALLS.page,part=list.slice(pg*size,(pg+1)*size);
  const chip=(k,l,n)=>`<button class="chip ${CALLS.kind===k?'on':''}" onclick="callsSet('kind','${k}')">${l} <span class="muted">${n}</span></button>`;
  const nums=[];for(let k=0;k<pages;k++){if(k===0||k===pages-1||Math.abs(k-pg)<=1)nums.push(k);else if(nums[nums.length-1]!==-1)nums.push(-1)}
  const pager=list.length>size?`<div class="scan-pager"><span class="muted">Showing ${pg*size+1}–${pg*size+part.length} of ${list.length}</span>
    <div class="scan-pg"><button class="btn sm" ${pg<=0?'disabled':''} onclick="callsSet('page',${pg-1})">‹ Prev</button>${nums.map(k=>k<0?'<span class="muted">…</span>':`<button class="btn sm ${k===pg?'pri':''}" onclick="callsSet('page',${k})">${k+1}</button>`).join('')}<button class="btn sm" ${pg>=pages-1?'disabled':''} onclick="callsSet('page',${pg+1})">Next ›</button></div>
    <label class="muted" style="font-size:12px">Per page <select class="sel" onchange="callsSet('size',this.value)">${[5,10,20,50].map(n=>`<option ${n===size?'selected':''}>${n}</option>`).join('')}</select></label></div>`:'';
  const dchip=(k,l,n)=>`<button class="chip ${CALLS.dir===k?'on':''}" onclick="callsSet('dir','${k}')">${l} <span class="muted">${n}</span></button>`;
  return`<div class="scan-ind" style="margin:0 0 6px">${chip('ALL','All',all.length)}${chip('STOCK','Stocks',nS)}${chip('INDEX','Index',nI)}</div>
    ${CALLS.kind==='INDEX'?`<div class="scan-ind" style="margin:0 0 6px"><button class="chip ${CALLS.idx.length?'':'on'}" onclick="callsSet('idx','')">All indices</button>${['NIFTY','BANKNIFTY','FINNIFTY','SENSEX','MIDCPNIFTY'].map(k=>`<button class="chip ${CALLS.idx.includes(k)?'on':''}" onclick="callsSet('idx','${k}')">${k}</button>`).join('')}</div>`:''}
    ${CALLS.kind==='STOCK'?`<div class="scan-ind" style="margin:0 0 6px"><span class="muted">Show</span>${[['ALL','Everything'],['OPT','Stock CE / PE'],['FUT','Futures ideas']].map(([k,l])=>`<button class="chip ${CALLS.inst===k?'on':''}" onclick="callsSet('inst','${k}')">${l}</button>`).join('')}</div>`:''}
    <div class="scan-ind" style="margin:0 0 10px">${dchip('ALL','Buy + Sell',byKind.length)}${dchip('BUY','Buy',nB)}${dchip('SELL','Sell',nSe)}</div>
    ${part.length?`<div class="calls-grid">${part.map(renderCallCard).join('')}</div>`:`<div class="empty" style="padding:24px">No ${CALLS.dir==='SELL'?'sell':CALLS.dir==='BUY'?'buy':''} ${CALLS.kind==='INDEX'?'index':CALLS.kind==='STOCK'?'stock':''} calls right now.</div>`}${pager}`}

  if($('#v-markets.on'))renderMarkets();else renderCalls()}

  const stocks=(DATA.picks||[]).filter(p=>!CALL_INDEX.has(String(p.instrument||p.symbol||'').toUpperCase())&&/^(BUY|SELL)/i.test(p.signal||'')&&!/CALL|PUT/i.test(p.signal||''));

  const view={};stocks.forEach(p=>{view[String(p.instrument||p.symbol).toUpperCase()]=/^BUY/i.test(p.signal)?'BULL':'BEAR'});
  const syms=Object.keys(view).slice(0,20);
  const d=await api.post('/api/scan/batch',{symbols:syms,instIdx:false,instStk:true,optType:'BOTH',expSelect:'nearest',lowOn:false,prevOn:false,minOi:0,tol:0,includeUntraded:false,showMode:'matches'});
  const by={};for(const r of (d&&d.results)||[]){(by[String(r.symbol).toUpperCase()]||(by[String(r.symbol).toUpperCase()]=[])).push(r)}
  const out=[];
  for(const sym of syms){
    const rs=by[sym];if(!rs||!rs.length)continue;
    const spot=rs.find(r=>r.spot>0)?.spot||0;if(!spot)continue;
    const exp=rs.map(r=>r.expiry).sort()[0],ce=rs.filter(r=>r.type==='CE'&&r.expiry===exp&&(r.ltp||r.close)>0),pe=rs.filter(r=>r.type==='PE'&&r.expiry===exp&&(r.ltp||r.close)>0);
    const near=(a)=>a.slice().sort((x,y)=>Math.abs(x.strike-spot)-Math.abs(y.strike-spot))[0];
    const above=a=>a.filter(r=>r.strike>spot).sort((x,y)=>x.strike-y.strike)[0],below=a=>a.filter(r=>r.strike<spot).sort((x,y)=>y.strike-x.strike)[0];
    const mk=(r,signal,t,sl)=>{const l=r.ltp||r.close||0,pv=r.prevCloseUsed||r.prevClose||0;return{instrument:sym,contract:`${sym} ${r.strike} ${r.type}`,signal,entry:l,target1:+(l*t).toFixed(2),stopLoss:+(l*sl).toFixed(2),
      changePct:pv>0?(l/pv-1)*100:0,expiryTag:r.expiry,instrumentKey:r.instrumentKey,timestamp:new Date().toISOString()}};
    if(view[sym]==='BULL'){const a=near(ce),w=below(pe);if(a)out.push(mk(a,'BUY CALL',1.10,0.92));if(w)out.push(mk(w,'SELL PUT',0.7,1.3))}
    else{const a=near(pe),w=above(ce);if(a)out.push(mk(a,'BUY PUT',1.10,0.92));if(w)out.push(mk(w,'SELL CALL',0.7,1.3))}
  }
  DATA.picks=[...(DATA.picks||[]),...out];
}

/* Index calls: built from each index's live option chain (put/call volume share decides the side). */
async function addIndexCalls(){
  const have=(DATA.picks||[]).some(p=>CALL_INDEX.has(String(p.instrument||p.symbol||'').toUpperCase()));
  if(have)return;
  const out=[];
  await Promise.all(['NIFTY','BANKNIFTY','FINNIFTY','MIDCPNIFTY','SENSEX'].map(async sym=>{
    try{
      const bk=await api.get(`/api/live/chain?symbol=${sym}`).catch(()=>null);
      if(!bk||!bk.rows||!bk.rows.length)return;
      const rows=bk.rows,spot=bk.spot||0;
      const totCE=rows.reduce((a,r)=>a+(r.ce?.vol||0),0),totPE=rows.reduce((a,r)=>a+(r.pe?.vol||0),0);
      const pcr=totCE>0?totPE/totCE:1,isCall=!(pcr>1.25);
      const atm=rows.reduce((b,r)=>Math.abs(r.strike-spot)<Math.abs(b.strike-spot)?r:b,rows[0]);
      const ai=rows.indexOf(atm);
      const pick=isCall?rows.slice(ai,ai+2):rows.slice(Math.max(0,ai-1),ai+1);
      const writeRow=isCall?rows[Math.max(0,ai-1)]:rows[Math.min(rows.length-1,ai+1)];
      const wl=writeRow&&(isCall?writeRow.pe:writeRow.ce),wltp=wl?(wl.ltp||wl.close||0):0;
      if(wl&&wltp>=0.5)out.push({instrument:sym,contract:`${sym} ${writeRow.strike} ${isCall?'PE':'CE'}`,signal:isCall?'SELL PUT':'SELL CALL',entry:wltp,
        target1:+(wltp*0.7).toFixed(2),stopLoss:+(wltp*1.3).toFixed(2),changePct:wl.prevClose>0?(wltp/wl.prevClose-1)*100:0,
        instrumentKey:wl.instrumentKey,expiryTag:bk.expiry||'',timestamp:new Date().toISOString()});
      for(const row of pick){
        const leg=isCall?row.ce:row.pe;if(!leg)continue;
        const ltp=leg.ltp||leg.close||0;if(ltp<0.5)continue;
        const prev=leg.prevClose||0;
        out.push({instrument:sym,contract:`${sym} ${row.strike} ${isCall?'CE':'PE'}`,signal:isCall?'BUY CALL':'BUY PUT',entry:ltp,
          target1:+(ltp*1.10).toFixed(2),stopLoss:+(ltp*0.92).toFixed(2),changePct:prev>0?(ltp/prev-1)*100:0,
          instrumentKey:leg.instrumentKey,expiryTag:bk.expiry||'',timestamp:new Date().toISOString()});
      }
    }catch(e){console.warn('[Index calls]',sym,e.message)}
  }));
  DATA.picks=[...out,...(DATA.picks||[])];
}

async function renderCalls(){
  const el=$('#v-calls');if(!el)return;
  let picks=(DATA.picks||[]).filter(p=>p.signal&&p.signal!=='NO SIGNAL');
  // If no picks yet, scan Upstox near-ATM strikes for NIFTY/BANKNIFTY/FINNIFTY
  if(!picks.length){
    el.innerHTML=`<div class="page"><div class="page-h"><h1>F&amp;O Calls</h1></div><div class="card"><div class="empty">${I('bolt',22)}<div style="margin-top:10px">Scanning option chains…</div></div></div></div>`;
    const SYMS_TO_SCAN=['NIFTY','BANKNIFTY','FINNIFTY'];
    const all=[];
    for(const sym of SYMS_TO_SCAN){
      try{
        // Try Upstox direct first, then backend
        let upRows=null,spot=0,expiry='';
        if(upstox.token){
          try{
            const expiries=await upstox.getExpiries(sym);
            if(expiries&&expiries.length){
              expiry=_pickExpiry(expiries,'nearest');
              const chain=await upstox.getOptionChain(sym,expiry);
              if(chain&&chain.length){
                spot=chain.find(r=>r.underlying_spot_price>0)?.underlying_spot_price||0;
                // convert to flat rows format
                upRows=chain.map(r=>({
                  strike:r.strike_price,
                  ce:r.call_options?.market_data?{ltp:r.call_options.market_data.ltp||0,vol:r.call_options.market_data.volume||0,prev:r.call_options.market_data.prev_close_price||0}:null,
                  pe:r.put_options?.market_data?{ltp:r.put_options.market_data.ltp||0,vol:r.put_options.market_data.volume||0,prev:r.put_options.market_data.prev_close_price||0}:null,
                }));
              }
            }
          }catch(e2){console.warn('[Calls Upstox]',sym,e2.message)}
        }
        // Backend fallback
        if(!upRows){
          const bk=await api.get(`/api/live/chain?symbol=${sym}`).catch(()=>null);
          if(bk&&bk.rows&&bk.rows.length){
            spot=bk.spot||0;expiry=bk.expiry||'';
            upRows=bk.rows.map(r=>({
              strike:r.strike,
              ce:r.ce?{ltp:r.ce.ltp||r.ce.close||0,vol:r.ce.vol||0,prev:r.ce.close||0}:null,
              pe:r.pe?{ltp:r.pe.ltp||r.pe.close||0,vol:r.pe.vol||0,prev:r.pe.close||0}:null,
            }));
          }
        }
        if(!upRows||!upRows.length)continue;
        // PCR & signal
        const totCE=upRows.reduce((s,r)=>s+(r.ce?.vol||0),0);
        const totPE=upRows.reduce((s,r)=>s+(r.pe?.vol||0),0);
        const pcr=totCE>0?totPE/totCE:1;
        const signal=pcr>1.25?'BUY PUT':'BUY CALL';
        const isCall=signal==='BUY CALL';
        // ATM + 1 OTM strike
        const atm=upRows.reduce((b,r)=>Math.abs(r.strike-spot)<Math.abs(b.strike-spot)?r:b,upRows[0]);
        const ai=upRows.indexOf(atm);
        const rows=upRows.slice(Math.max(0,ai-(isCall?0:1)),ai+(isCall?2:1));
        for(const row of rows){
          const md=isCall?row.ce:row.pe;
          const ltp=md?.ltp||0;if(ltp<0.5)continue;
          const optType=isCall?'CE':'PE';
          const prev=md?.prev||0;
          all.push({
            instrument:sym,contract:`${sym} ${row.strike} ${optType}`,
            signal,entry:ltp,target1:+(ltp*1.10).toFixed(2),stopLoss:+(ltp*0.92).toFixed(2),
            changePct:prev>0?(ltp/prev-1)*100:0,expiryTag:expiry,timestamp:new Date().toISOString(),
          });
        }
      }catch(e){console.warn('[Calls]',sym,e.message);}
    }
    picks=all;DATA.picks=all;
  }
  el.innerHTML=`<div class="page"><div class="page-h"><h1>F&amp;O Calls</h1>
    <button class="btn sm" onclick="DATA.picks=null;renderCalls()">${I('refresh',14)} Refresh</button></div>
    ${picks.length?callsBlock(picks):`<div class="card"><div class="empty">${I('bolt',22)}<div style="margin-top:10px">No matching calls right now.<br><button class="btn sm pri" style="margin-top:8px" onclick="DATA.picks=null;renderCalls()">Retry</button></div></div></div>`}
  </div>`}

function scanIdx(k){
  if(!k)scanState.idxSel=[];
  else{const i=scanState.idxSel.indexOf(k);if(i>=0)scanState.idxSel.splice(i,1);else scanState.idxSel.push(k)}
  scanState.page=0;
  const ran=scanState.ran;
  const missing=ran&&scanState.idxSel.length&&scanState.idxSel.some(x=>!(ran.idx&&(!ran.idxList.length||ran.idxList.includes(x))));
  renderScanner();
  if(missing)toast('Press Scan Market to load the newly selected index','info')}
function scanKind(k){
  const key=k==='idx'?'inclIdx':'inclStk',other=k==='idx'?'inclStk':'inclIdx';
  if(scanState[key]&&!scanState[other]){toast('Keep at least one selected','info');return}
  scanState[key]=!scanState[key];scanState.page=0;
  const needs=scanState.ran&&((scanState.inclIdx&&!scanState.ran.idx)||(scanState.inclStk&&!scanState.ran.stk));
  if(!scanState.rows.length&&!needs){renderScanner();return}
  renderScanner();
  if(needs)toast('Press Scan Market to include the newly selected group','info')}
function scanPage(n){scanState.page=Math.max(0,n);renderScanResults();$('#scanResults')?.scrollIntoView({block:'start'})}
function scanSize(n){scanState.size=+n;try{localStorage.setItem('scan-size',n)}catch(e){}scanState.page=0;renderScanResults()}

async function runScan(){
  if(scanState.running)return;
  scanState.running=true;scanState.rows=[];scanState.page=0;scanState.meta={done:0,total:0,scanned:0,contracts:0,failed:[]};
  const btn=$('#scanBtn');if(btn){btn.disabled=true;btn.innerHTML=`${I('refresh',14)} Scanning…`}
  const err=$('#scanErr');if(err)err.classList.remove('show');
  const st=SCAN_STRATS[scanState.strat]||SCAN_STRATS.all_traded;
  const base={instIdx:true,instStk:true,optType:scanState.optType,expSelect:scanState.expSelect,...st,tol:0,includeUntraded:false,showMode:'matches',indicator:scanState.ind||null};
  if(!scanState.uni)await loadScanUniverse();
  const U=scanState.uni||{indices:['NIFTY','BANKNIFTY','FINNIFTY','MIDCPNIFTY'],stocks:NSE_SYMS.filter(x=>x.cls==='Stocks')};
  let list=scanState.sym==='__ALL__'?[...(scanState.inclIdx?(scanState.idxSel.length?scanState.idxSel:U.indices.filter(x=>x!=='INDIAVIX')):[]),...(scanState.inclStk?U.stocks.map(x=>x.s):[])]:[scanState.sym];
  scanState.ran={idxList:scanState.idxSel.slice(),idx:scanState.sym==='__ALL__'?scanState.inclIdx:true,stk:scanState.sym==='__ALL__'?scanState.inclStk:true};
  const M=scanState.meta;M.total=list.length;let lastErr='';
  const seen=new Set();
  const runBatch=async(b)=>{try{const d=await api.post('/api/scan/batch',{...base,symbols:b});if(!d)throw new Error('no response');if(d.error)lastErr=d.error;
      for(const r of d.results||[]){const k=r.instrumentKey||(r.symbol+r.strike+r.type+r.expiry);if(seen.has(k))continue;seen.add(k);scanState.rows.push(r)}
      M.contracts+=d.totalContracts||0;const bad=new Set(d.failed||[]);M.scanned+=b.length-bad.size;M.done+=b.length-bad.size;return [...bad]}catch(e){lastErr=e.message;return b}};
  for(let round=0;round<3&&list.length;round++){
    const batches=[];for(let k=0;k<list.length;k+=10)batches.push(list.slice(k,k+10));
    const failed=[];let next=0;
    const worker=async()=>{while(next<batches.length){const b=batches[next++];failed.push(...await runBatch(b));
      if($('#v-scanner.on')){renderScanResults()}}};
    await Promise.all([worker(),worker()]);
    list=failed;if(list.length)await new Promise(r=>setTimeout(r,1500));}
  M.failed=list;scanState.running=false;
  if(btn){btn.disabled=false;btn.innerHTML=`${I('scan',14)} Scan Market`}
  if(err&&lastErr&&!M.scanned){err.textContent=lastErr;err.classList.add('show')}
  scanState.rows.sort((a,b)=>String(a.symbol).localeCompare(b.symbol)||a.strike-b.strike);
  renderScanResults()}

async function loadOptionChain(sym){
  const btab=$('#chartBbody'),panel=$('#chainPanel');
  if(btab)btab.innerHTML=`<div class="empty" style="padding:16px;font-size:12px">Loading chain for ${esc(sym)}…</div>`;

  // ── Primary: Upstox API directly ──────────────────────────────────────────
  if(upstox.token){
    try{
      const expiries=await upstox.getExpiries(sym);
      if(expiries&&expiries.length){
        const expiry=expiries[0]; // nearest
        const chain=await upstox.getOptionChain(sym,expiry);
        if(chain&&chain.length){
          const spot=chain[0]?.underlying_spot_price||0;
          const rows=chain.map(item=>({
            strike:item.strike_price,
            ce:item.call_options?.market_data?{
              close:item.call_options.market_data.ltp||0,ltp:item.call_options.market_data.ltp||0,
              vol:item.call_options.market_data.volume||0,oi:item.call_options.market_data.oi||0,
              chgPct:item.call_options.market_data.prev_close_price>0
                ?(item.call_options.market_data.ltp/item.call_options.market_data.prev_close_price-1)*100:0
            }:null,
            pe:item.put_options?.market_data?{
              close:item.put_options.market_data.ltp||0,ltp:item.put_options.market_data.ltp||0,
              vol:item.put_options.market_data.volume||0,oi:item.put_options.market_data.oi||0,
              chgPct:item.put_options.market_data.prev_close_price>0
                ?(item.put_options.market_data.ltp/item.put_options.market_data.prev_close_price-1)*100:0
            }:null,
          }));
          const atmStrike=spot>0?rows.reduce((a,b)=>Math.abs(a.strike-spot)<Math.abs(b.strike-spot)?a:b).strike:rows[Math.floor(rows.length/2)]?.strike;
          const atmIdx=rows.findIndex(r=>r.strike===atmStrike);
          const sliced=rows.slice(Math.max(0,atmIdx-18),atmIdx+19);
          const ceVol=sliced.reduce((s,r)=>s+(r.ce?.vol||0),0);
          const peVol=sliced.reduce((s,r)=>s+(r.pe?.vol||0),0);
          const tot=ceVol+peVol||1;const cp=Math.round(ceVol/tot*100);
          _renderChainData({rows:sliced,spot,atmStrike,expiry,provider:'Upstox Live',allExpiries:expiries,
            volumeShare:{callPct:cp,putPct:100-cp,sentiment:cp>=60?'BULLISH':cp<=40?'BEARISH':'NEUTRAL'}},btab,panel);
          return;
        }
      }
    }catch(e){console.warn('[Upstox chain]',e.message)}
  }

  // ── Fallback: backend chain APIs ──────────────────────────────────────────
  let data=await api.get(`/api/live/chain?symbol=${sym}`).catch(()=>null)
           ||await api.get(`/api/chain?symbol=${sym}`).catch(()=>null);
  if(!data?.rows){
    const scan=await api.get(`/api/live/scan?symbol=${sym}&optType=BOTH&expSelect=nearest&lowOn=false&prevOn=false&minOi=0&includeUntraded=false`).catch(()=>null);
    if(scan?.results?.length){
      const map={};
      for(const r of scan.results){
        const k=r.strike;if(!map[k])map[k]={strike:k,ce:null,pe:null};
        const side=(r.type==='CALL'||r.type==='CE')?'ce':'pe';
        map[k][side]={close:r.ltp||0,ltp:r.ltp||0,vol:r.volume||0,oi:r.oi||0,chgPct:r.open&&r.ltp?(r.ltp/r.open-1)*100:0};
      }
      const sorted=Object.values(map).sort((a,b)=>a.strike-b.strike);
      const midIdx=Math.floor(sorted.length/2),ATM_WIN=14;
      const rows=sorted.slice(Math.max(0,midIdx-ATM_WIN),midIdx+ATM_WIN+1);
      const ceV=rows.reduce((s,r)=>s+(r.ce?.vol||0),0),peV=rows.reduce((s,r)=>s+(r.pe?.vol||0),0),tot=ceV+peV||1;
      const cp=Math.round(ceV/tot*100);
      data={rows,spot:0,atmStrike:sorted[midIdx]?.strike||0,expiry:scan.targetExpiry||'',provider:'Backend',
        volumeShare:{callPct:cp,putPct:100-cp,sentiment:cp>=60?'BULLISH':cp<=40?'BEARISH':'NEUTRAL'}};
    }
  }
  _renderChainData(data,btab,panel);}

/* ===================== Paper Trading ===================== */
const PORT={cash:100000,positions:[],orders:[]};
(()=>{try{const d=JSON.parse(localStorage.getItem('rajan_port')||'{}');if(d.cash)PORT.cash=d.cash;if(d.positions)PORT.positions=d.positions;if(d.orders)PORT.orders=d.orders}catch(e){}})();
function savePORT(){try{localStorage.setItem('rajan_port',JSON.stringify(PORT))}catch(e){}}
function portPnl(sym){const pos=PORT.positions.find(p=>p.sym===sym);if(!pos)return 0;const s=SYM(sym);return s?(s.last-pos.avgPrice)*pos.qty:0}
function buildOrderLines(sym){
  const pos=PORT.positions.find(p=>p.sym===sym);
  if(!pos)return[];
  return[{price:pos.avgPrice,label:'Avg ₹'+fmtP(pos.avgPrice),color:'#f97316',drag:false}]}

function buildTicket(){
  const el=$('#ticket');if(!el)return;
  const s=ACTIVE.sym;
  const pos=PORT.positions.find(p=>p.sym===s?.s);
  el.innerHTML=`<div class="tk-h"><b>Order — ${esc(s?.s||'—')}</b></div>
    <div class="side-seg"><button class="buy on" id="tkBuy" onclick="tkSide('BUY')">BUY</button><button class="sell" id="tkSell" onclick="tkSide('SELL')">SELL</button></div>
    <div class="fld"><label>Qty (shares)</label><input class="inp" id="tkQty" type="number" min="1" value="1"></div>
    <div class="fld"><label>Price <span class="muted">(market)</span></label><div class="inp-w"><input class="inp" id="tkPx" type="number" step="0.05" value="${s?.last?.toFixed(2)||0}"><span class="suf">₹</span></div></div>
    ${pos?`<div class="sum"><div><span>Position</span><b>${pos.qty} shares @ ₹${fmtP(pos.avgPrice)}</b></div><div><span>P&amp;L</span><b class="${cls(portPnl(s.s))}">${portPnl(s.s)>=0?'+':''}₹${fmtP(Math.abs(portPnl(s.s)))}</b></div></div>`:''}
    <div class="sum"><div><span>Cash</span><b>₹${fmtP(PORT.cash)}</b></div></div>
    <div class="tk-msg err" id="tkMsg"></div>
    <button class="go buy" id="tkGo" onclick="placeOrder()">Place BUY Order</button>`;
  const tkBuy=$('#tkBuy'),tkSell=$('#tkSell'),tkGo=$('#tkGo');
  tkBuy._side='BUY';tkSell._side='SELL';}

let _tkSide='BUY';
function tkSide(side){_tkSide=side;const b=$('#tkBuy'),s=$('#tkSell'),g=$('#tkGo');
  if(b){b.className='buy'+(side==='BUY'?' on':'');s.className='sell'+(side==='SELL'?' on':'');}
  if(g){g.className='go '+side.toLowerCase();g.textContent='Place '+side+' Order'}}

function placeOrder(){
  if(ACTIVE.sym&&ACTIVE.sym.ikey){toast('Option premium charts are view-only here. Paper trading works on NSE symbols.','bad');return}
  if(ACTIVE.sym&&ACTIVE.sym.tv){toast('Global instruments are chart-only. Paper trading works on NSE symbols.','bad');return}
  const sym=ACTIVE.sym?.s;const s=SYM(sym);if(!s)return;
  const qty=parseInt($('#tkQty')?.value||'0');
  const price=parseFloat($('#tkPx')?.value||s.last);
  const msg=$('#tkMsg');
  if(qty<1){if(msg){msg.className='tk-msg err';msg.textContent='Qty must be ≥ 1'}return}
  if(_tkSide==='BUY'&&price*qty>PORT.cash){if(msg){msg.className='tk-msg err';msg.textContent='Insufficient cash: need ₹'+fmtP(price*qty)}return}
  if(_tkSide==='SELL'){const pos=PORT.positions.find(p=>p.sym===sym);if(!pos||pos.qty<qty){if(msg){msg.className='tk-msg err';msg.textContent='Insufficient shares'}return}}
  if(msg)msg.className='tk-msg';
  PORT.orders.unshift({id:Date.now(),time:new Date().toLocaleTimeString('en-IN'),sym,side:_tkSide,qty,price,status:'EXECUTED'});
  if(_tkSide==='BUY'){PORT.cash-=price*qty;const pos=PORT.positions.find(p=>p.sym===sym);
    if(pos){pos.avgPrice=(pos.avgPrice*pos.qty+price*qty)/(pos.qty+qty);pos.qty+=qty}
    else PORT.positions.push({sym,qty,avgPrice:price});}
  else{PORT.cash+=price*qty;const pos=PORT.positions.find(p=>p.sym===sym);pos.qty-=qty;if(pos.qty<=0)PORT.positions=PORT.positions.filter(p=>p.sym!==sym)}
  savePORT();toast(`${_tkSide} ${qty} ${sym} @ ₹${fmtP(price)} executed`,'ok');
  buildTicket();if(CHART)CHART.lines=buildOrderLines(sym);}

function renderOrdersInBottom(){
  const body=$('#chartBbody');if(!body)return;
  if(!PORT.orders.length){body.innerHTML='<div class="empty" style="font-size:12px;padding:16px">No orders yet.</div>';return}
  body.innerHTML=`<table><thead><tr><th>Time</th><th>Symbol</th><th>Side</th><th class="r">Qty</th><th class="r">Price</th><th>Status</th></tr></thead><tbody>${PORT.orders.slice(0,20).map(o=>`<tr><td>${o.time}</td><td>${esc(o.sym)}</td><td class="${o.side==='BUY'?'up':'down'}">${o.side}</td><td class="r">${o.qty}</td><td class="r">₹${fmtP(o.price)}</td><td><span class="badge b-info">${o.status}</span></td></tr>`).join('')}</tbody></table>`}

/* ===================== Orders View ===================== */
function renderOrders(){
  const el=$('#v-orders');if(!el)return;
  const totalPnl=PORT.positions.reduce((s,p)=>s+portPnl(p.sym),0);
  const mv=PORT.positions.reduce((s,p)=>{const sym=SYM(p.sym);return s+(sym?sym.last*p.qty:p.avgPrice*p.qty)},0);
  el.innerHTML=`<div class="page"><div class="page-h"><h1>Portfolio</h1></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px">
      <div class="card" style="padding:14px"><small class="muted">Cash</small><b style="display:block;font-size:18px;margin-top:3px">₹${fmtP(PORT.cash)}</b></div>
      <div class="card" style="padding:14px"><small class="muted">Market Value</small><b style="display:block;font-size:18px;margin-top:3px">₹${fmtP(mv)}</b></div>
      <div class="card" style="padding:14px"><small class="muted">Unrealised P&amp;L</small><b style="display:block;font-size:18px;margin-top:3px" class="${cls(totalPnl)}">${totalPnl>=0?'+':''}₹${fmtP(Math.abs(totalPnl))}</b></div>
      <div class="card" style="padding:14px"><small class="muted">Total Value</small><b style="display:block;font-size:18px;margin-top:3px">₹${fmtP(PORT.cash+mv)}</b></div>
    </div>
    ${PORT.positions.length?`<div class="card" style="margin-bottom:14px"><div class="card-h">${I('portfolio',14)}<h3>Positions</h3></div>
      <div class="tbl-wrap"><table><thead><tr><th>Symbol</th><th class="r">Qty</th><th class="r">Avg Price</th><th class="r">LTP</th><th class="r">P&amp;L</th><th class="r">P&amp;L %</th></tr></thead><tbody>
      ${PORT.positions.map(p=>{const s=SYM(p.sym);const ltp=s?.last||p.avgPrice;const pl=(ltp-p.avgPrice)*p.qty;const plPct=(ltp/p.avgPrice-1)*100;
        return`<tr><td><b>${esc(p.sym)}</b></td><td class="r">${p.qty}</td><td class="r">₹${fmtP(p.avgPrice)}</td><td class="r">₹${fmtP(ltp)}</td><td class="r ${cls(pl)}">${pl>=0?'+':''}₹${fmtP(Math.abs(pl))}</td><td class="r ${cls(plPct)}">${plPct>=0?'+':''}${fmtP(plPct)}%</td></tr>`}).join('')}
      </tbody></table></div></div>`:''}
    ${PORT.orders.length?`<div class="card"><div class="card-h">${I('list',14)}<h3>Order History</h3><button class="btn sm" onclick="if(confirm('Clear all orders?')){PORT.orders=[];savePORT();renderOrders()}">Clear</button></div>
      <div class="tbl-wrap"><table><thead><tr><th>Time</th><th>Symbol</th><th>Side</th><th class="r">Qty</th><th class="r">Price</th><th>Status</th></tr></thead><tbody>
      ${PORT.orders.slice(0,50).map(o=>`<tr><td>${o.time}</td><td><b>${esc(o.sym)}</b></td><td class="${o.side==='BUY'?'up':'down'}">${o.side}</td><td class="r">${o.qty}</td><td class="r">₹${fmtP(o.price)}</td><td><span class="badge b-info">${o.status}</span></td></tr>`).join('')}
      </tbody></table></div></div>`:'<div class="card"><div class="empty">No orders yet. Use the chart view to paper trade.</div></div>'}
  </div>`}

/* ===================== Navigation ===================== */
const TABS=[
  {id:'v-markets', label:'Markets',   icon:'globe',    render:renderMarkets},
  {id:'v-chart',   label:'Chart',     icon:'chart',    render:renderChartView},
  {id:'v-scanner', label:'Scanner',   icon:'scan',     render:renderScanner},
  {id:'v-calls',   label:'Calls',     icon:'bolt',     render:renderCalls},
  {id:'v-orders',  label:'Portfolio', icon:'portfolio',render:renderOrders},
];
let currentTab='';

function switchTab(id){
  if(currentTab===id&&id!=='v-chart')return;
  currentTab=id;
  $$('.view').forEach(v=>v.classList.remove('on'));
  const el=$('#'+id);if(el)el.classList.add('on');
  $$('#mainNav button').forEach(b=>{b.classList.toggle('on',b.dataset.tab===id)});
  const tab=TABS.find(t=>t.id===id);
  if(tab){readTheme();tab.render();}
  if(id==='v-chart')startTick();}

function buildNav(){
  const nav=$('#mainNav');if(!nav)return;
  nav.innerHTML=TABS.map(t=>`<button data-tab="${t.id}" onclick="switchTab('${t.id}')">${I(t.icon,14)} ${t.label}</button>`).join('');}

/* ===================== Theme ===================== */
function applyTheme(dark){document.documentElement.dataset.theme=dark?'dark':'light';readTheme();if(CHART)CHART.req();updateThemeBtn(dark)}
function updateThemeBtn(dark){const b=$('#themeBtn');if(b)b.innerHTML=I(dark?'sun':'moon',16)}
$('#themeBtn')?.addEventListener('click',()=>{applyTheme(document.documentElement.dataset.theme!=='dark')});

/* ===================== Settings Modal ===================== */
function openSettings(){
  const modal=$('#settingsModal');if(!modal)return;
  const inp=$('#tokenInput');if(inp)inp.value=upstox.token;
  updateTokenStatus();
  modal.classList.add('on');
  setTimeout(()=>inp?.focus(),80);
}
function closeSettings(){$('#settingsModal')?.classList.remove('on')}
function toggleTokenVis(){
  const inp=$('#tokenInput'),btn=$('#tokenShowBtn');if(!inp)return;
  const show=inp.type==='password';
  inp.type=show?'text':'password';
  if(btn)btn.innerHTML=I(show?'eyeoff':'eye',14);
}
function saveToken(){
  const val=$('#tokenInput')?.value.trim()||'';
  upstox.token=val;
  updateTokenStatus();
  if(val){
    toast('Upstox token saved — fetching live data…','ok');
    refreshData();
    // restart tick with live interval
    if(_tickTimer){clearInterval(_tickTimer);_tickTimer=null}
    startTick();
  } else {
    toast('Token cleared — using simulated data');
    if(_tickTimer){clearInterval(_tickTimer);_tickTimer=null}
    startTick();
  }
}
function updateTokenStatus(){
  const el=$('#tokenStatus');if(!el)return;
  const has=!!upstox.token;
  el.className='token-status'+(has?' ok':'');
  el.innerHTML=has
    ?`${I('check',14,'2')}<span class="up">Token active — Upstox live data enabled</span>`
    :`${I('x',14,'2')}<span class="muted">No token — using simulated / backend data</span>`;
}
function _initSettingsBtn(){
  const btn=$('#settingsBtn');if(btn)btn.innerHTML=I('gear',16);
  const closeBtn=$('#modalCloseBtn');if(closeBtn)closeBtn.innerHTML=I('x',16);
  const showBtn=$('#tokenShowBtn');if(showBtn)showBtn.innerHTML=I('eye',14);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSettings()});


async function checkTokenHealth(){try{const r=await api.get('/api/m/health');let b=document.getElementById('tokBanner');
  if(!r||r.state==='ok'){b&&b.remove();return}
  if(!b){b=document.createElement('div');b.id='tokBanner';b.setAttribute('role','alert');b.style.cssText='display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;font-size:12.5px;border-bottom:1px solid var(--line);';document.body.insertBefore(b,document.body.firstChild)}
  const warn=r.state==='expiring';b.style.background=warn?'var(--warn-bg,#2B2210)':'var(--down-bg,#2D1418)';b.style.color=warn?'var(--warn,#E3A846)':'var(--down,#F7525F)';
  b.innerHTML='<b>'+(warn?'Token expiring':r.state==='expired'?'Data feed stopped':r.state==='missing'?'Data feed not set up':'Data feed issue')+'</b> '+esc(r.message)+'<button class="btn sm" style="margin-left:auto" onclick="this.parentNode.remove()">Dismiss</button>'}catch(e){}}


/* ===================== Global futures charts + live news bar ===================== */
const GLOBSYM={};
function openGlobalChart(id){const c=((DATA.global&&DATA.global.commodities)||[]).find(x=>x.id===id);if(!c||c.chart===false){toast('Price only - this instrument has no chart feed','info');return}
  const s=GLOBSYM[c.name]||(GLOBSYM[c.name]={s:c.name,n:c.name,ex:c.label||'Global',cls:'Global',sec:'Global',tv:id,dp:2,vol:.01,vb:1e5,dvol:0,unit:'units'});
  Object.assign(s,{last:c.price,p:c.price,prev:c.price-c.chg,chg:c.chg,chgPct:c.chgPct,hi:s.hi||c.price,lo:s.lo||c.price});
  ACTIVE.sym=s;if($('#v-chart.on'))selectSym(s);else switchTab('v-chart')}
function syncGlobalChart(){const s=ACTIVE.sym;if(!s||!s.tv||!DATA.global)return;const c=(DATA.global.commodities||[]).find(x=>x.id===s.tv);if(!c)return;
  Object.assign(s,{last:c.price,prev:c.price-c.chg,chg:c.chg,chgPct:c.chgPct,hi:Math.max(s.hi||0,c.price),lo:Math.min(s.lo||c.price,c.price)});
  const d=CACHE[s.s+'|'+ACTIVE.tf.k];if(d&&d.length&&CHART&&$('#v-chart.on')){const b=d[d.length-1];b.c=c.price;b.h=Math.max(b.h,c.price);b.l=Math.min(b.l,c.price);CHART.setData(d,s,ACTIVE.tf,true);updateSymbar()}}
async function refreshGlobalCandles(){const s=ACTIVE.sym;if(!s||!s.tv||!$('#v-chart.on'))return;
  try{const r=await api.get('/api/m/gcandles?id='+encodeURIComponent(s.tv)+'&tf='+ACTIVE.tf.k);if(r&&r.bars&&r.bars.length&&ACTIVE.sym===s){const k=s.s+'|'+ACTIVE.tf.k;CACHE[k]=r.bars;CACHE[k]._real=1;CACHE[k]._ts=Date.now();CHART.setData(r.bars,s,ACTIVE.tf,true)}}catch(e){}}
setInterval(syncGlobalChart,3000);setInterval(refreshGlobalCandles,30000);
async function loadNewsBar(){try{const r=await api.get('/api/news');const items=((r&&r.items)||[]).filter(n=>n.title).slice(0,24),bar=document.getElementById('newsBar');if(!bar)return;
  if(!items.length){bar.hidden=true;document.documentElement.style.setProperty('--nb','0px');return}
  const html=items.map(n=>`<a href="${esc(n.link||'#')}" target="_blank" rel="noopener"><b>${esc((n.source||'News').toUpperCase())}</b>${esc(n.title)}</a>`).join('<i class="nb-dot">●</i>');
  const total=items.reduce((a,n)=>a+(n.title||'').length+14,0);
  bar.innerHTML=`<span class="nb-l"><i></i>LIVE NEWS</span><div class="nb-track"><div class="nb-run" style="animation-duration:${Math.max(80,Math.round(total/8))}s">${html}<i class="nb-dot">●</i>${html}</div></div>`;
  bar.hidden=false;document.documentElement.style.setProperty('--nb',(bar.offsetHeight||30)+'px')}catch(e){}}

/* ===================== Boot ===================== */
(async()=>{
  readTheme();
  buildNav();
  updateThemeBtn(true);
  _initSettingsBtn();
  updateTokenStatus();
  switchTab('v-markets');
  pullQuotes().then(ok=>{if(ok){renderTicker();if($('#v-markets.on'))renderMarkets()}});
  const loadGlobal=()=>api.get('/api/market/global').then(g=>{if(g){DATA.global=g;renderTicker();if($('#v-markets.on'))renderMarkets()}}).catch(()=>{});loadGlobal();setInterval(loadGlobal,3000);
  await refreshData();
  setInterval(refreshData,30000);
  checkTokenHealth();setInterval(checkTokenHealth,1800000);
  loadNewsBar();setInterval(loadNewsBar,600000);
})();
</script>
