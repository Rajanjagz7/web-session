const sgn=x=>x>0?1:x<0?-1:0;
const kindOf=s=>s&&s.ikey?'option':s&&s.tv?'global':s&&s.cls==='Index'?'index':'stock';
function calcCharges(side,value,kind){const buy=side==='buy',opt=kind==='option',r=x=>+x.toFixed(2);
  if(kind==='global')return{brk:0,stt:0,txn:0,sebi:0,stamp:0,gst:0,total:0};
  const brk=value>0?(opt?20:Math.min(20,value*0.0003)):0,stt=buy?0:value*(opt?0.001:0.00025),txn=value*(opt?0.00035:0.0000297),sebi=value*0.000001,stamp=buy?value*0.00003:0,gst=(brk+txn+sebi)*0.18;
  return{brk:r(brk),stt:r(stt),txn:r(txn),sebi:r(sebi),stamp:r(stamp),gst:r(gst),total:r(brk+stt+txn+sebi+stamp+gst)}}
/* one ledger row per fill: price, charges, realised P&L, and the SL/target in force */
function mkTrade(o,before){const s=SYM(o.sym)||{},sg=o.side==='buy'?1:-1,value=+(o.qty*o.price).toFixed(2),ch=calcCharges(o.side,value,kindOf(s));
  const closes=before.q!==0&&sgn(before.q)!==sg,closeQty=closes?Math.min(Math.abs(before.q),o.qty):0,realized=closes?+((o.price-before.avg)*closeQty*sgn(before.q)).toFixed(2):0;
  return{id:o.id,t:o.t,day:istDay(o.t),sym:o.sym,name:s.n||o.sym,kind:kindOf(s),side:o.side,qty:o.qty,price:o.price,value,charges:ch.total,chg:ch,closeQty,realized,net:+(realized-ch.total).toFixed(2),

  if(!days.length){host.innerHTML='<div class="empty">No trading days in this period.</div>';return}
  const vals=days.map(d=>m[d]),mx=Math.max(1,...vals.map(Math.abs)),W=Math.max(320,days.length*34),H=150,mid=H/2;
  host.innerHTML=`<div class="jr-svgwrap"><svg viewBox="0 0 ${W} ${H+22}" width="${W}" height="${H+22}" role="img" aria-label="Daily net profit and loss"><line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="var(--line)"/>${days.map((d,i)=>{const v=vals[i],h=Math.max(2,Math.abs(v)/mx*(mid-14)),x=i*34+6;return`<g><title>${dLbl(d)}: ${smoney(v)}</title><rect x="${x}" y="${v>=0?mid-h:mid}" width="22" height="${h}" rx="3" fill="${v>=0?'var(--up)':'var(--down)'}" opacity=".85" data-jr="day:${d}" style="cursor:pointer"/><text x="${x+11}" y="${H+14}" text-anchor="middle" font-size="9.5" fill="var(--text-3)">${d.slice(8)}/${d.slice(5,7)}</text></g>`}).join('')}</svg></div>`}
function jCSV(){const rows=jFilter(TRADES).sort((a,b)=>a.t-b.t),h=['id','date','time','symbol','kind','side','order_type','qty','price','value','charges','gross_pnl','net_pnl','position_after','source','stop_loss','target','tag','note'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv=[h.join(','),...rows.map(x=>[x.id,x.day,tAt(x.t),x.sym,x.kind,x.side,x.otype,x.qty,x.price,x.value,x.charges,x.closeQty?x.realized:'',x.net,x.posAfter,SRC_LBL[x.src]||x.src,x.plan&&x.plan.sl,x.plan&&x.plan.tp,x.tag,x.note].map(q).join(','))].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='paper-trades-'+istDay(Date.now())+'.csv';a.click();toast(rows.length+' trades exported','ok')}
function resetPaper(){if(!confirm('Reset the paper account to ₹'+START_CASH.toLocaleString('en-IN')+' and clear all positions, orders and journal entries?'))return;
  PORT.cash=START_CASH;PORT.base=START_CASH;PORT.positions=[];PORT.orders=[];PORT.pending=[];TRADES=[];savePORT();saveTrades();if(CHART)CHART.lines=[];refreshTradeUI(ACTIVE.sym&&ACTIVE.sym.s);toast('Paper account reset','ok');RN.emit('N-12',{amount:'₹'+START_CASH.toLocaleString('en-IN')+'.00',note:'Paper account funded'},{key:'fund|'+Date.now()})}
document.addEventListener('click',e=>{
  const c=e.target.closest('#v-orders [data-close]');if(c){closePos(c.dataset.close,'manual');return}
  const cn=e.target.closest('#v-orders [data-cancel]');if(cn){cancelPending(cn.dataset.cancel);return}
  const t=e.target.closest('#v-orders [data-jr]');if(!t||!$('#v-orders.on'))return;const[k,...r]=t.dataset.jr.split(':'),v=r.join(':');
  if(k==='range'){JR.range=v;JR.page=0}else if(k==='kind'){JR.kind=v;JR.page=0}else if(k==='side'){JR.side=v;JR.page=0}else if(k==='tab'){JR.tab=v;JR.page=0}else if(k==='page'){JR.page=Math.max(0,+v)}
  else if(k==='day'){JR.range='day';JR.day=v;JR.page=0;if(JR.tab==='days')JR.tab='trades'}
  else if(k==='toggle'){if(e.target.closest('select,textarea,input'))return;JR.open[v]=!JR.open[v]}
  else if(k==='csv'){jCSV();return}else if(k==='reset'){resetPaper();return}
  renderOrders()});
document.addEventListener('change',e=>{const d=e.target.dataset||{};
  if(e.target.id==='jrDay'&&e.target.value){JR.range='day';JR.day=e.target.value;JR.page=0;renderOrders()}
  else if(e.target.id==='jrSize'){JR.size=+e.target.value;JR.page=0;renderOrders()}
  else if(d.jtag){const x=TRADES.find(t=>t.id==d.jtag);if(x){x.tag=e.target.value;saveTrades()}}
  else if(d.psl||d.ptp){const sym=d.psl||d.ptp,p=PORT.positions.find(y=>y.sym===sym);if(!p)return;const v=parseFloat(e.target.value),L=p.qty>0;
    if(d.psl){if(v>0&&(L?v>=p.avgPrice:v<=p.avgPrice)){toast('Stop-loss must be '+(L?'below':'above')+' the average price','bad');e.target.value=p.sl||'';return}p.sl=v>0?v:null}
    else{if(v>0&&(L?v<=p.avgPrice:v>=p.avgPrice)){toast('Target must be '+(L?'above':'below')+' the average price','bad');e.target.value=p.tp||'';return}p.tp=v>0?v:null}
    savePORT();if(CHART&&ACTIVE.sym&&ACTIVE.sym.s===sym)CHART.lines=buildOrderLines(sym);if($('#ticket'))buildTicket();toast('Updated '+(d.psl?'stop-loss':'target')+' for '+sym,'ok');checkExits()}});
document.addEventListener('input',e=>{
  if(e.target.id==='jrQ'){JR.q=e.target.value;JR.page=0;renderOrders();const q=$('#jrQ');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
  else if(e.target.dataset&&e.target.dataset.jnote){const x=TRADES.find(t=>t.id==e.target.dataset.jnote);if(x){x.note=e.target.value;saveTrades()}}});
/* keep everything live: journal, bottom panel and ticket refresh themselves (never while typing) */
setInterval(()=>{const a=document.activeElement,typing=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName);
  if($('#v-orders.on')&&!typing)renderOrders();
  if(bottomIsOrders()&&!typing)renderOrdersInBottom();
  updTicketLive();updNavBadge()},2000);

/* ===================== Navigation ===================== */
const TABS=[
  {id:'v-markets', label:'Markets',   icon:'globe',    render:renderMarkets},
  {id:'v-chart',   label:'Chart',     icon:'chart',    render:renderChartView},
  {id:'v-scanner', label:'Scanner',   icon:'scan',     render:renderScanner},
  {id:'v-calls',   label:'Calls',     icon:'bolt',     render:renderCalls},
  {id:'v-orders',  label:'Journal',   icon:'portfolio',render:renderOrders},
];
let currentTab='';

function switchTab(id){
  if(currentTab===id&&id!=='v-chart')return;
  currentTab=id;
  $$('.view').forEach(v=>v.classList.remove('on'));
  const el=$('#'+id);if(el)el.classList.add('on');
  $$('#mainNav button').forEach(b=>{b.classList.toggle('on',b.dataset.tab===id)});
  const tab=TABS.find(t=>t.id===id);
  if(tab){readTheme();tab.render();}
  if(id==='v-chart')startTick();}

function buildNav(){
  const nav=$('#mainNav');if(!nav)return;
  nav.innerHTML=TABS.map(t=>`<button data-tab="${t.id}" onclick="switchTab('${t.id}')">${I(t.icon,14)} ${t.label}</button>`).join('');}

/* ===================== Theme ===================== */
function applyTheme(dark){document.documentElement.dataset.theme=dark?'dark':'light';readTheme();if(CHART)CHART.req();updateThemeBtn(dark)}
function updateThemeBtn(dark){const b=$('#themeBtn');if(b)b.innerHTML=I(dark?'sun':'moon',16)}
$('#themeBtn')?.addEventListener('click',()=>{applyTheme(document.documentElement.dataset.theme!=='dark')});

/* ===================== Settings Modal ===================== */
function openSettings(){
  const modal=$('#settingsModal');if(!modal)return;
  const inp=$('#tokenInput');if(inp)inp.value=upstox.token;
  updateTokenStatus();
  modal.classList.add('on');
  setTimeout(()=>inp?.focus(),80);
}
function closeSettings(){$('#settingsModal')?.classList.remove('on')}
function toggleTokenVis(){
  const inp=$('#tokenInput'),btn=$('#tokenShowBtn');if(!inp)return;
  const show=inp.type==='password';
  inp.type=show?'text':'password';
  if(btn)btn.innerHTML=I(show?'eyeoff':'eye',14);
}
function saveToken(){
  const val=$('#tokenInput')?.value.trim()||'';
  upstox.token=val;
  updateTokenStatus();
  if(val){
    toast('Upstox token saved — fetching live data…','ok');
    refreshData();
    // restart tick with live interval
    if(_tickTimer){clearInterval(_tickTimer);_tickTimer=null}
    startTick();
  } else {
    toast('Token cleared — using simulated data');
    if(_tickTimer){clearInterval(_tickTimer);_tickTimer=null}
    startTick();
  }
}
function updateTokenStatus(){
  const el=$('#tokenStatus');if(!el)return;
  const has=!!upstox.token;
  el.className='token-status'+(has?' ok':'');
  el.innerHTML=has
    ?`${I('check',14,'2')}<span class="up">Token active — Upstox live data enabled</span>`
    :`${I('x',14,'2')}<span class="muted">No token — using simulated / backend data</span>`;
}
function _initSettingsBtn(){
  const btn=$('#settingsBtn');if(btn)btn.innerHTML=I('gear',16);
  const closeBtn=$('#modalCloseBtn');if(closeBtn)closeBtn.innerHTML=I('x',16);
  const showBtn=$('#tokenShowBtn');if(showBtn)showBtn.innerHTML=I('eye',14);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSettings()});


async function checkTokenHealth(){try{const r=await api.get('/api/m/health');let b=document.getElementById('tokBanner');
  if(!r||r.state==='ok'){b&&b.remove();return}
  if(!b){b=document.createElement('div');b.id='tokBanner';b.setAttribute('role','alert');b.style.cssText='display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;font-size:12.5px;border-bottom:1px solid var(--line);';document.body.insertBefore(b,document.body.firstChild)}
  const warn=r.state==='expiring';b.style.background=warn?'var(--warn-bg,#2B2210)':'var(--down-bg,#2D1418)';b.style.color=warn?'var(--warn,#E3A846)':'var(--down,#F7525F)';
  b.innerHTML='<b>'+(warn?'Token expiring':r.state==='expired'?'Data feed stopped':r.state==='missing'?'Data feed not set up':'Data feed issue')+'</b> '+esc(r.message)+'<button class="btn sm" style="margin-left:auto" onclick="this.parentNode.remove()">Dismiss</button>'}catch(e){}}


/* ===================== Global futures charts + live news bar ===================== */
const GLOBSYM={};
function openGlobalChart(id){const c=((DATA.global&&DATA.global.commodities)||[]).find(x=>x.id===id);if(!c||c.chart===false){toast('Price only - this instrument has no chart feed','info');return}
  const s=GLOBSYM[c.name]||XSYM[c.name]||{s:c.name,n:c.name,ex:c.label||'Global',cls:'Global',sec:'Global',tv:id,dp:2,vol:.01,vb:1e5,dvol:0,unit:'units'};
  GLOBSYM[c.name]=s;XSYM[c.name]=s;
  Object.assign(s,{last:c.price,p:c.price,prev:c.price-c.chg,chg:c.chg,chgPct:c.chgPct,hi:s.hi||c.price,lo:s.lo||c.price});
  ACTIVE.sym=s;if($('#v-chart.on'))selectSym(s);else switchTab('v-chart')}
function syncGlobalChart(){const s=ACTIVE.sym;if(!s||!s.tv||!DATA.global)return;const c=(DATA.global.commodities||[]).find(x=>x.id===s.tv);if(!c)return;
  Object.assign(s,{last:c.price,prev:c.price-c.chg,chg:c.chg,chgPct:c.chgPct,hi:Math.max(s.hi||0,c.price),lo:Math.min(s.lo||c.price,c.price)});
  const d=CACHE[s.s+'|'+ACTIVE.tf.k];if(d&&d.length&&CHART&&$('#v-chart.on')){const b=d[d.length-1];b.c=c.price;b.h=Math.max(b.h,c.price);b.l=Math.min(b.l,c.price);CHART.setData(d,s,ACTIVE.tf,true);updateSymbar()}}
async function refreshGlobalCandles(){const s=ACTIVE.sym;if(!s||!s.tv||!$('#v-chart.on'))return;
  try{const r=await api.get('/api/m/gcandles?id='+encodeURIComponent(s.tv)+'&tf='+ACTIVE.tf.k);if(r&&r.bars&&r.bars.length&&ACTIVE.sym===s){const k=s.s+'|'+ACTIVE.tf.k;CACHE[k]=r.bars;CACHE[k]._real=1;CACHE[k]._ts=Date.now();CHART.setData(r.bars,s,ACTIVE.tf,true)}}catch(e){}}
setInterval(syncGlobalChart,3000);setInterval(refreshGlobalCandles,30000);
async function loadNewsBar(){try{const r=await api.get('/api/news');const items=((r&&r.items)||[]).filter(n=>n.title).slice(0,24),bar=document.getElementById('newsBar');if(!bar)return;
  if(!items.length){bar.hidden=true;document.documentElement.style.setProperty('--nb','0px');return}
  const html=items.map(n=>`<a href="${esc(n.link||'#')}" target="_blank" rel="noopener"><b>${esc((n.source||'News').toUpperCase())}</b>${esc(n.title)}</a>`).join('<i class="nb-dot">●</i>');
  const total=items.reduce((a,n)=>a+(n.title||'').length+14,0);
  bar.innerHTML=`<span class="nb-l"><i></i>LIVE NEWS</span><div class="nb-track"><div class="nb-run" style="animation-duration:${Math.max(80,Math.round(total/8))}s">${html}<i class="nb-dot">●</i>${html}</div></div>`;
  bar.hidden=false;document.documentElement.style.setProperty('--nb',(bar.offsetHeight||30)+'px')}catch(e){}}

/* ===================== Boot ===================== */
(async()=>{
  readTheme();
  buildNav();
  updateThemeBtn(true);
  _initSettingsBtn();
  updateTokenStatus();
  RN.init({bell:'#rnBell',
    price(sym){const s=SYM(sym);if(!s||!(s.last>0))return null;return{last:s.last,prev:s.prev,chgPct:isFinite(s.chgPct)&&s.chgPct!==0?s.chgPct:(s.prev>0?(s.last/s.prev-1)*100:0),market:s.tv?'GLOBAL':'NSE'}},
    marketOpen(){return window.MKT_OPEN!==false},
    symbols(){const seen=new Set(),out=[];[...NSE_SYMS,...Object.values(XSYM),...((scanState.uni&&scanState.uni.stocks)||[])].forEach(x=>{if(x&&x.s&&!seen.has(x.s)){seen.add(x.s);out.push({s:x.s,n:x.n})}});return out},
    openLink(l){if(l.sym)selectSymAndSwitch(l.sym);else if(l.tab)switchTab(l.tab)},
    onAlerts(){if(CHART&&ACTIVE.sym)CHART.lines=buildOrderLines(ACTIVE.sym.s)}});
  switchTab('v-markets');
  pullQuotes().then(ok=>{if(ok){renderTicker();if($('#v-markets.on'))renderMarkets()}});
  const loadGlobal=()=>api.get('/api/market/global').then(g=>{if(g){DATA.global=g;renderTicker();if($('#v-markets.on'))renderMarkets()}}).catch(()=>{});loadGlobal();setInterval(loadGlobal,3000);
  await refreshData();
  setInterval(refreshData,30000);
  checkTokenHealth();setInterval(checkTokenHealth,1800000);
  loadNewsBar();setInterval(loadNewsBar,600000);
})();
</script>
