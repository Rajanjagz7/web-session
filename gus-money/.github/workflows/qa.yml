name: QA - Gus Money Users

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  ADMIN_BASE_URL: ${{ vars.ADMIN_BASE_URL || 'https://gusdev.softwareco.com' }}
  # Credentials live in GitHub Secrets - never in the repo
  ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Quality gate: any failing test fails the job; coverage of the api package must be >= 80%
      - run: python -m pytest --cov=api --cov-fail-under=80 --alluredir=reports/allure-api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-reports
          path: reports/

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Quality gate: any failure fails the job (retries=2 in CI absorb flakiness only)
      - run: npx playwright test --project=chromium
        env:
          ALLURE: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-reports
          path: |
            playwright-report/
            reports/
            allure-results/
            test-results/
