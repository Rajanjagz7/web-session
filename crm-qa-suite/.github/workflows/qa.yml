# Move this folder's .github/workflows/qa.yml to the repository root .github/workflows/ if the suite
# lives in a subdirectory (adjust `working-directory` / paths accordingly: here SUITE_DIR).
name: CRM QA

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"   # nightly

env:
  SUITE_DIR: crm-qa-suite
  CRM_BASE_URL: ${{ vars.CRM_BASE_URL }}
  CRM_PROJECT_ID: ${{ vars.CRM_PROJECT_ID }}
  CRM_EMAIL: ${{ secrets.CRM_EMAIL }}         # secrets only; never echo them
  CRM_PASSWORD: ${{ secrets.CRM_PASSWORD }}
  GATE_MIN_PASS_RATE: "100"
  GATE_MIN_TESTS: "20"
  CI: "true"

concurrency:
  group: crm-qa-${{ github.ref }}   # the suite shares one staging project; never run two at once
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "${{ env.SUITE_DIR }}/api/requirements.txt" }
      - run: pip install -r api/requirements.txt
        working-directory: ${{ env.SUITE_DIR }}
      - run: python -m pytest -q --alluredir=../allure-results
        working-directory: ${{ env.SUITE_DIR }}/api
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: api-reports, path: "${{ env.SUITE_DIR }}/reports\n${{ env.SUITE_DIR }}/allure-results" }

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: api            # api tests also clean up their data first; serialises use of the shared project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "${{ env.SUITE_DIR }}/ui/package-lock.json" }
      - run: npm ci
        working-directory: ${{ env.SUITE_DIR }}/ui
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: ${{ env.SUITE_DIR }}/ui
      - run: npx playwright test
        working-directory: ${{ env.SUITE_DIR }}/ui
        env: { ALLURE: "1" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-reports
          path: |
            ${{ env.SUITE_DIR }}/reports
            ${{ env.SUITE_DIR }}/ui/test-results
            ${{ env.SUITE_DIR }}/allure-results

  quality-gate:
    runs-on: ubuntu-latest
    needs: [api, ui]
    if: always()           # evaluate even if an upstream job failed, so the gate is the single source of truth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: "${{ env.SUITE_DIR }}/reports-in" }
      - name: Collect JUnit files
        run: |
          mkdir -p "$SUITE_DIR/reports"
          find "$SUITE_DIR/reports-in" -name '*-junit.xml' -exec cp {} "$SUITE_DIR/reports/" \;
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install defusedxml
      - run: python scripts/check_gates.py
        working-directory: ${{ env.SUITE_DIR }}
